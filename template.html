<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교원인사 온톨로지</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Pretendard Variable';
  src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
  font-weight: 45 920;
  font-display: swap;
}
:root {
  --bg: #FAF7F0; --ink: #1A1A18; --accent: #1E3A5F; --danger: #A63A2E;
  --rule: #D8D2C4; --surface: #FFFFFF; --surface-2: #F1EDE3;
  --ch0: #8A8578; --ch1: #3B3A36; --ch2: #1E3A5F; --ch3: #2E6E65;
  --ch4: #4A6B2A; --ch5: #A63A2E; --ch6: #B07D2B; --ch7: #6B4A7E;
  --font-display: 'Noto Serif KR', 'MaruBuri', Batang, serif;
  --font-body: 'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
  --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 40px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14140F; --ink: #E8E4DA; --accent: #7FA3C8; --danger: #C25B4C;
    --rule: #2E2C26; --surface: #1C1C16; --surface-2: #232319;
    /* 다크모드 전용 장색 보정 — 라이트모드 원색은 배경 대비 WCAG 3:1 미달(ch1 1.62:1, ch2 1.61:1,
       ch5 2.87:1, ch7 2.56:1)이라 그래프 점·게이트 테두리 등 그래픽 요소로 쓰기엔 너무 어두움.
       색상군은 유지한 채 밝기만 올림(전부 3:1 이상 확보). */
    --ch1: #9C9890; --ch2: #7FA3C8; --ch5: #D4685A; --ch7: #B090C4;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 17px; line-height: 1.75; font-feature-settings: 'tnum' 1;
}
h1, h2, h3, .display { font-family: var(--font-display); }
h1 { font-size: 40px; margin: 0 0 var(--space-2); }
h2 { font-size: 28px; margin: var(--space-3) 0 var(--space-1); }
a { color: var(--accent); }
table { font-variant-numeric: tabular-nums; border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--rule); padding: var(--space-1) var(--space-2); text-align: left; }

#app-header { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--rule); font-family: var(--font-display); }
.build-info { font-family: var(--font-body); font-size: 11px; opacity: .5; margin-top: 4px; }
.app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 60px); }
.app-shell > aside { border-right: 1px solid var(--rule); padding: var(--space-3); }
.app-shell > main { padding: var(--space-4); overflow-y: auto; }
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .app-shell > aside { display: none; }
}

#left-nav { font-family: var(--font-body); }
.left-nav-chapters { display: flex; flex-direction: column; gap: 2px; }
.left-nav-chapters a { display: flex; align-items: center; gap: 8px; padding: 6px 4px;
  text-decoration: none; color: var(--ink); border-radius: 4px; font-size: 15px; }
.left-nav-chapters a.active { background: var(--surface-2); font-weight: 600; }
.left-nav-divider { border: none; border-top: 1px solid var(--rule); margin: var(--space-2) 0; }
.left-nav-quicklinks { display: flex; flex-direction: column; gap: 2px; }
.left-nav-quicklinks a { display: block; padding: 6px 4px; text-decoration: none; color: var(--accent); font-size: 14px; }
.left-nav-quicklinks a.active { background: var(--surface-2); border-radius: 4px; font-weight: 600; }

.chip { display: inline-block; padding: 2px 10px; margin: 2px; border-radius: 12px;
  border: 1px solid var(--rule); font-size: 14px; text-decoration: none; color: var(--ink); }
.chip-law { background: var(--surface-2); }
.chip-num { background: var(--surface-2); font-variant-numeric: tabular-nums; }

.audit-warning {
  border: 2px solid var(--danger); border-radius: 4px; padding: var(--space-2);
  position: relative; margin-top: 14px;
  background: color-mix(in srgb, var(--danger) 8%, var(--surface));
}
.audit-warning::before {
  content: '⚠ 감사지적'; position: absolute; top: -10px; left: 12px;
  background: var(--danger); color: #fff; font-size: 12px; padding: 2px 8px;
  border-radius: 2px; font-family: var(--font-display);
}

@media print {
  #app-header, .app-shell > aside, .no-print { display: none !important; }
  .app-shell { display: block; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .print-chapter { page-break-after: always; }
  .print-chapter:last-child { page-break-after: auto; }
}
.graph-tooltip { position: fixed; display: none; background: var(--surface); border: 1px solid var(--rule);
  padding: 4px 10px; border-radius: 4px; font-size: 14px; pointer-events: none; z-index: 10; }

.node-card-header { border-left: 6px solid var(--chapter-color); padding-left: var(--space-3); }
.chapter-tag { display: block; text-transform: uppercase; font-size: 12px; letter-spacing: .06em;
  font-weight: 600; margin-bottom: 4px; }
.summary { font-size: 19px; opacity: .8; margin: 4px 0 var(--space-2); }
.qa-item { border-left: 3px solid var(--accent); padding-left: var(--space-2); margin: var(--space-1) 0; }
.qa-source { color: var(--ink); opacity: .6; font-size: 13px; }
.node-meta { margin-top: var(--space-3); padding-top: var(--space-1); border-top: 1px solid var(--rule); font-size: 13px; opacity: .7; }
.backlinks { margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--rule); }

.home-hero { padding: var(--space-4) 0 var(--space-3); border-bottom: 1px solid var(--rule); margin-bottom: var(--space-3); }
.home-hero h1 { margin-bottom: var(--space-1); }
.home-hero p { margin: 0 0 var(--space-2); opacity: .75; }
.home-links { display: flex; gap: var(--space-3); margin: var(--space-3) 0; flex-wrap: wrap; }
.home-links a { text-decoration: none; color: var(--accent); font-family: var(--font-display); }

.search-bar { width: 100%; max-width: 480px; padding: var(--space-1) var(--space-2); font-size: 17px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.search-results { max-width: 480px; }
.search-result { display: flex; align-items: center; gap: 8px; padding: 6px 4px; text-decoration: none; color: var(--ink); }
.chapter-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.chapter-node-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-2); margin-top: var(--space-2); }
.mini-card { display: block; border-left: 4px solid; padding: var(--space-2); background: var(--surface-2);
  text-decoration: none; color: var(--ink); border-radius: 4px; }
.mini-card-type { font-size: 12px; opacity: .6; }
.chapter-gate { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-2); margin: var(--space-3) 0; }
.chapter-gate-item { display: block; padding: var(--space-2); border-top: 4px solid var(--chapter-color);
  background: var(--surface-2); text-decoration: none; color: var(--ink); border-radius: 4px; }
.chapter-gate-item .chapter-num { font-family: var(--font-display); font-size: 24px; display: block; color: var(--chapter-color); }
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <a href="#/">교원인사 온톨로지</a>
    <button id="scope-toggle" class="no-print"></button>
    <div class="build-info">기준: 2026 교원인사 실무도우미(중등 2026.3.1./초등 2026.2.15.) · 빌드 2026-08-02</div>
  </header>
  <div class="app-shell">
    <aside id="left-nav"></aside>
    <main id="main">로딩 중…</main>
  </div>
</div>
<script>
const ONTOLOGY = __ONTOLOGY_DATA__;

const CHAPTER_NAMES = {0:'부록',1:'교육공무원 의의',2:'임용 일반',3:'휴직과 복직',
  4:'복무',5:'상훈 및 징계',6:'호봉 및 승급',7:'계약제 교원'};

function getScope() { return localStorage.getItem('ontology-scope') || '중등'; }
function setScope(scope) { localStorage.setItem('ontology-scope', scope); render(); }
function initScopeToggle() {
  const btn = document.getElementById('scope-toggle');
  const sync = () => { btn.textContent = getScope() === '중등' ? '중등 보기' : '초등 보기'; };
  sync();
  btn.addEventListener('click', () => { setScope(getScope() === '중등' ? '초등' : '중등'); sync(); });
}

function renderHome(main) {
  const chapters = [1,2,3,4,5,6,7,0];
  main.innerHTML = `
    <div class="home-hero">
      <h1 class="display">교원인사 온톨로지</h1>
      <p>2026 교원인사 실무도우미(중등·초등) 기반 지식 그래프</p>
      <input id="search-bar" class="search-bar" placeholder="검색 (예: 육아휴직, ㅇㅇㅎㅈ) — &quot;/&quot; 로 포커스" autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
    <nav class="chapter-gate">
      ${chapters.map(c => `
        <a href="#/chapter/${c}" class="chapter-gate-item" style="--chapter-color:var(--ch${c})">
          <span class="chapter-num">${c === 0 ? '' : c}</span>
          <span class="chapter-name">${CHAPTER_NAMES[c]}</span>
        </a>`).join('')}
    </nav>
    <div class="home-links">
      <a href="#/graph">전체 지식 지도 →</a>
      <a href="#/table">수치·기한 통합표 →</a>
      <a href="#/print">인쇄용 치트시트 →</a>
    </div>`;
  if (typeof initSearch === 'function') initSearch();
}

function parseHash() {
  return (location.hash.slice(1) || '/').split('/').filter(Boolean);
}

function render() {
  const parts = parseHash();
  const main = document.getElementById('main');
  if (parts.length === 0) return renderHome(main);
  if (parts[0] === 'graph' && typeof renderGraph === 'function') return renderGraph(main);
  if (parts[0] === 'node' && parts[1] && typeof renderNode === 'function') return renderNode(main, parts[1]);
  if (parts[0] === 'table' && typeof renderTable === 'function') return renderTable(main);
  if (parts[0] === 'chapter' && parts[1] && typeof renderChapterHub === 'function') return renderChapterHub(main, Number(parts[1]));
  if (parts[0] === 'print' && typeof renderPrint === 'function') return renderPrint(main);
  main.innerHTML = '<p>준비 중인 화면입니다.</p>';
}

function renderLeftNav() {
  const nav = document.getElementById('left-nav');
  if (!nav) return;
  const chapters = [1,2,3,4,5,6,7,0];
  nav.innerHTML = `
    <nav class="left-nav-chapters">
      ${chapters.map(c => `
        <a href="#/chapter/${c}"><span class="chapter-dot" style="background:var(--ch${c})"></span>${c === 0 ? '부록' : '제' + c + '장 ' + CHAPTER_NAMES[c]}</a>`).join('')}
    </nav>
    <hr class="left-nav-divider">
    <nav class="left-nav-quicklinks">
      <a href="#/graph">지식 지도</a>
      <a href="#/table">수치·기한 통합표</a>
      <a href="#/print">인쇄 치트시트</a>
    </nav>`;
  highlightLeftNav();
}

function highlightLeftNav() {
  const nav = document.getElementById('left-nav');
  if (!nav) return;
  const current = '#' + location.hash.slice(1);
  nav.querySelectorAll('a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === current);
  });
}

window.addEventListener('hashchange', () => { render(); highlightLeftNav(); });
window.addEventListener('DOMContentLoaded', () => { initScopeToggle(); renderLeftNav(); render(); });

function renderGraph(main) {
  main.innerHTML = '<canvas id="graph-canvas" style="width:100%;height:80vh;display:block"></canvas><div id="graph-tooltip" class="graph-tooltip"></div>';
  const canvas = document.getElementById('graph-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const nodes = ONTOLOGY.nodes, edges = ONTOLOGY.edges, layout = ONTOLOGY.layout;

  const xs = Object.values(layout).map(p => p.x);
  const ys = Object.values(layout).map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);

  let zoom = 1, panX = 0, panY = 0;

  function toScreen(id) {
    const w = canvas.clientWidth, h = canvas.clientHeight, pad = 60;
    const p = layout[id];
    const bx = pad + (p.x - minX) / (maxX - minX || 1) * (w - pad * 2);
    const by = pad + (p.y - minY) / (maxY - minY || 1) * (h - pad * 2);
    return { x: bx * zoom + panX, y: by * zoom + panY };
  }

  const chColor = c => getComputedStyle(document.documentElement).getPropertyValue(`--ch${c}`).trim();
  let hoverId = null;

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const neighborIds = hoverId
      ? new Set(edges.filter(e => e.source === hoverId || e.target === hoverId).flatMap(e => [e.source, e.target]))
      : null;

    edges.forEach(e => {
      const a = toScreen(e.source), b = toScreen(e.target);
      const dim = neighborIds && !(neighborIds.has(e.source) && neighborIds.has(e.target));
      ctx.strokeStyle = dim ? 'rgba(150,150,150,0.08)' : 'rgba(150,150,150,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });

    nodes.forEach(n => {
      const p = toScreen(n.id);
      const dim = neighborIds && !neighborIds.has(n.id) && n.id !== hoverId;
      ctx.globalAlpha = dim ? 0.15 : 1;
      ctx.fillStyle = chColor(n.chapter);
      ctx.beginPath();
      ctx.arc(p.x, p.y, n.id === hoverId ? 7 : 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function nodeAt(x, y) {
    for (const n of nodes) {
      const p = toScreen(n.id);
      if (Math.hypot(p.x - x, p.y - y) < 8) return n;
    }
    return null;
  }

  function resize() {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  let panStart = null, dragMoved = false;

  canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    dragMoved = false;
    // mousedown 히트가 노드면 클릭 후보로 남기고(팬 시작 안 함), 빈 공간이면 팬 시작
    panStart = nodeAt(mx, my) ? null : { x: mx, y: my, panX, panY };
  });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (panStart) {
      const dx = mx - panStart.x, dy = my - panStart.y;
      if (Math.hypot(dx, dy) > 4) {
        dragMoved = true;
        panX = panStart.panX + dx;
        panY = panStart.panY + dy;
        const tip = document.getElementById('graph-tooltip');
        tip.style.display = 'none';
        draw();
        return;
      }
    }
    const hit = nodeAt(mx, my);
    hoverId = hit ? hit.id : null;
    const tip = document.getElementById('graph-tooltip');
    if (hit) {
      tip.style.display = 'block';
      tip.style.left = e.clientX + 12 + 'px';
      tip.style.top = e.clientY + 12 + 'px';
      tip.textContent = hit.title;
    } else { tip.style.display = 'none'; }
    draw();
  });
  canvas.addEventListener('mouseup', () => { panStart = null; });
  canvas.addEventListener('mouseleave', () => { panStart = null; });
  canvas.addEventListener('click', e => {
    if (dragMoved) { dragMoved = false; return; }
    const rect = canvas.getBoundingClientRect();
    const hit = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
    if (hit) location.hash = `#/node/${hit.id}`;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const newZoom = Math.min(4, Math.max(0.5, zoom * factor));
    // 마우스 아래 있던 world 좌표가 줌 후에도 같은 화면 위치에 남도록 pan 보정
    const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
    panX = mx - wx * newZoom;
    panY = my - wy * newZoom;
    zoom = newZoom;
    draw();
  }, { passive: false });
  window.addEventListener('resize', resize);
  resize();
}

function findNode(id) { return ONTOLOGY.nodes.find(n => n.id === id); }
function edgesFrom(id) { return ONTOLOGY.edges.filter(e => e.source === id); }
function edgesTo(id) { return ONTOLOGY.edges.filter(e => e.target === id); }

function renderNode(main, id) {
  const n = findNode(id);
  if (!n) { main.innerHTML = '<p>노드를 찾을 수 없습니다.</p>'; return; }

  const outgoing = edgesFrom(id).map(e => ({ edge: e, node: findNode(e.target) })).filter(x => x.node);
  const incoming = edgesTo(id).map(e => ({ edge: e, node: findNode(e.source) })).filter(x => x.node);
  const group = type => outgoing.filter(x => x.edge.type === type);
  const chip = (label, href, cls) => `<a class="chip ${cls || ''}" href="${href}">${label}</a>`;

  const refsHtml = (n.refs || []).map(r => `<span class="chip chip-law">${r}</span>`).join(' ');
  const lawsHtml = group('근거법령').map(x => chip(x.node.title, `#/node/${x.node.id}`)).join(' ');
  const numsHtml = group('기한수치').map(x => chip(x.node.title, `#/node/${x.node.id}`, 'chip-num')).join(' ');
  const formsHtml = group('필요서식').map(x => chip(x.node.title, `#/node/${x.node.id}`)).join(' ');
  const qaHtml = group('관련해석').map(x =>
    `<div class="qa-item"><p>${x.node.summary}</p><p class="qa-source">${(x.node.refs || []).join(', ')}</p></div>`).join('');
  const noteEdges = group('유의');
  const auditNotes = noteEdges.filter(x => x.node.type === '감사지적사례');
  const otherNotes = noteEdges.filter(x => x.node.type !== '감사지적사례');
  const auditHtml = auditNotes.map(x => `<div class="audit-warning"><p>${x.node.summary}</p></div>`).join('');
  const noteChipsHtml = otherNotes.map(x => chip(x.node.title, `#/node/${x.node.id}`)).join(' ');
  const backlinksHtml = incoming.map(x => chip(x.node.title, `#/node/${x.node.id}`)).join(' ');

  const scope = getScope();
  const pages = n.pages || {};
  const pagesHtml = pages[scope]
    ? `${scope} ${pages[scope]}쪽` + (pages['공통'] ? ` · 공통 ${pages['공통']}쪽` : '')
    : Object.entries(pages).map(([k, v]) => `${k} ${v}쪽`).join(' · ');

  main.innerHTML = `
    <div class="node-card" style="--chapter-color: var(--ch${n.chapter})">
      <div class="node-card-header">
        <span class="chapter-tag" style="color:var(--ch${n.chapter})">제${n.chapter === 0 ? '부록' : n.chapter + '장'} · ${n.type}</span>
        <h1>${n.title}</h1>
        <p class="summary">${n.summary}</p>
      </div>
      <div class="node-card-body">${n.body || ''}</div>
      ${refsHtml ? `<section><h2>근거 조문</h2>${refsHtml}</section>` : ''}
      ${lawsHtml ? `<section><h2>관련 법령·개념</h2>${lawsHtml}</section>` : ''}
      ${numsHtml ? `<section><h2>기한·수치</h2>${numsHtml}</section>` : ''}
      ${formsHtml ? `<section><h2>필요 서식</h2>${formsHtml}</section>` : ''}
      ${qaHtml ? `<section><h2>관련 Q&A·유권해석</h2>${qaHtml}</section>` : ''}
      ${auditHtml ? `<section><h2>유의사항</h2>${auditHtml}</section>` : ''}
      ${noteChipsHtml ? `<section><h2>관련 유의</h2>${noteChipsHtml}</section>` : ''}
      <footer class="node-meta">${pagesHtml}${n.verified ? ` · 확인 ${n.verified}` : ''}</footer>
      ${backlinksHtml ? `<aside class="backlinks"><h3>이 항목을 참조하는 개념</h3>${backlinksHtml}</aside>` : ''}
    </div>`;
}

function toChosung(text) {
  const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  let out = '';
  for (const ch of text) {
    const code = ch.charCodeAt(0);
    out += (code >= 0xAC00 && code <= 0xD7A3) ? CHOSUNG[Math.floor((code - 0xAC00) / (21 * 28))] : ch;
  }
  return out;
}

function initSearch() {
  const bar = document.getElementById('search-bar');
  const results = document.getElementById('search-results');
  if (!bar) return;
  bar.addEventListener('input', () => {
    const q = bar.value.trim();
    if (!q) { results.innerHTML = ''; return; }
    const qChosung = toChosung(q);
    const allMatches = ONTOLOGY.search.filter(item =>
      item.haystack.includes(q) || item.chosung.includes(qChosung)
    );
    const matches = allMatches.slice(0, 20);
    const listHtml = matches.map(m =>
      `<a class="search-result" href="#/node/${m.id}">
         <span class="chapter-dot" style="background:var(--ch${m.chapter})"></span>${m.title} <small>${m.type}</small>
       </a>`
    ).join('') || '<p class="no-result">결과 없음</p>';
    const moreHtml = allMatches.length > 20
      ? `<p class="more-results">외 ${allMatches.length - 20}건 — 검색어를 좁혀보세요</p>` : '';
    results.innerHTML = listHtml + moreHtml;
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== bar) { e.preventDefault(); bar.focus(); }
  });
}

function renderTable(main) {
  const scope = getScope();
  const numNodes = ONTOLOGY.nodes.filter(n => n.type === '수치·기한' && (n.scope === '공통' || n.scope === scope));
  main.innerHTML = `
    <h1>수치·기한 통합표</h1>
    <input id="table-filter" class="search-bar" placeholder="필터 (예: 휴가, 징계)">
    <table id="numeric-table">
      <thead><tr><th data-col="0">항목</th><th data-col="1">장</th><th data-col="2">내용</th><th data-col="3">근거</th></tr></thead>
      <tbody>
        ${numNodes.map(n => `
          <tr data-title="${n.title}">
            <td><a href="#/node/${n.id}">${n.title}</a></td>
            <td>${n.chapter === 0 ? '부록' : n.chapter + '장'}</td>
            <td>${n.summary}</td>
            <td>${(n.refs || []).join(', ')}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  document.querySelectorAll('#numeric-table th').forEach(th => {
    th.addEventListener('click', () => sortTable(Number(th.dataset.col)));
  });
  document.getElementById('table-filter').addEventListener('input', e => {
    const q = e.target.value.trim();
    document.querySelectorAll('#numeric-table tbody tr').forEach(tr => {
      tr.style.display = (tr.dataset.title.includes(q) || tr.textContent.includes(q)) ? '' : 'none';
    });
  });
}

function sortTable(colIdx) {
  const tbody = document.querySelector('#numeric-table tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const asc = tbody.dataset.sortCol == colIdx && tbody.dataset.sortDir !== 'asc';
  rows.sort((a, b) => {
    const av = a.children[colIdx].textContent, bv = b.children[colIdx].textContent;
    return asc ? av.localeCompare(bv, 'ko') : bv.localeCompare(av, 'ko');
  });
  rows.forEach(r => tbody.appendChild(r));
  tbody.dataset.sortCol = colIdx;
  tbody.dataset.sortDir = asc ? 'asc' : 'desc';
}

function renderChapterHub(main, chapterNum) {
  const scope = getScope();
  const nodes = ONTOLOGY.nodes.filter(n => n.chapter === chapterNum && (n.scope === '공통' || n.scope === scope));
  main.innerHTML = `
    <h1 style="color:var(--ch${chapterNum})">제${chapterNum === 0 ? '' : chapterNum + '장 '}${CHAPTER_NAMES[chapterNum]}</h1>
    <p>${nodes.length}개 항목</p>
    <div class="chapter-node-grid">
      ${nodes.map(n => `
        <a class="mini-card" href="#/node/${n.id}" style="border-left-color:var(--ch${n.chapter})">
          <span class="mini-card-type">${n.type}</span>
          <strong>${n.title}</strong>
          <p>${n.summary}</p>
        </a>`).join('')}
    </div>`;
}

function renderPrint(main) {
  const numNodes = ONTOLOGY.nodes.filter(n => n.type === '수치·기한');
  main.innerHTML = `
    <div class="print-sheet">
      <h1>교원인사 실무 치트시트</h1>
      <p class="print-meta">2026 교원인사 실무도우미 기준 · Ctrl+P로 인쇄</p>
      ${[1,2,3,4,5,6,7].map(c => `
        <section class="print-chapter">
          <h2 style="color:var(--ch${c})">제${c}장 ${CHAPTER_NAMES[c]}</h2>
          <table><tbody>
            ${numNodes.filter(n => n.chapter === c).map(n => `<tr><td>${n.title}</td><td>${n.summary}</td></tr>`).join('') || '<tr><td colspan="2">해당 장 수치 데이터 없음</td></tr>'}
          </tbody></table>
        </section>`).join('')}
    </div>
    <button class="no-print" onclick="window.print()">인쇄</button>`;
}
</script>
</body>
