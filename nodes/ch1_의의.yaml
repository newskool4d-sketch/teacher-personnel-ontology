- id: law-gyoyukgongmuwon-qualification
  type: 법령·조문
  title: 교육공무원법 §9·별표1 (교육전문직원 자격기준 — 장학사·장학관 등)
  chapter: 1
  scope: 공통
  summary: 장학사(교육연구사)·장학관(교육연구관) 등 교육전문직원의 자격기준을 정하는 §9·별표1. 수석교사는 별도로 초·중등교육법 §21③이 근거다.
  body: |
    교육공무원법 §9·별표1은 장학관·장학사·교육연구관·교육연구사 등 **교육전문직원**의
    자격기준만 규정한다(2026-08-03 재조회). 수석교사는 교원 자격이며 그 자격 근거는
    초·중등교육법 §21③으로 별개다(`qual-master-teacher` 참조) — 이 노드 범위에서 제외.
  refs: ["교육공무원법 §9", "교육공무원법 별표1"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-03"

