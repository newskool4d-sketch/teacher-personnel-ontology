# 제1장 교육공무원 의의 — 정의·자격기준·관련법규·용어
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제1장 교육공무원 의의"(정의·자격·용어)
# 비고(Task 15g): 구 law-list-appendix 노드(법령 12종 목록, chapter 오태그 1)는 삭제하고
#       nodes/appendix.yaml(chapter 0)의 10개 개별 법령 개관 노드로 대체함.

- id: def-education-official
  type: 개념
  title: 교육공무원의 정의
  chapter: 1
  scope: 공통
  summary: 교원(교장·교감·수석교사·교사)과 장학관·장학사·교육연구관·교육연구사를 총칭하는 개념.
  body: |
    교육공무원법 §2에 따른 정의로, 국·공립 교육기관에 근무하는 교원 및 교육전문직원을 포괄한다.

    | 구분 | 해당 직위 |
    | --- | --- |
    | 교원 | 교장·교감·수석교사·교사 |
    | 교육전문직 | 장학관·장학사 / 교육연구관·교육연구사 |
  refs: ["교육공무원법 §2"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: def-education-official-special-service
  type: 개념
  title: 교육공무원 = 특정직공무원
  chapter: 1
  scope: 공통
  summary: 교육공무원은 국가공무원법 §2가 정하는 특정직공무원으로 분류된다.
  refs: ["국가공무원법 §2"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: qual-master-teacher
  type: 개념
  title: 수석교사 자격기준
  chapter: 1
  scope: 공통
  summary: 교사자격 소지자로서 교육경력(교육전문직 경력 포함) 15년 이상이면 수석교사 자격을 갖춘다.
  body: |
    수석교사 자격의 직접 근거는 교육공무원법이 아니라 **초·중등교육법 §21③**이다.
    원문(2026-08-03 korean-law-mcp 재조회): "수석교사는 제2항의 자격증을 소지한
    사람으로서 15년 이상의 교육경력(「교육공무원법」 제2조제1항제2호 및 제3호에 따른
    교육전문직원으로 근무한 경력을 포함한다)을 가지고 교수·연구에 우수한 자질과 능력을
    가진 사람 중에서 …연수 이수 결과를 바탕으로 검정·수여하는 자격증을 받은 사람." 교육공무원법
    별표1은 장학관·장학사 등 교육전문직원 자격만 규정하고 수석교사는 포함하지 않는다.
    세부 심사·연수 이수 요건은 원문(자격기준 조문·별표) 재대조 필요.
  refs: ["초·중등교육법 §21③"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-03"

- id: qual-janghaksa
  type: 개념
  title: 장학사·교육연구사 자격기준
  chapter: 1
  scope: 공통
  summary: 대학·사범대·교육대 졸업 + 교육(행정·연구)경력 5년 이상(1호), 또는 학력 무관 교육(행정·연구)경력 9년 이상(2호)이면 자격을 갖춘다.
  body: |
    교육공무원법 별표1(제9조 관련) 원문(2026-08-03 재조회): "1. 대학·사범대학·교육대학
    졸업자로서 5년 이상의 교육경력이나 2년 이상의 교육경력을 포함한 5년 이상의
    교육행정경력 또는 교육연구경력이 있는 사람 2. 9년 이상의 교육경력이나 2년 이상의
    교육경력을 포함한 9년 이상의 교육행정경력 또는 교육연구경력이 있는 사람." 즉 **2호(9년
    기준)에는 학력 요건이 없다** — "대졸 이상 학력 기준"은 1호(5년 기준)에만 해당하며,
    그마저도 "대졸 이상"이 아니라 "대학·사범대학·교육대학 졸업자"로 한정된다. 두 기준
    모두 교육경력 또는 교육행정·연구경력의 조합을 허용한다.
  refs: ["교육공무원법 §9", "교육공무원법 별표1"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-03"

- id: qual-janghakgwan
  type: 개념
  title: 장학관·교육연구관 자격기준
  chapter: 1
  scope: 공통
  summary: 대졸 7년↑/전문대졸 9년↑ 경력, 장학사·연구사 경력 2년↑, 교육경력 11년, 박사학위 등 중 하나를 충족하면 자격을 갖춘다.
  body: |
    | 요건 유형 | 기준 |
    | --- | --- |
    | 학력별 경력 | 대졸 7년 이상 또는 전문대졸 9년 이상 |
    | 전직 경력 | 장학사·교육연구사 경력 2년 이상 |
    | 교육경력 | 11년 이상 |
    | 학위 | 박사학위 소지 등 |

    각 요건은 택일 요건으로 보이며, 세부 조건(연수 이수 등)은 원문 자격기준표 확인필요.
  refs: ["교육공무원법 §9", "교육공무원법 별표1"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

