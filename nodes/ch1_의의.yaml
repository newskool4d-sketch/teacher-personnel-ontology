- id: law-gongmuwon-qualification
  type: 법령·조문
  title: 교육공무원법 자격기준 조문(수석교사·장학사·장학관 등)
  chapter: 1
  scope: 공통
  summary: 수석교사·장학사(교육연구사)·장학관(교육연구관)의 자격기준을 정하는 조문·별표(정확한 조번호 확인필요).
  body: |
    실무도우미 요약은 자격 수치만 제시하고 근거 조번호를 명시하지 않아, 정확한 조·별표 번호는
    원문(교육공무원법 및 자격기준 관련 별표) 대조가 필요하다.
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: law-list-appendix
  type: 법령·조문
  title: 교원인사 관련 법령 체계(12종)
  chapter: 1
  scope: 공통
  summary: 국가공무원법·교육공무원법 등 인사 관련 법률·시행령·규칙·예규 12종 목록(원문은 부록 수록).
  body: |
    실무도우미 부록에 수록된 인사 관련 법령 12종(원문 약칭 기준): 국가공무원법·교육공무원법·
    (교육공무원)임용령·(교육공무원)징계령·(교육공무원)승진규정·인사관리규정·인사위원회규정·
    복무규정·인사기록·인사사무처리규칙·징계양정규칙·교원휴가예규·복무·징계 관련 예규
    (각 최신 시행일 병기).

    ⚠ 정식 법령명(전체 명칭)은 원문 대조 필요 — 실무도우미 약칭 기준으로 정리함.
    원문 소재는 부록(중등 434~437쪽/초등 449~464쪽)이며, 온톨로지상 "제1장 관련 법규" 참고
    노드로 편성함.
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

