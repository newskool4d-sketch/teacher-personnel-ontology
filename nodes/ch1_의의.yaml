# 제1장 교육공무원 의의 — 정의·자격기준·관련법규·용어
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제1장 교육공무원 의의"(정의·자격·용어)
#       및 § "### 부록"(관련 법규 12종 — 원문 소재는 부록이나, 본 챕터의 "관련 법규" 노드로 편성)

- id: def-education-official
  type: 개념
  title: 교육공무원의 정의
  chapter: 1
  scope: 공통
  summary: 교원(교장·교감·수석교사·교사)과 장학관·장학사·교육연구관·교육연구사를 총칭하는 개념.
  body: |
    교육공무원법 §2에 따른 정의로, 국·공립 교육기관에 근무하는 교원 및 교육전문직원을 포괄한다.

    | 구분 | 해당 직위 |
    | --- | --- |
    | 교원 | 교장·교감·수석교사·교사 |
    | 교육전문직 | 장학관·장학사 / 교육연구관·교육연구사 |
  refs: ["교육공무원법 §2"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: def-education-official-special-service
  type: 개념
  title: 교육공무원 = 특정직공무원
  chapter: 1
  scope: 공통
  summary: 교육공무원은 국가공무원법 §2가 정하는 특정직공무원으로 분류된다.
  refs: ["국가공무원법 §2"]
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: qual-master-teacher
  type: 개념
  title: 수석교사 자격기준
  chapter: 1
  scope: 공통
  summary: 교사자격 소지자로서 교육경력(교육전문직 경력 포함) 15년 이상이면 수석교사 자격을 갖춘다.
  body: |
    세부 심사·연수 이수 요건 등은 실무도우미 요약에 포함되어 있지 않아 원문(자격기준 조문·별표) 대조가 필요하다.
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: qual-janghaksa
  type: 개념
  title: 장학사·교육연구사 자격기준
  chapter: 1
  scope: 공통
  summary: 대졸 이상 학력 기준으로 교육경력 5년 이상 또는 9년 이상이면 장학사·교육연구사 자격을 갖춘다.
  body: |
    원문 요약은 "대졸 5년/9년↑ 경력"으로만 제시되어, 5년 요건과 9년 요건이 각각 어떤 학력 구분에
    대응하는지는 명확히 구분되지 않는다 — 학력별 세부 기준은 원문 자격기준표 확인필요.
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

- id: qual-janghakgwan
  type: 개념
  title: 장학관·교육연구관 자격기준
  chapter: 1
  scope: 공통
  summary: 대졸 7년↑/전문대졸 9년↑ 경력, 장학사·연구사 경력 2년↑, 교육경력 11년, 박사학위 등 중 하나를 충족하면 자격을 갖춘다.
  body: |
    | 요건 유형 | 기준 |
    | --- | --- |
    | 학력별 경력 | 대졸 7년 이상 또는 전문대졸 9년 이상 |
    | 전직 경력 | 장학사·교육연구사 경력 2년 이상 |
    | 교육경력 | 11년 이상 |
    | 학위 | 박사학위 소지 등 |

    각 요건은 택일 요건으로 보이며, 세부 조건(연수 이수 등)은 원문 자격기준표 확인필요.
  pages: {중등: "1-21", 초등: "7-20"}
  verified: "2026-08-02"

