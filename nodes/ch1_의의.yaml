- id: term-bokjik
  type: 개념
  title: 복직(용어)
  chapter: 1
  scope: 공통
  summary: 휴직·직위해제 등의 사유가 소멸되어 원래 직위로 복귀하는 임용 행위.
  body: |
    실무도우미 제1장 용어 정리 본문에는 "임용/전직/전보/강임" 4개 용어만 명시적으로 열거되어
    있고 "복직"은 별도 항목으로 나열되지 않는다. 다만 제3장 복직 실무(휴직 사유 소멸 후 30일
    이내 신고 시 당연복직 등, proc-reinstatement 참조)와 직결되는 인사 용어이므로 통상적
    정의를 정리해 편입함.
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-02"
