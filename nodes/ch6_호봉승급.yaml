# 제6장 호봉 및 승급 — 초임호봉 획정/경력환산율표/학령·가산연수/호봉재획정/정기승급/승급제한/NEIS
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제6장 호봉 및 승급"(파일 150~155행)
#       + § "6. 중등판 vs 초등판 차이"(28행, 페이지 범위) + 5장 발췌(137행, 징계별 승급제한 개월수)
# 페이지: 6장 호봉 및 승급 — 중등 284~314쪽(NEIS 298~314), 초등 299~327쪽(NEIS 314~327)
# 법령 검증: korean-law-mcp로 공무원보수규정(MST 288433) §8·§13·§14·§15 및 별표15·22·23·25 원문 조회, 2026-08-02

- id: hobong-initial-determination
  type: 개념
  title: 초임호봉 획정 개관
  chapter: 6
  scope: 공통
  summary: 신규채용 시 초임호봉은 기산호봉에 경력환산연수와 학령·가산연수를 가감해 확정한다.
  body: |
    공무원보수규정 §8·별표15에 따라 초임호봉을 획정하며, 유·초·중등·특수학교 교원(별표11
    봉급표 적용자)은 별표22 경력환산율표로 환산한 경력연수에 별표23 가산연수를 가감한 후
    별표25 기산호봉에 합산하는 방식을 쓴다("별표22 환산 경력연수 + 별표23 가산연수 →
    별표25 기산호봉에 합산"). 경력과 경력이 중복되는 기간은 그중 유리한 경력 하나만
    산입한다(별표22 비고3).

    세부 수치는 `num-hobong-gisan`(기산호봉)·`career-conversion-table`(경력환산율)·
    `num-hobong-hakryeong-gasan`(가산연수) 노드 참조. korean-law-mcp로 원문 확인
    (2026-08-02, MST 288433 §8·별표15).
  refs: ["공무원보수규정 §8", "공무원보수규정 별표15"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-hobong-gisan
  type: 수치·기한
  title: 기산호봉 — 1급정교사9호봉·2급정교사8호봉·준교사·실기교사5호봉
  chapter: 6
  scope: 공통
  summary: 자격별 기산호봉은 정교사(1급) 등 9호봉, 정교사(2급) 등 8호봉, 준교사·실기교사 5호봉.
  body: |
    | 자격 | 기산호봉 |
    | --- | --- |
    | 정교사(1급)·전문상담교사(1급)·사서교사(1급)·보건교사(1급)·영양교사(1급) | 9 |
    | 정교사(2급)·전문상담교사(2급)·사서교사(2급)·보건교사(2급)·영양교사(2급) | 8 |
    | 준교사·실기교사 | 5 |

    교장·원장·교감·원감·교육장·장학관·교육연구관·장학사·교육연구사는 정교사(1급) 기산호봉을
    적용한다. korean-law-mcp로 원문 확인(2026-08-02, MST 288433 별표25).
  refs: ["공무원보수규정 별표25"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: career-conversion-table
  type: 개념
  title: 경력환산율표 개관
  chapter: 6
  scope: 공통
  summary: 교원 경력을 초임호봉에 반영하는 환산율 체계로, 경력 유형별로 30~100% 범위에서 차등 적용된다.
  body: |
    공무원보수규정 별표22(교육공무원 등의 경력환산율표)에 근거한다. 학력과 경력이 중복될
    때는 그중 하나만 산입하며(비고3), 통상근무시간보다 짧게 근무한 경력(주 15시간 미만
    제외)은 근무시간에 비례해 환산한다(비고4). 세부 환산율은 각 `num-career-conversion-*`
    노드 참조. korean-law-mcp로 원문 확인(2026-08-02, MST 288433 별표22).
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-public
  type: 수치·기한
  title: 경력환산율 — 국공립교원 10할
  chapter: 6
  scope: 공통
  summary: 국공립 교육기관에서 근무한 정규 교육공무원(기간제교원 포함) 경력은 100% 이내로 환산.
  body: |
    자격증 종류와 근무 학교가 일치하지 않는 기간제교원 경력은 80% 이내로 환산율이
    낮아진다(별표22 1호 비고).
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-private
  type: 수치·기한
  title: 경력환산율 — 사립교원 임면보고 10할·미보고 5할
  chapter: 6
  scope: 공통
  summary: 사립학교법에 따라 임면되어 관할청에 보고된 사립학교 교원 경력은 100% 이내, 미보고 경력은 50% 이내로 환산.
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-lecturer
  type: 수치·기한
  title: 경력환산율 — 시간제강사·대학시간강사 30~100%(위임)
  chapter: 6
  scope: 공통
  summary: 유치원강사·산학겸임교사·대학시간강사 경력은 교육부장관이 정하는 바에 따라 30~100% 범위에서 환산.
  body: |
    공무원보수규정 별표22는 "강사 등 경력"(유치원 강사, 초중등 산학겸임교사, 고등교육법
    §17 대학 시간강사)의 환산율을 "교육부장관이 정하는 바에 따라 30퍼센트 이상 100퍼센트
    이하"로 위임한다. 실무도우미 요약본이 제시하는 세부 배분(시간제강사는 근무시간
    비례, 대학시간강사는 5~10할)은 「교육공무원 호봉획정시 경력환산율표의 적용 등에 관한
    예규」(교육부, 2025.4.23. 공포, 행정규칙일련번호 2100000258052)에 규정된 것으로
    추정되나, 이 예규는 법제처 DB에 첨부파일(HWP) 형태로만 등록되어 있어 이번 조회에서
    본문 전문을 직접 대조하지 못했다(확인필요 — 예규 원문 별도 확인 필요).
  refs: ["공무원보수규정 별표22", "교육공무원 호봉획정시 경력환산율표의 적용 등에 관한 예규"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-etc
  type: 수치·기한
  title: 경력환산율 — 회사근무 4할·기타직업 3할
  chapter: 6
  scope: 공통
  summary: 상법상 회사(외국회사 포함) 근무 경력은 40% 이내, 그 밖의 직업 종사 경력은 30% 이내로 환산.
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-hobong-hakryeong-gasan
  type: 수치·기한
  title: 학령·가산연수 — 사범계+1년·특수교육사범계+2년·특수교육비사범계+1년
  chapter: 6
  scope: 공통
  summary: 총수학연수(만16년 기준 가감)에 사범계 졸업자는 1년, 특수교육 관련자는 2년(비사범계는 1년)을 가산한다.
  body: |
    산정공식(별표23) — (총수학연수－16) ＋ 가산연수 ＝ 학령·가산연수.

    | 대상 | 가산연수 |
    | --- | --- |
    | 사범계 학교(수학연한 2년 이상, 특수학교·특수학급·특수교육지원센터 근무자는 제외) 졸업 | 1년 |
    | 특수학교·일반학교 특수학급·특수교육지원센터 근무 교원 중 특수학교 교원자격증 소지자 — 사범계(2년 이상) 졸업 | 2년 |
    | 〃 — 사범계로 인정된 교원양성기관(수학연한 1년 이상 2년 미만) 수료 | 1년 |
    | 〃 — 비사범계 학교 졸업 | 1년 |

    총수학연수는 초·중등교육법·고등교육법상 학교의 법정 수학연한을 통산한 연수이며,
    공민학교·고등공민학교·고등기술학교는 제외한다. korean-law-mcp로 원문 확인
    (2026-08-02, MST 288433 별표23).
  refs: ["공무원보수규정 별표23"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: proc-hobong-rejudge
  type: 절차
  title: 호봉재획정 절차
  chapter: 6
  scope: 공통
  summary: 경력합산 신청·자격변동(상위 자격증 취득)·복직 등의 사유로 호봉을 다시 산정하는 절차.
  body: |
    주요 재획정 사유 — 초임호봉 획정에 반영되지 않았던 경력의 추가 합산 신청, 1급정교사
    등 상위 자격증 취득에 따른 기산호봉 변경, 휴직·직위해제 등에서 복직. 연수휴직자가
    학위를 취득하면 승급기간을 재획정하는 것도 같은 성격의 사례다(`leave-training` 참조).

    발효 시점은 사유별로 다르며 소급 적용되지 않는다 — 세부는
    `num-hobong-rejudge-effective` 참조.
  refs: []
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-hobong-rejudge-effective
  type: 수치·기한
  title: 호봉재획정 발효시점 — 신청 다음달 1일(소급불가), 복직은 복직일
  chapter: 6
  scope: 공통
  summary: 경력합산·자격변동 등 신청에 의한 호봉재획정은 신청일이 속한 달의 다음달 1일 발효(소급 불가), 복직에 의한 재획정은 복직일부터 발효.
  refs: ["확인필요"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: promotion-monthly
  type: 개념
  title: 정기승급
  chapter: 6
  scope: 공통
  summary: 공무원의 호봉은 원칙적으로 승급기간 1년이 지나면 매달 1일자로 승급한다.
  body: |
    공무원보수규정 §13①에 따라 승급기간은 원칙 1년(헌법연구관·헌법연구관보는 별도
    구간별 1년9개월~2년)이며, §13③ "공무원의 호봉은 매달 1일자로 승급한다"에 따라 실제
    승급은 매달 1일자로 일괄 반영된다. 승급이 제한되는 사유·기간은
    `promotion-nonaccrual`·`num-promotion-restriction-period` 참조. korean-law-mcp로
    원문 확인(2026-08-02, MST 288433 §13).

    * 실무도우미 요약본은 "승급은 매월 1일"의 근거를 공무원보수규정 §14(승급의 제한)로
      표기했으나, 원문 대조 결과 매월 1일 승급 자체의 근거는 §13③이고 §14는 승급이
      "제한"되는 사유·기간을 규정한다(확인·정정 완료, 2026-08-02).
  refs: ["공무원보수규정 §13"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: promotion-nonaccrual
  type: 개념
  title: 승급 불산입 사유 — 휴직·직위해제·징계기간
  chapter: 6
  scope: 공통
  summary: 징계처분·직위해제·휴직(공무상 질병·부상 휴직은 제외) 중인 기간은 승급기간에 산입하지 않아 승급이 정지된다.
  body: |
    공무원보수규정 §14①1에 따라 징계처분·직위해제·휴직 중인 사람은 승급시킬 수 없다.
    다만 공무상 질병·부상으로 인한 휴직 기간은 이 제한에서 제외되어 승급이 계속
    진행된다(§14①1 단서). §15에 따라 승급제한기간은 원칙적으로 승급기간에 불산입되나,
    공무원임용령 §57조의5① 복직명령에 따른 복직 등 예외적으로 산입되는 경우가 있다.
    육아휴직의 경우 첫째·둘째 자녀는 승급기간 1년(요건 충족 시 1년6개월), 셋째 자녀부터는
    전체 휴직기간이 산입되는 별도 특례가 있다(`leave-childcare` 참조, 같은 §15의 적용
    사례). korean-law-mcp로 원문 확인(2026-08-02, MST 288433 §14·§15).
  refs: ["공무원보수규정 §14", "공무원보수규정 §15"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-promotion-restriction-period
  type: 수치·기한
  title: 승급제한기간 — 강등·정직18월·감봉12월·견책6월, 특정비위+6월
  chapter: 6
  scope: 공통
  summary: 징계처분 집행 종료일(강등은 직무정지 3개월 종료일)부터 강등·정직 18개월, 감봉 12개월, 견책 6개월이 지나야 승급하며, 특정비위는 6개월 가산.
  body: |
    법적 근거는 공무원보수규정 §14①2다. 이 조문은 "국가공무원법 §78의2①각호 사유로 인한
    징계처분과 소극행정·음주운전(측정불응 포함)·성폭력·성희롱·성매매로 인한 징계처분의
    경우 각각 6개월을 가산한 기간"이 지나야 승급할 수 있다고 규정한다.

    | 징계 종류 | 승급제한기간 |
    | --- | --- |
    | 강등·정직 | 18개월 |
    | 감봉 | 12개월 |
    | 견책 | 6개월 |
    | 위 기간 + 특정비위(4대 비위·소극행정·음주운전·성희롱 등) | +6개월 가산 |

    이중 징계로 제한기간이 겹치면 먼저 시작된 제한기간이 끝난 날부터 다음 제한기간을
    기산한다(§14②). 훈장·포장·국무총리 이상 표창 등 공적이 있으면 가장 최근의 중한
    징계처분에 한해 제한기간의 1/2을 단축할 수 있다(§14③).

    5장 `discipline-gangdeung`·`discipline-jeongjik`·`discipline-gambong`·
    `discipline-gyeonchaek` 노드에 동일한 18/12/6개월 수치가 등재되어 있다. 원문 대조 결과
    개월수 자체의 직접 근거는 공무원보수규정 §14①2이며, 국가공무원법 §79·80은 징계 종류
    (강등·정직·감봉·견책)를 정의할 뿐 제한기간 수치를 규정하지 않는다 — 같은 사실이되 근거
    조문 표기가 서로 다르던 것을 확인해, 5장 4개 노드의 refs에 공무원보수규정 §14①2를
    추가로 반영 완료했다(최종검수 반영). 다만 이번 조회에서 §14①2의 가·나·다 각목
    원문(개월수를 항목별로 나열한 하위 목록)이 API 응답에 완전히 표시되지 않아, 18/12/6
    개월 수치 자체는 실무도우미 요약본과 5장 기존 노드의 일치로 교차 확인했다(각목 원문
    형태 재대조는 확인필요).
  refs: ["공무원보수규정 §14"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: neis-regular-promotion
  type: NEIS작업
  title: NEIS 정기승급관리 처리 절차
  chapter: 6
  scope: 공통
  summary: 정기승급·호봉재획정 모두 개요등록→대상자관리→산정작업→작업마감→임용발령자료생성→임용기안문작성 순으로 처리하며, 결재 후 "시행" 버튼 클릭이 필수다.
  body: |
    1. 개요등록
    2. 대상자관리
    3. 산정작업
    4. 작업마감
    5. 임용발령자료생성
    6. 임용기안문작성

    임용기안문 결재·승인이 끝난 뒤 "시행" 버튼을 클릭하지 않으면 인사기록카드에
    반영되지 않는다 — 실무도우미가 지목한 최다 실수 유형이다("승급·호봉 기안 승인 후
    '시행' 클릭 누락 → 인사기록 미반영").
  refs: []
  pages: {중등: "298-314", 초등: "314-327"}
  verified: "2026-08-02"

- id: law-gongmuwon-bosu-14
  type: 법령·조문
  title: 공무원보수규정 §14 (승급의 제한)
  chapter: 6
  scope: 공통
  summary: 징계처분·직위해제·휴직 중인 사람의 승급을 제한하고, 특정비위는 제한기간에 6개월을 가산하는 근거 조문.
  body: |
    ① 다음 각 호의 어느 하나에 해당하는 사람은 해당 기간 동안 승급시킬 수 없다.
    1. 징계처분, 직위해제 또는 휴직(공무상 질병 또는 부상으로 인한 휴직은 제외한다) 중인 사람
    2. 징계처분의 집행이 끝난 날(강등의 경우 직무에 종사하지 못하는 3개월이 끝난 날)부터
       다음 각 목의 기간[국가공무원법 §78의2①각호 사유로 인한 징계처분과 소극행정·
       음주운전(음주측정 불응 포함)·성폭력·성희롱·성매매로 인한 징계처분의 경우 각각
       6개월을 가산한 기간]이 지나지 않은 사람
    3.~5. 근무성적평정 최하등급자·국가정보원 전문관 승급심사 미합격자·군인보수법 관련자 등
    ② 승급제한이 중복될 경우 먼저 시작된 제한기간이 끝난 날부터 다음 제한기간을 기산한다.
    ③ 징계처분 후 훈장·포장·국무총리 이상 표창 등을 받으면 최근 가장 중한 징계처분에
       한해 제한기간의 2분의 1을 단축할 수 있다.

    제1항제2호의 가·나·다 각목(징계 종류별 구체 개월수 목록)은 이번 조회의 API 응답에
    전문이 표시되지 않았다 — 목록 형태 재조회 시 원문 대조 권장. korean-law-mcp로 원문
    확인(2026-08-02, MST 288433, 시행 2026.8.1.).
  refs: ["공무원보수규정 §14"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"
