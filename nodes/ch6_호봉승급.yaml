- id: num-promotion-restriction-period
  type: 수치·기한
  title: 승급제한기간 — 강등·정직18월·감봉12월·견책6월, 특정비위+6월
  chapter: 6
  scope: 공통
  summary: 징계처분 집행 종료일(강등은 직무정지 3개월 종료일)부터 강등·정직 18개월, 감봉 12개월, 견책 6개월이 지나야 승급하며, 특정비위는 6개월 가산.
  body: |
    법적 근거는 공무원보수규정 §14①2다. 이 조문은 "국가공무원법 §78의2①각호 사유로 인한
    징계처분과 소극행정·음주운전(측정불응 포함)·성폭력·성희롱·성매매로 인한 징계처분의
    경우 각각 6개월을 가산한 기간"이 지나야 승급할 수 있다고 규정한다.

    | 징계 종류 | 승급제한기간 |
    | --- | --- |
    | 강등·정직 | 18개월 |
    | 감봉 | 12개월 |
    | 견책 | 6개월 |
    | 위 기간 + 특정비위(4대 비위·소극행정·음주운전·성희롱 등) | +6개월 가산 |

    이중 징계로 제한기간이 겹치면 먼저 시작된 제한기간이 끝난 날부터 다음 제한기간을
    기산한다(§14②). 훈장·포장·국무총리 이상 표창 등 공적이 있으면 가장 최근의 중한
    징계처분에 한해 제한기간의 1/2을 단축할 수 있다(§14③).

    5장 [강등](#/node/discipline-gangdeung)·[정직](#/node/discipline-jeongjik)·[감봉](#/node/discipline-gambong)·
    [견책](#/node/discipline-gyeonchaek) 항목에 동일한 18/12/6개월 수치가 등재되어 있다. 원문 대조 결과
    개월수 자체의 직접 근거는 공무원보수규정 §14①2이며, 국가공무원법 §79·80은 징계 종류
    (강등·정직·감봉·견책)를 정의할 뿐 제한기간 수치를 규정하지 않는다 — 같은 사실이되 근거
    조문 표기가 서로 다르던 것을 확인해, 5장 4개 항목의 근거 표기에 공무원보수규정
    §14①2를 함께 반영했다. 다만 이번 조회에서 §14①2의 가·나·다 각목
    원문(개월수를 항목별로 나열한 하위 목록)이 API 응답에 완전히 표시되지 않아, 18/12/6
    개월 수치 자체는 실무도우미 요약본과 5장 기존 항목의 일치로 교차 확인했다(각목 원문
    형태 재대조는 확인필요).

    **제한기간 종료 후 처리**: 제한기간이 끝난 날의 다음 날 승급하며 계속근무 시 획정
    호봉을 초과할 수 없다(§13④, [정기승급](#/node/promotion-monthly) 참조). 또한 징계처분의 집행이 끝난
    날부터 일정 기간이 지나면 그 승급제한기간을 승급기간에 산입해 호봉을 재획정한다
    (§15 2호·§9①2, 각 목의 구체 개월수는 원문 재대조 필요 — 확인필요).
  refs: ["공무원보수규정 §14", "공무원보수규정 §13④", "공무원보수규정 §15 2호"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: neis-regular-promotion
  type: NEIS작업
  title: NEIS 정기승급관리 처리 절차
  chapter: 6
  scope: 공통
  summary: 정기승급·호봉재획정 모두 개요등록→대상자관리→산정작업→작업마감→임용발령자료생성→임용기안문작성 순으로 처리하며, 결재 후 "시행" 버튼 클릭이 필수다.
  body: |
    1. 개요등록
    2. 대상자관리
    3. 산정작업
    4. 작업마감
    5. 임용발령자료생성
    6. 임용기안문작성

    임용기안문 결재·승인이 끝난 뒤 "시행" 버튼을 클릭하지 않으면 인사기록카드에
    반영되지 않는다 — 실무도우미가 지목한 최다 실수 유형이다("승급·호봉 기안 승인 후
    '시행' 클릭 누락 → 인사기록 미반영").
  refs: []
  pages: {중등: "298-314", 초등: "314-327"}
  verified: "2026-08-02"

- id: law-bosugyujeong-14
  type: 법령·조문
  title: 공무원보수규정 §14 (승급의 제한)
  chapter: 6
  scope: 공통
  summary: 징계처분·직위해제·휴직 중인 사람의 승급을 제한하고, 특정비위는 제한기간에 6개월을 가산하는 근거 조문.
  body: |
    ① 다음 각 호의 어느 하나에 해당하는 사람은 해당 기간 동안 승급시킬 수 없다.
    1. 징계처분, 직위해제 또는 휴직(공무상 질병 또는 부상으로 인한 휴직은 제외한다) 중인 사람
    2. 징계처분의 집행이 끝난 날(강등의 경우 직무에 종사하지 못하는 3개월이 끝난 날)부터
       다음 각 목의 기간[국가공무원법 §78의2①각호 사유로 인한 징계처분과 소극행정·
       음주운전(음주측정 불응 포함)·성폭력·성희롱·성매매로 인한 징계처분의 경우 각각
       6개월을 가산한 기간]이 지나지 않은 사람
    3.~5. 근무성적평정 최하등급자·국가정보원 전문관 승급심사 미합격자·군인보수법 관련자 등
    ② 승급제한이 중복될 경우 먼저 시작된 제한기간이 끝난 날부터 다음 제한기간을 기산한다.
    ③ 징계처분 후 훈장·포장·국무총리 이상 표창 등을 받으면 최근 가장 중한 징계처분에
       한해 제한기간의 2분의 1을 단축할 수 있다.

    제1항제2호의 가·나·다 각목(징계 종류별 구체 개월수 목록)은 이번 조회의 API 응답에
    전문이 표시되지 않았다 — 목록 형태 재조회 시 원문 대조 권장. korean-law-mcp로 원문
    확인(2026-08-02, MST 288433, 시행 2026.8.1.).
  refs: ["공무원보수규정 §14"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"
