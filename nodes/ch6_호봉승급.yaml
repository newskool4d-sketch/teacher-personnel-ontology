# 제6장 호봉 및 승급 — 초임호봉 획정/경력환산율표/학령·가산연수/호봉재획정/정기승급/승급제한/NEIS
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제6장 호봉 및 승급"(파일 150~155행)
#       + § "6. 중등판 vs 초등판 차이"(28행, 페이지 범위) + 5장 발췌(137행, 징계별 승급제한 개월수)
# 페이지: 6장 호봉 및 승급 — 중등 284~314쪽(NEIS 298~314), 초등 299~327쪽(NEIS 314~327)
# 법령 검증: korean-law-mcp로 공무원보수규정(MST 288433) §8·§13·§14·§15 및 별표15·22·23·25 원문 조회, 2026-08-02

- id: hobong-initial-determination
  type: 개념
  title: 초임호봉 획정 개관
  chapter: 6
  scope: 공통
  summary: 신규채용 시 초임호봉은 기산호봉에 경력환산연수와 학령·가산연수를 가감해 확정한다.
  body: |
    공무원보수규정 §8·별표15에 따라 초임호봉을 획정하며, 유·초·중등·특수학교 교원(별표11
    봉급표 적용자)은 별표22 경력환산율표로 환산한 경력연수에 별표23 가산연수를 가감한 후
    별표25 기산호봉에 합산하는 방식을 쓴다("별표22 환산 경력연수 + 별표23 가산연수 →
    별표25 기산호봉에 합산"). 경력과 경력이 중복되는 기간은 그중 유리한 경력 하나만
    산입한다(공무원보수규정 §8②). §8② 원문(2026-08-03 재조회): "경력과 경력이
    중복될 때에는 그 중 유리한 경력 하나에 대해서만 획정하여야 하며". 이와 별개로
    학력과 경력이 중복될 때는 유리 여부와 무관하게 하나만 산입하는 규정은 별표22
    비고3이다(원문: "학력과 경력이 중복되는 경우에는 그 중 하나만 산입한다") —
    두 규정의 적용 범위가 다르므로 혼동에 유의([경력환산율표 개관](#/node/career-conversion-table) 참조).

    세부 수치는 [기산호봉](#/node/num-hobong-gisan)·[경력환산율표 개관](#/node/career-conversion-table)·
    [학령·가산연수](#/node/num-hobong-hakryeong-gasan) 항목 참조. korean-law-mcp로 원문 확인
    (2026-08-02, MST 288433 §8·별표15).
  refs: ["공무원보수규정 §8", "공무원보수규정 별표15"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-hobong-gisan
  type: 수치·기한
  title: 기산호봉 — 1급정교사9호봉·2급정교사8호봉·준교사·실기교사5호봉
  chapter: 6
  scope: 공통
  summary: 자격별 기산호봉은 정교사(1급) 등 9호봉, 정교사(2급) 등 8호봉, 준교사·실기교사 5호봉.
  body: |
    | 자격 | 기산호봉 |
    | --- | --- |
    | 정교사(1급)·전문상담교사(1급)·사서교사(1급)·보건교사(1급)·영양교사(1급) | 9 |
    | 정교사(2급)·전문상담교사(2급)·사서교사(2급)·보건교사(2급)·영양교사(2급) | 8 |
    | 준교사·실기교사 | 5 |

    교장·원장·교감·원감·교육장·장학관·교육연구관·장학사·교육연구사는 정교사(1급) 기산호봉을
    적용한다. korean-law-mcp로 원문 확인(2026-08-02, MST 288433 별표25).
  refs: ["공무원보수규정 별표25"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: career-conversion-table
  type: 개념
  title: 경력환산율표 개관
  chapter: 6
  scope: 공통
  summary: 교원 경력을 초임호봉에 반영하는 환산율 체계로, 경력 유형별로 30~100% 범위에서 차등 적용된다.
  body: |
    공무원보수규정 별표22(교육공무원 등의 경력환산율표)에 근거한다. 학력과 경력이 중복될
    때는 그중 하나만 산입하며(비고3), 통상근무시간보다 짧게 근무한 경력(주 15시간 미만
    제외)은 근무시간에 비례해 환산한다(비고4). 세부 환산율은 각 경력환산율 항목을 참조한다. korean-law-mcp로 원문 확인(2026-08-02, MST 288433 별표22).
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-public
  type: 수치·기한
  title: 경력환산율 — 국공립교원 10할
  chapter: 6
  scope: 공통
  summary: 국공립 교육기관에서 근무한 정규 교육공무원(기간제교원 포함) 경력은 100% 이내로 환산.
  body: |
    별표22 원문 환산율란(2026-08-03 재조회): "100퍼센트 이내. 다만, 교원자격증의 종류와
    근무한 학교가 일치하지 않는 기간제 교원 경력은 80퍼센트 이내, 관할청에 보고되지
    않은 사립학교 교원 경력은 50퍼센트 이내의 환산율을 적용한다." 즉 자격증 종류와
    근무 학교가 일치하지 않는 기간제교원 경력의 80% 이내 환산은 **비고가 아니라 별표22
    1호 환산율란 자체의 단서**다(수치·요건은 정확).
  refs: ["공무원보수규정 별표22 1호 환산율란"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-03"

- id: num-career-conversion-private
  type: 수치·기한
  title: 경력환산율 — 사립교원 임면보고 10할·미보고 5할
  chapter: 6
  scope: 공통
  summary: 사립학교법에 따라 임면되어 관할청에 보고된 사립학교 교원 경력은 100% 이내, 미보고 경력은 50% 이내로 환산.
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-lecturer
  type: 수치·기한
  title: 경력환산율 — 시간제강사·대학시간강사 30~100%(위임)
  chapter: 6
  scope: 공통
  summary: 유치원강사·산학겸임교사·대학시간강사 경력은 교육부장관이 정하는 바에 따라 30~100% 범위에서 환산.
  body: |
    공무원보수규정 별표22는 "강사 등 경력"(유치원 강사, 초중등 산학겸임교사, 고등교육법
    §17 대학 시간강사)의 환산율을 "교육부장관이 정하는 바에 따라 30퍼센트 이상 100퍼센트
    이하"로 위임한다. 실무도우미 요약본이 제시하는 세부 배분(시간제강사는 근무시간
    비례, 대학시간강사는 5~10할)은 「교육공무원 호봉획정시 경력환산율표의 적용 등에 관한
    예규」(교육부, 2025.4.23. 공포, 행정규칙일련번호 2100000258052)에 규정된 것으로
    추정되나, 이 예규는 법제처 DB에 첨부파일(HWP) 형태로만 등록되어 있어 이번 조회에서
    본문 전문을 직접 대조하지 못했다(확인필요 — 예규 원문 별도 확인 필요).
  refs: ["공무원보수규정 별표22", "교육공무원 호봉획정시 경력환산율표의 적용 등에 관한 예규"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-career-conversion-etc
  type: 수치·기한
  title: 경력환산율 — 회사근무 4할·기타직업 3할
  chapter: 6
  scope: 공통
  summary: 상법상 회사(외국회사 포함) 근무 경력은 40% 이내, 그 밖의 직업 종사 경력은 30% 이내로 환산.
  refs: ["공무원보수규정 별표22"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-hobong-hakryeong-gasan
  type: 수치·기한
  title: 학령·가산연수 — 사범계+1년·특수교육사범계+2년·특수교육비사범계+1년
  chapter: 6
  scope: 공통
  summary: 총수학연수(만16년 기준 가감)에 사범계 졸업자는 1년, 특수교육 관련자는 2년(비사범계는 1년)을 가산한다.
  body: |
    산정공식(별표23) — (총수학연수－16) ＋ 가산연수 ＝ 학령·가산연수.

    | 대상 | 가산연수 |
    | --- | --- |
    | 사범계 학교(수학연한 2년 이상) 졸업 — 단 특수학교·특수학급·특수교육지원센터 근무 교원 중 **특수학교 교원자격증 소지자**는 제외 | 1년 |
    | 특수학교·일반학교 특수학급·특수교육지원센터 근무 교원 중 특수학교 교원자격증 소지자 — 사범계(2년 이상) 졸업 | 2년 |
    | 〃 — 사범계로 인정된 교원양성기관(수학연한 1년 이상 2년 미만) 수료 | 1년 |
    | 〃 — 비사범계 학교 졸업 | 1년 |

    총수학연수는 초·중등교육법·고등교육법상 학교의 법정 수학연한을 통산한 연수이며,
    공민학교·고등공민학교·고등기술학교는 제외한다. 별표23 비고3 가목 원문(2026-08-03
    재조회): "교육공무원(특수학교에 근무하는 교원, 일반학교의 특수학급을 담당하는 교원
    및 …특수교육지원센터에서 근무하는 교원 중 **특수학교 교원자격증을 소지한 사람은
    제외한다**) 중 수학연한 2년 이상인 사범계 학교…를 졸업한 사람: 1년" — 제외 요건은
    "특수학교·특수학급·특수교육지원센터 근무자"가 아니라 그중 **특수학교 교원자격증
    소지자**로 한정된다. 특수자격증 없이 특수학급을 담당하는 사범계 졸업 교원은 이
    가산(1년)의 적용 대상이다.
  refs: ["공무원보수규정 별표23"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: proc-hobong-rejudge
  type: 절차
  title: 호봉재획정 절차
  chapter: 6
  scope: 공통
  summary: 경력합산 신청·자격변동(상위 자격증 취득)·복직 등의 사유로 호봉을 다시 산정하는 절차.
  body: |
    주요 재획정 사유 — 초임호봉 획정에 반영되지 않았던 경력의 추가 합산 신청, 1급정교사
    등 상위 자격증 취득에 따른 기산호봉 변경, 휴직·직위해제 등에서 복직. 연수휴직자가
    학위를 취득하면 승급기간을 재획정하는 것도 같은 성격의 사례다([연수휴직](#/node/leave-training) 참조).

    발효 시점은 사유별로 다르며 소급 적용되지 않는다 — 세부는
    [호봉재획정 발효시점](#/node/num-hobong-rejudge-effective) 참조.
  refs: ["공무원보수규정 §9①"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: num-hobong-rejudge-effective
  type: 수치·기한
  title: 호봉재획정 발효시점 — 신청 다음달 1일(소급불가), 복직은 복직일
  chapter: 6
  scope: 공통
  summary: 경력합산·자격변동 등 신청에 의한 호봉재획정은 신청일이 속한 달의 다음달 1일 발효(소급 불가), 복직에 의한 재획정은 복직일부터 발효.
  body: |
    공무원보수규정 §9② 원문(2026-08-03 재조회): "제1항제1호 및 제1호의2의 경우에는
    경력 합산을 신청한 날이 속하는 달의 다음 달 1일에 …재획정한다. 다만, 휴직(공무상
    질병 또는 부상으로 인한 휴직은 제외한다), 정직, 강등 또는 직위해제 중인 사람에
    대해서는 복직일에 재획정한다." 이 항목의 서술과 정확히 일치한다.

    이 "재획정"(소급 불가)과는 별개로, **호봉 획정 자체에 오류**가 있었던 경우의 정정은
    획정일로 소급해 보수를 정산하는 별도 절차다(호봉 오류 정정). 원문(실무도우미) 수록
    여부는 미확인 — 두 절차를 혼동해 "호봉은 어떤 경우든 소급 불가"로 오해하지 않도록
    구분 유의(확인필요).
  refs: ["공무원보수규정 §9②"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-03"

- id: promotion-monthly
  type: 개념
  title: 정기승급
  chapter: 6
  scope: 공통
  summary: 공무원의 호봉은 원칙적으로 승급기간 1년이 지나면 매달 1일자로 승급한다.
  body: |
    공무원보수규정 §13①에 따라 승급기간은 원칙 1년(헌법연구관·헌법연구관보는 별도
    구간별 1년9개월~2년)이며, §13③ "공무원의 호봉은 매달 1일자로 승급한다"에 따라 실제
    승급은 매달 1일자로 일괄 반영된다. 승급이 제한되는 사유·기간은
    [승급 불산입 사유](#/node/promotion-nonaccrual)·[승급제한기간](#/node/num-promotion-restriction-period) 참조. korean-law-mcp로
    원문 확인(2026-08-02, MST 288433 §13).

    * 실무도우미 요약본은 "승급은 매월 1일"의 근거를 공무원보수규정 §14(승급의 제한)로
      표기했으나, 원문 대조 결과 매월 1일 승급 자체의 근거는 §13③이고 §14는 승급이
      "제한"되는 사유·기간을 규정한다(확인·정정 완료, 2026-08-02).

    **승급제한 종료 후 처리**: §13④는 "제3항에도 불구하고 제14조에 따라 승급제한을
    받고 있는 공무원은 승급제한 기간이 끝난 날의 **다음 날**에 승급한다. 이 경우 그
    공무원이 …계속 근무하였을 때 획정되는 호봉을 초과할 수 없다"(2026-08-03 재조회)고
    정해, 승급제한 종료자는 매월 1일 일괄 승급이 아니라 제한기간 종료 다음 날 승급하며
    호봉 상한이 적용된다. 세부는 [승급제한기간](#/node/num-promotion-restriction-period) 참조.
  refs: ["공무원보수규정 §13"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-02"

- id: promotion-nonaccrual
  type: 개념
  title: 승급 불산입 사유 — 휴직·직위해제·징계기간
  chapter: 6
  scope: 공통
  summary: 징계처분·직위해제·휴직(공무상 질병·부상 휴직 제외) 중에는 승급이 정지된다(§14①1). 다만 휴직 종류에 따라 그 기간의 승급기간 산입 여부가 다르다(§15).
  body: |
    공무원보수규정 §14①1에 따라 징계처분·직위해제·휴직 중인 사람은 승급시킬 수 없다
    (승급 정지). 다만 공무상 질병·부상으로 인한 휴직 기간은 이 제한에서 제외되어 승급이
    계속 진행된다(§14①1 단서).

    "승급 정지"와 "승급기간 불산입"은 별개다. §15는 승급제한 기간을 원칙적으로 승급기간에
    불산입하되, 다음 각호는 **예외적으로 산입**한다(2026-08-03 korean-law-mcp 재조회):
    병역 등 의무수행 휴직 전 기간(1호), 국제기구·민간기업 등 고용휴직 및 외국유학 휴직 전
    기간(비상근 고용은 50%, 4호), 노동조합 전임자 휴직 전 기간(5호), 육아휴직은 자녀
    1명당 최초 1년(공무원수당 규정 §11의3⑦ 요건 충족 시 1년6개월, 셋째 이후 자녀는 전
    기간, 6호), 가족돌봄휴직(교육공무원법 §44①9)은 최초 90일(6의2호).

    §15 단서: "다만, 「공무원임용령」제57조의5제1항의 복직명령에 따라 복직된 경우
    (휴직기간이 종료된 후에 휴직기간 중 복직명령 사유가 있었음이 적발된 경우를 포함한다)
    의 휴직기간은 승급기간에 **산입하지 아니한다**." — 복직명령에 따른 복직은 산입되는
    예외가 아니라, 위 각호의 산입 규정에서도 다시 제외되는 불산입 사유다.
  refs: ["공무원보수규정 §14", "공무원보수규정 §15"]
  pages: {중등: "284-314", 초등: "299-327"}
  verified: "2026-08-03"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-03"
    checked_at: "2026-08-03"
    method: "korean-law-mcp 현행 법령 검색 후 §14·§15 공식 원문 대조"
    unresolved: []
    applicability: "공무원보수규정이 적용되는 교육공무원의 승급 정지·승급기간 산입"
    sources:
      - law_name: "공무원보수규정"
        article: "제14조·제15조"
        mst: "288433"
        effective_date: "2026-08-01"
