- id: appeal-review
  type: 개념
  title: 소청심사
  chapter: 5
  scope: 공통
  summary: 징계 등 불리한 처분에 불복해 교원소청심사위원회에 심사를 청구하는 권리구제 절차.
  body: |
    처분에 불복하는 교원은 처분이 있었음을 안 날부터 30일 이내에 소청심사를 청구할 수
    있으며, 변호사를 대리인으로 선임할 수 있다. 본인 의사에 반한 파면·해임·면직 처분은
    심사위원회 최종 결정 전까지 후임자를 보충 발령할 수 없다(다만 청구기간 내 미청구 시
    그 기간 경과 후 보충발령 가능). korean-law-mcp로 원문 확인(2026-08-02, MST 283357 §9).
  refs: ["교원의 지위 향상 및 교육활동 보호를 위한 특별법 §9"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

