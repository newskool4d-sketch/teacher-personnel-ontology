- id: law-honors-act-5
  type: 법령·조문
  title: 상훈법 제5조 — 서훈 추천권자와 공적심사
  chapter: 5
  scope: 공통
  summary: 중앙행정기관장 등 추천권자가 대통령령에 따른 공적심사를 거쳐 서훈을 추천한다.
  body: |
    중앙행정기관의 장, 국회사무총장, 법원행정처장, 헌법재판소사무처장,
    중앙선거관리위원회사무총장이 소관 서훈을 추천한다. 그 소관에 속하지 않는 서훈은
    행정안전부장관이 추천하며, 모든 추천은 대통령령에 따른 공적심사를 거쳐야 한다.

    이 조문은 추천권자와 공적심사 원칙을 정하며, 퇴직 후 1년이라는 세부 추천기한 자체는
    연도별 정부포상업무지침에서 확인한다.
  refs: ["상훈법 §5"]
  pages: {중등: "248, 252", 초등: "258-259, 262"}
  verified: "2026-08-02"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "korean-law-mcp 현행 법령 검색 후 제5조 공식 원문 대조"
    unresolved: []
    applicability: "서훈 추천권자와 공적심사 절차"
    sources:
