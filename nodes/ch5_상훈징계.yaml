- id: honor-recommend-restriction
  type: 개념
  title: 상훈 추천 제한사유
  chapter: 5
  scope: 공통
  summary: 조사·기소·형사처분·징계·체납·과거 포상취소·사회적 물의 등은 포상 추천 제한사유다.
  body: |
    **재직공무원 제한**
    1. 감사·조사 또는 수사 중이거나 형사사건으로 기소 중인 사람
    2. 재직 중 행위로 벌금형 이상 형사처분을 받은 사람(선고유예 포함)
    3. 징계절차 진행·징계요구 중이거나 징계·불문경고 처분을 받은 사람
    4. 선거로 취임하는 특수경력직공무원
    5. 「상훈법」 제8조·「정부 표창 규정」 제19조 등에 따라 정부포상이 취소된 적이 있는 사람
    6. 추천일 현재 국세·관세·지방세를 체납한 사람
    7. 사회적 물의나 언론보도·소송·민원 논란으로 정부포상이 부적절하다고 판단되는 사람

    재직 중 1회 200만원 미만 벌금형은 공적이 현저히 탁월하면 예외 추천할 수 있으나,
    감경 제한 비위에 해당하는 범죄는 형벌의 종류·횟수와 관계없이 제외한다.

    **퇴직공무원 추가·차등 기준**
    - 형사처분 예외 기준은 재직공무원보다 엄격한 1회 100만원 미만이며, 공적심사위원회가 경미한 잘못과 특별한 공적을 인정해야 한다.
    - 퇴직포상을 이미 받은 뒤 복직한 사람, 불문경고·견책 합계 3회 이상, 예상 퇴직포상 훈격이 기존 포상과 같은 종류의 동급·하위인 경우도 제한된다.

    **현행 법령과의 차이**
    실무도우미는 감경 제한 비위를 「공무원 징계령 시행규칙」 제4조제2항 제1~6호로 설명한다.
    그러나 2025년 12월 30일 시행 현행 조문은 소극행정·직무태만·부당행위·채용비위·부정청탁 등
    제14호까지 두고 있다. 최신 정부포상업무지침이 확대된 현행 항목을 추천제한에 어떻게 적용하는지
    반드시 해당 포상계획에서 확인해야 한다.
  refs: ["2026 교원인사 실무도우미(중등) 252~255쪽", "2026 교원인사 실무도우미(초등) 263~266쪽", "상훈법 §8", "정부 표창 규정 §19", "공무원 징계령 시행규칙 §4②"]
  pages: {중등: "252-255", 초등: "263-266"}
  verified: "2026-08-02"
  legal_review:
    state: conflict
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "중등·초등 실무도우미 추천제한 목록을 대조하고 korean-law-mcp로 상훈법·정부 표창 규정·공무원 징계령 시행규칙 현행 조문 확인"
    unresolved:
      - "실무도우미는 공무원 징계령 시행규칙 제4조제2항 제1~6호를 인용하지만 현행 조문은 제14호까지 확대되어 최신 정부포상업무지침 적용범위 확인 필요"
      - "벌금형 예외와 사회적 물의 판단 등은 연도별 포상계획의 세부 심사기준을 함께 확인해야 함"
    applicability: "재직공무원과 퇴직공무원의 정부포상 추천 단계에 적용하며 두 대상의 벌금액 예외 기준이 다름"
