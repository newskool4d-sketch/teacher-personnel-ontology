- id: num-honor-retirement-years
  type: 수치·기한
  title: 퇴직포상 재직년수 기준 — 황조40년↑~교육부장관표창15년↑
  chapter: 5
  scope: 공통
  summary: 일반 퇴직포상은 황조근정훈장(40년 이상)부터 교육부장관표창(15~25년 미만)까지 재직기간별로 구분한다.
  body: |
    | 재직년수·요건 | 포상 등급 |
    | --- | --- |
    | 대학총장 경력자 특별추천 | 청조근정훈장(1등급) |
    | 40년 이상 | 황조근정훈장(2등급) |
    | 38년 이상~40년 미만 | 홍조근정훈장(3등급) |
    | 36년 이상~38년 미만 | 녹조근정훈장(4등급) |
    | 33년 이상~36년 미만 | 옥조근정훈장(5등급) |
    | 30년 이상~33년 미만 | 근정포장 |
    | 28년 이상~30년 미만 | 대통령표창 |
    | 25년 이상~28년 미만 | 국무총리표창 |
    | 15년 이상~25년 미만 | 교육부장관표창 |

    승진과 동시에 퇴직하면 승진 직급에 해당하는 훈격으로 추천할 수 있으나, 추천 후에는 훈격을 조정할 수 없다.
    여러 경력은 합산하고 12월은 1년, 30일은 1월로 계산하며, 최종 잔여 일수가 15일 이상이면 1월로 본다.
  refs: ["2026 교원인사 실무도우미(중등) 248~250쪽", "2026 교원인사 실무도우미(초등) 258~260쪽", "상훈법 §5"]
  pages: {중등: "248-250", 초등: "258-260"}
