# 제5장 상훈 및 징계 — 퇴직포상 기준/재포상 금지/징계 사유·시효·절차/종류와 효력/양정기준/소청심사
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제5장 상훈 및 징계"(파일 124~149행)
#       + § "7. 검증 한계·확인 필요"(행정소송 제소기한 불일치, 파일 233행)
# 페이지: 5장 상훈 및 징계 — 중등 약236~283쪽(Q&A 274~283), 초등 257~298쪽(Q&A 285~298)
# 법령 검증: korean-law-mcp로 국가공무원법(MST 286457)·교육공무원 징계령(MST 280455)·
