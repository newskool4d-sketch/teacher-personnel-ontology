- id: num-honor-reaward-ban
  type: 수치·기한
  title: 재포상 금지기간 — 훈장7년·포장5년·표창3년
  chapter: 5
  scope: 공통
  summary: 재포상은 수여일부터 추천일까지 훈장 7년·포장 5년·표창 3년 이상의 새로운 공적이 필요하다.
  body: |
    정부포상 수상자 또는 모범공무원이 다시 정부포상을 받으려면 기존 훈격과 관계없이 해당 분야에서
    훈장 7년, 포장 5년, 표창 3년 이상 새로운 공적을 쌓아야 한다. 단체표창은 같은 분야 공적으로
    2년 이내 다시 받을 수 없다. 퇴직포상과 정부시상에는 이 기간 기준을 적용하지 않는다.

    다만, 기간을 충족해도 「상훈법 시행령」 제17조의2에 따라 이미 받은 같은 종류·동급 또는 하위등급
    훈장과 같은 종류 포장은 다시 받을 수 없다. 퇴직포상 역시 재직 중 받은 정부포상과 같은 종류의
    동급·하위 훈격이면 추천할 수 없다.
  refs: ["2026 교원인사 실무도우미(중등) 251~252쪽", "2026 교원인사 실무도우미(초등) 261~262쪽", "상훈법 §4", "상훈법 시행령 §17의2"]
  pages: {중등: "251-252", 초등: "261-262"}
