- id: law-government-commendation-19
  type: 법령·조문
  title: 정부 표창 규정 제19조 — 표창 취소
  chapter: 5
  scope: 공통
  summary: 상훈법 제8조의 사유가 있으면 포상을 취소하고, 거짓 공적이면 시상도 취소한다.
  body: |
    표창권자는 포상을 받은 사람이 「상훈법」 제8조제1항 각 호의 취소 사유에 해당하면 포상을
    취소한다. 시상을 받은 사람은 거짓 공적으로 밝혀진 경우 시상을 취소한다.
    실무도우미는 이 규정에 따라 정부포상이 취소된 이력이 있는 사람을 원칙적 추천제한 대상으로 둔다.
  refs: ["정부 표창 규정 §19", "상훈법 §8"]
  pages: {중등: "253-255", 초등: "264, 266"}
