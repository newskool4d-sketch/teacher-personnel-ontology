- id: num-honor-recommend-deadline
  type: 수치·기한
  title: 퇴직포상 추천기한 — 퇴직일로부터 1년 이내
  chapter: 5
  scope: 공통
  summary: 퇴직포상은 원칙적으로 퇴직한 날부터 1년 이내 추천하며, 비정년 퇴직은 인사발령 후 추천한다.
  body: |
    퇴직공무원 포상은 특별한 사유가 없으면 퇴직한 날부터 1년 이내 추천한다. 대상자 책임이 아닌
    행정기관의 착오·과실로 기한이 지난 경우 추천권자가 특별한 사유를 인정하면 예외 추천할 수 있다.
    명예퇴직·의원면직 등 정년퇴직이 아닌 경우에는 인사발령 이후 추천해야 한다.

    일반 포상의 기준일은 추천권자가 행정안전부에 추천하는 날이고, 퇴직자 포상의 기준일은 퇴직일이다.
  refs: ["2026 교원인사 실무도우미(중등) 248·252쪽", "2026 교원인사 실무도우미(초등) 258~259·262쪽", "상훈법 §5", "정부 표창 규정 §6"]
