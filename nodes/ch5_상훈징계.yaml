- id: num-discipline-additional-charge
  type: 수치·기한
  title: 징계부가금 — 비위금액 5배 이내, 고지 후 60일 내 납부
  chapter: 5
  scope: 공통
  summary: 금품·향응수수 또는 횡령·배임 등으로 취득한 재산상 이득의 5배 이내에서 부과, 납부기간 내 미납 시 강제징수.
  body: |
    5배 이내 부과·미납 시 국세강제징수의 예에 따른 징수·체납 5년 경과 후 징수 불가능
    시 감면의결 요청은 국가공무원법 §78의2로 원문 확인됨(2026-08-03 재조회, MST 286457).
    다만 "고지 후 **60일** 이내 납부"라는 구체 일수는 §78의2 원문에 없다("납부기간 내"만
    규정) — 60일은 공무원 징계령 등 하위 절차규정 또는 인사혁신처 예규상 기준으로 추정되며,
    이번 조회에서 교육공무원 징계령 §17·§18에서도 직접 확인되지 않았다(확인필요, 출처
    재특정 필요).
  refs: ["국가공무원법 §78의2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-03"
  legal_review:
    state: needs_review
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 제78조의2 공식 원문 대조(재확인)"
    unresolved:
      - "\"고지 후 60일 이내 납부\"의 법적 근거를 특정하지 못함 — §78의2④는 '납부기간 내'로만 규정. 공무원 징계령 시행규칙 등 하위 규정 확인 필요"
    applicability: "국가공무원법이 적용되는 교육공무원 징계부가금 부과·납부 판단"
    sources:
      - law_name: "국가공무원법"
        article: "제78조의2"
        mst: "286457"
        effective_date: "2026-06-02"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/국가공무원법/제78조의2"

- id: discipline-mitigation
  type: 개념
  title: 징계 감경
  chapter: 5
  scope: 공통
  summary: 국무총리 이상(교사는 청장급 이상 또는 교육감 이상) 표창 등 공적이 있으면 파면→해임→강등→정직→감봉→견책→불문경고 순으로 1단계씩 감경 가능.
  body: |
    「교육공무원 징계양정 등에 관한 규칙」§4①2호 원문(2026-08-03 korean-law-mcp
    재조회): "「정부표창규정」에 따라 국무총리 이상의 표창을 받은 공적[교사의 경우에는
    중앙행정기관의 장인 청장(차관급 상당 기관장을 포함한다) 이상 또는 교육감 이상의
    표창을 받은 공적]" — 교사는 국무총리 표창이 아니라 **청장급 이상 또는 교육감 표창**
    으로도 감경 사유가 성립해, 실무에서 가장 흔히 쓰이는 감경 근거다. 이미 징계처분·
    경고 처분을 받은 사람의 공적은 감경 사유에서 제외된다(§4①단서).
  refs: ["교육공무원 징계양정 등에 관한 규칙 §4①"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-03"

- id: discipline-mitigation-exclusion
  type: 개념
  title: 징계감경 제외 17개 항목(제1~15호 + 제4의2·제8의2호)
  chapter: 5
  scope: 공통
  summary: 성비위·음주운전(측정불응 포함)·학생폭력·학교폭력 은폐·성비위 2차 피해·소극행정 등 17개 비위 유형은 감경 대상에서 제외(규칙 §4② 본문).
  body: |
    「교육공무원 징계양정 등에 관한 규칙」§4② 원문(2026-08-03 재조회, MST 280727,
    시행 2025-12-23): 제1호(§78의2 비위)부터 제15호(직무상 비밀·미공개정보 부당행위)에
    더해 "4의2. 음주운전 또는 음주측정에 대한 불응", "8의2. 성 관련 비위의 피해자에게
    2차 피해를 입혀 징계의 대상이 된 경우"가 포함되어 **총 17개 사유**다. 목록의 소재는
    별표가 아니라 §4② 본문 각호다.
  refs: ["교육공무원 징계양정 등에 관한 규칙 §4②"]
  pages: {중등: "236-283", 초등: "257-298"}
  aliases: ["감경제외"]
  verified: "2026-08-03"

- id: num-discipline-record-erasure
  type: 수치·기한
  title: 징계 기록말소기간 — 견책3·감봉5·정직7·강등9·직위해제2·불문1년
  chapter: 5
  scope: 공통
  summary: 인사기록에서 말소되는 기간은 견책 3년, 감봉 5년, 정직 7년, 강등 9년, 직위해제 2년, 불문(경고) 1년.
  body: |
    근거는 「교육공무원 인사기록 및 인사사무 처리 규칙」§8의2다(2026-08-03 korean-law-mcp
    재조회, MST 285461, 시행 2026-04-14). §8의2②1호 "직위해제처분이 끝난 날부터 2년이
    지났을 때"는 원문으로 직접 확인되어 이 항목의 "직위해제 2년"과 일치한다. 징계처분(강등9·
    정직7·감봉5·견책3년)은 같은 조 ①1호가 "징계처분 집행 종료일부터 각 목의 기간 경과
    시" 말소로 규정하며, 각 목의 구체 연수는 통상 기준으로 일치가 추정되나 이번 조회에서
    각 목 원문 전체를 재확인하지는 못했다(확인필요). 불문(경고) 1년은 별도 출처 확인 필요.
  refs: ["교육공무원 인사기록 및 인사사무 처리 규칙 §8의2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-03"
  legal_review:
    state: partial
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 제8조의2 공식 원문 대조(재확인)"
    unresolved:
      - "직위해제 2년(②1호)은 원문 직접 확인. 징계처분별(견책3·감봉5·정직7·강등9년) 세부는 ①1호 각 목 문언을 재조회에서 목록 단위로 확인하지 못함"
      - "불문(경고) 1년의 근거 조문 미특정"
    applicability: "교육공무원 인사기록카드의 징계·직위해제 처분 말소 시점 판단"
    sources:
      - law_name: "교육공무원 인사기록 및 인사사무 처리 규칙"
        article: "제8조의2"
        mst: "285461"
        effective_date: "2026-04-14"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/교육공무원인사기록및인사사무처리규칙/제8조의2"

