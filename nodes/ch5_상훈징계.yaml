- id: discipline-overview
  type: 개념
  title: 징계 개관
  chapter: 5
  scope: 공통
  summary: 국가공무원법·교육공무원 징계령에 근거한 교원 징계의 사유·시효·절차·종류·효력 체계 총칭.
  body: |
    세부 사유·시효·위원회 구성·의결/집행기한·종류별 효력·양정기준·감경·말소기간·배제기준은
    각 징계 종류별 항목과 수치·기한 항목을 참조한다.
  refs: ["국가공무원법 §78", "교육공무원 징계령"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: law-gukgong-78
  type: 법령·조문
  title: 국가공무원법 §78·§78의2 (징계 사유·징계부가금)
  chapter: 5
  scope: 공통
  summary: §78은 법령 위반·직무상 의무 위반·태만·체면 위신 손상 3가지 징계 사유를, §78의2는 금품·향응 수수 등에 대한 징계부가금 부과를 정한다.
  body: |
    ① 공무원이 다음 어느 하나에 해당하면 징계의결을 요구하고 그 결과에 따라 징계처분을 하여야 한다.
    1. 이 법 및 이 법에 따른 명령을 위반한 경우
    2. 직무상 의무(신분으로 인해 부과된 의무 포함)를 위반하거나 직무를 태만히 한 때
    3. 직무의 내외를 불문하고 체면 또는 위신을 손상하는 행위를 한 때

    §78의2(징계부가금)는 §78과 별개 조문으로, 금품·향응 수수 또는 공금의 횡령·유용 등
    비위로 취득한 재산상 이득의 5배 이내에서 징계부가금을 부과할 수 있도록 정한다(세부는
    [징계부가금](#/node/num-discipline-additional-charge) 참조). 징계부가금의 근거 조문은 §78의2이며, §78(징계 사유) 3가지 호와는
    별개 조문임에 유의.

    korean-law-mcp로 원문 확인(2026-08-02·2026-08-03, MST 286457).
  refs: ["국가공무원법 §78", "국가공무원법 §78의2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-statute-limitation
  type: 수치·기한
  title: 징계 시효 — 원칙3년·재산비위5년·성비위10년
  chapter: 5
  scope: 공통
  summary: 징계의결 요구는 사유 발생일로부터 원칙 3년, 재산상 비위(§78의2) 5년, 성 관련 비위 10년 경과 시 불가.
  body: |
    소청심사위원회·법원에서 절차상 흠이나 양정 과다를 이유로 징계처분을 무효·취소한 경우,
    그 결정·판결 확정일로부터 3개월 이내에는 시효가 지났더라도 다시 징계의결을 요구할 수 있다
    (국가공무원법 §83조의2③). korean-law-mcp로 원문 확인(2026-08-02, MST 286457).
  refs: ["국가공무원법 §83조의2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"
  legal_review:
    state: partial
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 제83조의2 공식 원문 대조"
    unresolved:
      - "①1호 각 목(10년 시효 대상 비위 유형)의 구체 문언은 재조회에서 목록 단위로 확인되지 않음 — '성비위 10년'이 각 목과 정확히 일치하는지 원문 재대조 필요"
    applicability: "국가공무원법이 적용되는 교육공무원 징계의결 요구 시효 판단"
    sources:
