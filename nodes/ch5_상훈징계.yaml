- id: num-suspension-pending-salary
  type: 수치·기한
  title: 직위해제 급여율 — 80%/50%(3개월 경과 시 30%)
  chapter: 5
  scope: 공통
  summary: 직위해제 기간 중 급여는 사유별로 80% 또는 50%, 3개월 경과 시 30%까지 감액.
  body: |
    공무원보수규정 §29 원문(2026-08-03 korean-law-mcp 재조회, MST 288433, 시행
    2026-08-01): "1. …「교육공무원법」 제44조의2제1항제1호 …에 따라 직위해제된 사람:
    봉급의 80퍼센트 …3. …「교육공무원법」 제44조의2제1항제2호부터 제4호까지 …:
    봉급의 50퍼센트. 다만, 직위해제일부터 3개월이 지나도 직위를 부여받지 못한 경우에는
    그 3개월이 지난 후의 기간 중에는 봉급의 30퍼센트를 지급한다." 이 항목의 수치와 정확히 일치한다.
  refs: ["공무원보수규정 §29"]
