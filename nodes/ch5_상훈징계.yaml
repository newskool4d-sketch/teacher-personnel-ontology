  type: 법령·조문
  title: 교육공무원 징계령
  chapter: 5
  scope: 공통
  summary: 교육공무원 징계위원회의 종류·구성·의결기한·처분 절차 등을 규정하는 대통령령(2025.12.23. 개정·시행).
  refs: ["교육공무원 징계령"]
