- id: num-cheongtak-price-limit
  type: 수치·기한
  title: 청탁금지법 가액기준 — 음식물·경조사비·선물 각 5만원(2025.12.30. 개정)
  chapter: 5
  scope: 공통
  summary: 음식물 5만원, 경조사비 5만원(화환 10만원), 선물 5만원(농수산물 15만원·명절 30만원).
  refs: ["부정청탁 및 금품등 수수의 금지에 관한 법률 시행령"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-additional-charge
  type: 수치·기한
  title: 징계부가금 — 비위금액 5배 이내, 고지 후 60일 내 납부
  chapter: 5
  scope: 공통
  summary: 금품·향응수수 또는 횡령·배임 등으로 취득한 재산상 이득의 5배 이내에서 부과, 고지 후 60일 이내 납부.
  body: |
    미납 시 국세강제징수의 예에 따라 징수하며, 체납일로부터 5년 경과 후에도 징수 불가능
    시 징계위원회에 감면 의결을 요청할 수 있다. korean-law-mcp로 원문 확인(2026-08-02,
    MST 286457 §78의2).
  refs: ["국가공무원법 §78의2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-mitigation
  type: 개념
  title: 징계 감경
  chapter: 5
  scope: 공통
  summary: 표창 등 공적이 있으면 파면→해임→강등→정직→감봉→견책→불문경고 순으로 1단계씩 감경 가능.
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-mitigation-exclusion
  type: 개념
  title: 징계감경 제외 15개 항목
  chapter: 5
  scope: 공통
  summary: 성비위·음주운전·학생폭력·학교폭력 은폐·소극행정 등 15개 비위 유형은 감경 대상에서 제외.
  body: |
    전체 15개 항목 목록은 실무도우미 요약본에 예시(성비위·음주운전·학생폭력·학폭은폐·
    소극행정)만 제시되어 있어 원문 별표 대조가 필요하다(확인필요).
  pages: {중등: "236-283", 초등: "257-298"}
  aliases: ["감경제외"]
  verified: "2026-08-02"

