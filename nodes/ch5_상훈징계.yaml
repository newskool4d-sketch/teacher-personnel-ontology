- id: law-civil-servant-discipline-rule-4
  type: 법령·조문
  title: 공무원 징계령 시행규칙 제4조 — 징계 감경과 제외 비위
  chapter: 5
  scope: 공통
  summary: 포상 공적 등은 징계 감경 사유가 될 수 있으나, 제2항의 중대 비위는 감경할 수 없다.
  body: |
    훈장·포장, 국무총리 이상 표창 등 일정 공적은 징계 감경 사유가 될 수 있다. 그러나 제4조제2항은
    재산비위, 성폭력·성매매·성희롱, 음주운전, 재산등록 의무 위반뿐 아니라 소극행정, 직무태만,
    부당행위, 채용비위, 부정청탁, 직무상 비밀 이용 등 제14호까지 감경 제외사유를 둔다.

    2026 실무도우미의 포상 추천제한 설명은 제1~6호만 인용하므로, 현행 조문 확대가 최신
    정부포상 심사기준에 반영됐는지는 해당 연도 포상계획으로 추가 확인한다.
