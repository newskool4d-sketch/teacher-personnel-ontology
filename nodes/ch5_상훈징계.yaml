- id: num-honor-first-award-period
  type: 수치·기한
  title: 최초 수공기간 — 훈장15년↑·포장10년↑·표창5년↑
  chapter: 5
  scope: 공통
  summary: 최초 정부포상은 해당 분야 공적기간이 훈장 15년·포장 10년·표창 5년 이상이어야 한다.
  body: |
    수공기간은 해당 분야에서 실제로 공적을 쌓은 기간이다. 훈장은 15년 이상, 포장은 10년 이상,
    표창은 5년 이상이어야 하며 퇴직공무원 포상은 별도 재직기간·훈격 기준을 적용한다.
    재직공무원 훈격의 수공기간은 실근무기간만 산정하여 임용 전 병역의무 복무기간, 휴직기간,
    군 양성교육기간 등을 제외한다.
  refs: ["2026 교원인사 실무도우미(중등) 248·251쪽", "2026 교원인사 실무도우미(초등) 258·261쪽", "정부포상업무지침"]
  pages: {중등: "248, 251", 초등: "258, 261"}
  verified: "2026-08-02"
  legal_review:
