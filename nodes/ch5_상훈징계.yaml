- id: discipline-overview
  type: 개념
  title: 징계 개관
  chapter: 5
  scope: 공통
  summary: 국가공무원법·교육공무원 징계령에 근거한 교원 징계의 사유·시효·절차·종류·효력 체계 총칭.
  body: |
    세부 사유·시효·위원회 구성·의결/집행기한·종류별 효력·양정기준·감경·말소기간·배제기준은
    각 `discipline-*`·`num-discipline-*` 노드 참조.
  refs: ["국가공무원법 §78", "교육공무원 징계령"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: law-gukgong-78
  type: 법령·조문
  title: 국가공무원법 §78 (징계 사유)
  chapter: 5
  scope: 공통
  summary: 법령 위반, 직무상 의무 위반·태만, 체면·위신 손상 3가지 사유에 해당하면 징계의결을 요구해야 한다.
  body: |
    ① 공무원이 다음 어느 하나에 해당하면 징계의결을 요구하고 그 결과에 따라 징계처분을 하여야 한다.
    1. 이 법 및 이 법에 따른 명령을 위반한 경우
    2. 직무상 의무(신분으로 인해 부과된 의무 포함)를 위반하거나 직무를 태만히 한 때
    3. 직무의 내외를 불문하고 체면 또는 위신을 손상하는 행위를 한 때

    korean-law-mcp로 원문 확인(2026-08-02, MST 286457).
  refs: ["국가공무원법 §78"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-statute-limitation
  type: 수치·기한
  title: 징계 시효 — 원칙3년·재산비위5년·성비위10년
  chapter: 5
  scope: 공통
  summary: 징계의결 요구는 사유 발생일로부터 원칙 3년, 재산상 비위(§78의2) 5년, 성 관련 비위 10년 경과 시 불가.
  body: |
    소청심사위원회·법원에서 절차상 흠이나 양정 과다를 이유로 징계처분을 무효·취소한 경우,
    그 결정·판결 확정일로부터 3개월 이내에는 시효가 지났더라도 다시 징계의결을 요구할 수 있다
    (국가공무원법 §83조의2③). korean-law-mcp로 원문 확인(2026-08-02, MST 286457).
  refs: ["국가공무원법 §83조의2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-committee
  type: 개념
  title: 징계위원회 — 특별징계위원회·일반징계위원회
  chapter: 5
  scope: 공통
  summary: 대상자 직급·직위에 따라 특별징계위원회(위원 5~9명)·일반징계위원회(위원 9~15명) 등으로 구분해 심의·의결.
  body: |
    특별징계위원회는 대학 단과대학장급, 교육부 소속 교수·장학관 및 일반징계위원회 미설치
    기관 소속자 등을 관할하며 위원장 1명 포함 5~9명으로 구성한다.
    일반징계위원회는 그 외 교육공무원을 관할하며 위원장 1명 포함 9~15명으로 구성하고,
    회의는 위원장과 위원장이 지정하는 위원 6명으로 진행한다.
    상위 직위자와 하위 직위자가 관련된 사건은 상위 직위자의 관할 위원회에서 함께 심의·의결한다.
    korean-law-mcp로 원문 확인(2026-08-02, MST 280455 §2·§4).
  refs: ["교육공무원 징계령 §2", "교육공무원 징계령 §4"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: law-gyoyuk-jinggye-ryeong
  type: 법령·조문
  title: 교육공무원 징계령
  chapter: 5
  scope: 공통
  summary: 교육공무원 징계위원회의 종류·구성·의결기한·처분 절차 등을 규정하는 대통령령(2025.12.23. 개정·시행).
  refs: ["교육공무원 징계령"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-resolution-deadline
  type: 수치·기한
  title: 징계 의결기한 — 60일(성비위 30일), 30일 연장 가능
  chapter: 5
  scope: 공통
  summary: 징계의결 요구서 접수일로부터 60일(성 관련 비위는 30일) 이내 의결, 부득이한 사유 시 30일 범위 연장 가능.
  body: |
    「양성평등기본법」§3②에 따른 성희롱 등 성 관련 비위만을 사유로 하는 사건은 30일 이내
    의결이 원칙이다. 국가공무원법 §83에 따라 징계 절차가 중지된 기간은 의결기한에 산입하지
    않는다. korean-law-mcp로 원문 확인(2026-08-02, MST 280455 §7).
  refs: ["교육공무원 징계령 §7"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-execution-deadline
  type: 수치·기한
  title: 징계 집행기한 — 의결서 수령 후 15일 이내
  chapter: 5
  scope: 공통
  summary: 처분권자는 징계(부가금) 의결서를 받은 날부터 15일 이내에 징계등 처분을 해야 한다.
  body: |
    처분 시 징계처분(또는 징계부가금 부과처분) 사유설명서에 의결서 사본을 첨부해 대상자에게
    교부한다. korean-law-mcp로 원문 확인(2026-08-02, MST 280455 §17).
  refs: ["교육공무원 징계령 §17"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: proc-discipline-flow
  type: 절차
  title: 징계 처리 절차
  chapter: 5
  scope: 공통
  summary: 사유 발생·인지 → 징계의결 요구 → 징계위원회 심의·의결(60일/성비위 30일) → 처분(15일 내) → 통보 → (불복 시) 소청심사.
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-pamyeon
  type: 개념
  title: 파면
  chapter: 5
  scope: 공통
  summary: 징계 중 최고 수위 — 퇴직급여 1/2 감액, 5년간 공무원 임용 결격.
  body: |
    재직기간에 따른 세부 감액률(예: 재직 5년 미만 구간의 차등) 등 공무원연금법 시행령 별표
    세부 내역은 원문 대조가 필요하다(확인필요). 「국가공무원법 §33」은 결격기간(5년)의 근거이며,
    퇴직급여 감액 자체의 직접 근거는 공무원연금법(§65 등, 확인필요)로 별도임.
  refs: ["국가공무원법 §33", "공무원연금법(§65 등, 확인필요)"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-haeim
  type: 개념
  title: 해임
  chapter: 5
  scope: 공통
  summary: 3년간 공무원 임용 결격, 금품·향응수수·공금횡령유용 등 사유로 해임되면 퇴직급여도 일부 감액.
  body: |
    파면과 달리 원칙적으로 퇴직급여는 전액 지급되나, 금품비위로 인한 해임은 퇴직급여가
    감액된다. 구체 감액률은 공무원연금법 시행령 별표 대조가 필요하다(확인필요). 「국가공무원법
    §33」은 결격기간(3년)의 근거이며, 퇴직급여 감액 자체의 직접 근거는 공무원연금법(§65 등,
    확인필요)로 별도임.
  refs: ["국가공무원법 §33", "공무원연금법(§65 등, 확인필요)"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-gangdeung
  type: 개념
  title: 강등
  chapter: 5
  scope: 공통
  summary: 교육공무원은 동종 직무 내 하위 직위로 임명, 신분은 보유하되 3개월간 직무정지·보수 전액 감액, 승급제한 18+3개월.
  body: |
    일반직 공무원은 1계급 아래로 직급을 내리나, 교육공무원의 강등은 「교육공무원법」§2⑩에
    따라 동종의 직무 내 하위 직위에 임명하는 방식이다(국가공무원법 §80②2호). 고등교육법
    §14 해당 교원·조교에는 강등을 적용하지 않는다. korean-law-mcp로 원문 확인(2026-08-02,
    MST 286457 §79·§80).
  refs: ["국가공무원법 §79", "국가공무원법 §80②2호", "공무원보수규정 §14①2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-jeongjik
  type: 개념
  title: 정직
  chapter: 5
  scope: 공통
  summary: 1개월 이상 3개월 이하 기간 동안 신분은 보유하나 직무에 종사하지 못하며 보수 전액 감액, 승급제한 18개월+정직기간.
  refs: ["국가공무원법 §79", "국가공무원법 §80③", "공무원보수규정 §14①2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-gambong
  type: 개념
  title: 감봉
  chapter: 5
  scope: 공통
  summary: 1개월 이상 3개월 이하 기간 동안 보수의 1/3을 감액, 승급제한 12개월.
  refs: ["국가공무원법 §79", "국가공무원법 §80④", "공무원보수규정 §14①2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-gyeonchaek
  type: 개념
  title: 견책
  chapter: 5
  scope: 공통
  summary: 가장 경미한 징계로 전과를 훈계·회개시키는 처분(직무정지·보수감액 없음), 승급제한 6개월.
  refs: ["국가공무원법 §79", "국가공무원법 §80⑤", "공무원보수규정 §14①2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-standard-table
  type: 수치·기한
  title: 징계양정기준(별표) 개정 — 2025.12.23.
  chapter: 5
  scope: 공통
  summary: 교육공무원 징계양정 등에 관한 규칙 및 교육공무원 징계령 별표가 2025.12.23. 개정·시행.
  body: |
    비위 유형(경/중)별 세부 양정 구간 조합표는 원문 별표 대조가 필요하다(확인필요).
    음주운전 기준(별표1의5)·성비위 기준(별표1의4)은 별도 노드 참조.
  refs: ["교육공무원 징계령"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-dui-standard
  type: 수치·기한
  title: 음주운전 징계기준 — 혈중알코올농도 구간별(별표1의5, 2025.12.30. 개정)
  chapter: 5
  scope: 공통
  summary: 혈중알코올농도 0.08%미만 정직~감봉, 0.08~0.2% 강등~정직, 0.2%이상·측정불응 해임~정직, 2회 파면~강등, 3회이상 파면~해임.
  body: |
    | 구분 | 양정 범위 |
    | --- | --- |
    | 0.08% 미만 | 정직~감봉 |
    | 0.08~0.2% | 강등~정직 |
    | 0.2% 이상·측정불응 | 해임~정직 |
    | 음주운전 2회 | 파면~강등 |
    | 음주운전 3회 이상 | 파면~해임 |

    상해·물적 피해 사고는 해임~정직, 사망사고와 인적 피해 후 도주는 파면~해임 등 별표의
    추가 유형이 있으므로 실제 사안은 별표 전체와 함께 대조해야 한다.
  refs: ["공무원 징계령 시행규칙 별표1의5(2025.12.30. 개정)"]
  pages: {중등: "236-283", 초등: "257-298"}
