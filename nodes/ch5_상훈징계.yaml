- id: num-cheongtak-price-limit
  type: 수치·기한
  title: 청탁금지법 가액기준 — 음식물·경조사비·선물 각 5만원(별표1, 2024.8.27. 개정)
  chapter: 5
  scope: 공통
  summary: 음식물 5만원, 경조사비 5만원(화환·조화 10만원), 선물 5만원(농수산물 15만원·설·추석 기간 30만원).
  body: |
    가액기준을 정하는 「부정청탁 및 금품등 수수의 금지에 관한 법률 시행령」[별표 1]의
    최종 개정일은 2024.8.27.이다(2026-08-03 별표 원문 재조회 — 별표
    머리말 "<개정 2024. 8. 27.>"). 수치 자체(5만/10만/15만/30만원)는 원문과 일치.
  refs: ["부정청탁 및 금품등 수수의 금지에 관한 법률 시행령 별표1(2024.8.27. 개정)"]
