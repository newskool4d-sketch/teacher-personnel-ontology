# 제5장 상훈 및 징계 — 퇴직포상 기준/재포상 금지/징계 사유·시효·절차/종류와 효력/양정기준/소청심사
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제5장 상훈 및 징계"(파일 124~149행)
#       + § "7. 검증 한계·확인 필요"(행정소송 제소기한 불일치, 파일 233행)
# 페이지: 5장 상훈 및 징계 — 중등 약236~283쪽(Q&A 274~283), 초등 257~298쪽(Q&A 285~298)
# 법령 검증: korean-law-mcp로 국가공무원법(MST 286457)·교육공무원 징계령(MST 280455)·
#            교원의 지위 향상 및 교육활동 보호를 위한 특별법(MST 283357) 원문 조회, 2026-08-02

- id: honor-overview
  type: 개념
  title: 상훈 개관
  chapter: 5
  scope: 공통
  summary: 재직 중 공적·퇴직 시 재직년수에 따른 정부포상(훈장·포장·표창) 체계의 총칭.
  body: |
    세부 재직년수 기준·재포상 금지기간·최초 수공기간·추천기한·추천제한사유는 각
    `num-honor-*`·`honor-recommend-restriction` 노드 참조. 상훈법·정부표창규정 등
    구체 근거 법령·조번호는 실무도우미 요약본에 명시되어 있지 않아 확인필요.
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-honor-retirement-years
  type: 수치·기한
  title: 퇴직포상 재직년수 기준 — 청조근정훈장40년↑~장관표창15년
  chapter: 5
  scope: 공통
  summary: 퇴직 시 정부포상 등급은 재직년수 구간별로 청조근정훈장(40년↑)부터 부총리(장관)표창(15~25년)까지 차등.
  body: |
    | 재직년수 | 포상 등급 |
    | --- | --- |
    | 40년 이상 | 청조근정훈장 |
    | 38~40년 | 황조근정훈장 |
    | 36~38년 | 홍조근정훈장 |
    | 33~36년 | 옥조근정훈장 |
    | 30~33년 | 근정포장 |
    | 28~30년 | 대통령표창 |
    | 25~28년 | 국무총리표창 |
    | 15~25년 | 부총리(장관)표창 |
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

