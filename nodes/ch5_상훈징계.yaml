- id: num-discipline-resolution-deadline
  type: 수치·기한
  title: 징계 의결기한 — 60일(성비위 30일), 30일 연장 가능
  chapter: 5
  scope: 공통
  summary: 징계의결 요구서 접수일로부터 60일(성 관련 비위는 30일) 이내 의결, 부득이한 사유 시 30일 범위 연장 가능.
  body: |
    「양성평등기본법」§3②에 따른 성희롱 등 성 관련 비위만을 사유로 하는 사건은 30일 이내
    의결이 원칙이다. 국가공무원법 §83에 따라 징계 절차가 중지된 기간은 의결기한에 산입하지
    않는다. korean-law-mcp로 원문 확인(2026-08-02, MST 280455 §7).
