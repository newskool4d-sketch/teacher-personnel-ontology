  verified: "2026-08-02"

- id: num-discipline-resolution-deadline
  type: 수치·기한
  title: 징계 의결기한 — 60일(성비위 30일), 30일 연장 가능
  chapter: 5
  scope: 공통
  summary: 징계의결 요구서 접수일로부터 60일(성 관련 비위는 30일) 이내 의결, 부득이한 사유 시 30일 범위 연장 가능.
  body: |
    「양성평등기본법」§3②에 따른 성희롱 등 성 관련 비위만을 사유로 하는 사건은 30일 이내
    의결이 원칙이다. 국가공무원법 §83에 따라 징계 절차가 중지된 기간은 의결기한에 산입하지
    않는다. korean-law-mcp로 원문 확인(2026-08-02, MST 280455 §7).
  refs: ["교육공무원 징계령 §7"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-discipline-execution-deadline
  type: 수치·기한
  title: 징계 집행기한 — 의결서 수령 후 15일 이내
  chapter: 5
  scope: 공통
  summary: 처분권자는 징계(부가금) 의결서를 받은 날부터 15일 이내에 징계등 처분을 해야 한다.
  body: |
    처분 시 징계처분(또는 징계부가금 부과처분) 사유설명서에 의결서 사본을 첨부해 대상자에게
    교부한다. korean-law-mcp로 원문 확인(2026-08-02, MST 280455 §17).
  refs: ["교육공무원 징계령 §17"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: proc-discipline-flow
  type: 절차
  title: 징계 처리 절차
  chapter: 5
  scope: 공통
  summary: 사유 발생·인지 → 징계의결 요구 → 징계위원회 심의·의결(60일/성비위 30일) → 처분(15일 내) → 통보 → (불복 시) 소청심사.
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-pamyeon
  type: 개념
  title: 파면
  chapter: 5
  scope: 공통
  summary: 징계 중 최고 수위 — 퇴직급여 1/2 감액, 5년간 공무원 임용 결격.
  body: |
    재직기간에 따른 세부 감액률(예: 재직 5년 미만 구간의 차등) 등 공무원연금법 시행령 별표
    세부 내역은 원문 대조가 필요하다(확인필요).
  refs: ["국가공무원법 §33"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-haeim
  type: 개념
  title: 해임
  chapter: 5
  scope: 공통
  summary: 3년간 공무원 임용 결격, 금품·향응수수·공금횡령유용 등 사유로 해임되면 퇴직급여도 일부 감액.
  body: |
    파면과 달리 원칙적으로 퇴직급여는 전액 지급되나, 금품비위로 인한 해임은 퇴직급여가
    감액된다. 구체 감액률은 공무원연금법 시행령 별표 대조가 필요하다(확인필요).
  refs: ["국가공무원법 §33"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-gangdeung
  type: 개념
  title: 강등
  chapter: 5
  scope: 공통
  summary: 교육공무원은 동종 직무 내 하위 직위로 임명, 신분은 보유하되 3개월간 직무정지·보수 전액 감액, 승급제한 18+3개월.
  body: |
    일반직 공무원은 1계급 아래로 직급을 내리나, 교육공무원의 강등은 「교육공무원법」§2⑩에
    따라 동종의 직무 내 하위 직위에 임명하는 방식이다(국가공무원법 §80②2호). 고등교육법
    §14 해당 교원·조교에는 강등을 적용하지 않는다. korean-law-mcp로 원문 확인(2026-08-02,
    MST 286457 §79·§80).
  refs: ["국가공무원법 §79", "국가공무원법 §80②2호"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

