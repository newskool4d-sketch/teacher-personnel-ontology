- id: discipline-pamyeon
  type: 개념
  title: 파면
  chapter: 5
  scope: 공통
  summary: 징계 중 최고 수위 — 퇴직급여·퇴직수당 일부 감액(재직기간별 차등), 5년간 공무원 임용 결격.
  body: |
    공무원연금법 §65① 원문(2026-08-03 재조회): "퇴직급여 및 퇴직수당의 일부를 줄여
    지급한다"로, 감액 대상은 퇴직급여뿐 아니라 **퇴직수당도 포함**된다("1/2 감액"으로만
    단정하면 퇴직수당 감액이 누락되어 보인다). 같은 법 시행령 §61①은 파면 등 사유별
    재직기간 구간에 따라 감액률을 차등 규정하므로, 일률적인 "1/2"이 아니라 재직기간별
    세부 감액률은 시행령 별표 원문 대조가 필요하다(확인필요). 「국가공무원법 §33」은
    결격기간(5년)의 근거이며, 퇴직급여·퇴직수당 감액 자체의 직접 근거는 공무원연금법
    §65①·시행령 §61①로 별도임.
  refs: ["국가공무원법 §33", "공무원연금법 §65①", "공무원연금법 시행령 §61①(세부 감액률 확인필요)"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-03"

- id: discipline-haeim
  type: 개념
  title: 해임
  chapter: 5
  scope: 공통
  summary: 3년간 공무원 임용 결격, 금품·향응수수·공금횡령유용 등 사유로 해임되면 퇴직급여도 일부 감액.
  body: |
    파면과 달리 원칙적으로 퇴직급여는 전액 지급되나, 금품비위로 인한 해임은 퇴직급여가
    감액된다. 구체 감액률은 공무원연금법 시행령 별표 대조가 필요하다(확인필요). 「국가공무원법
    §33」은 결격기간(3년)의 근거이며, 퇴직급여 감액 자체의 직접 근거는 공무원연금법(§65 등,
    확인필요)로 별도임.
  refs: ["국가공무원법 §33", "공무원연금법(§65 등, 확인필요)"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: discipline-gangdeung
  type: 개념
  title: 강등
  chapter: 5
  scope: 공통
  summary: 교육공무원은 동종 직무 내 하위 직위로 임명, 신분은 보유하되 3개월간 직무정지·보수 전액 감액, 승급제한 18+3개월.
  body: |
    일반직 공무원은 1계급 아래로 직급을 내리나, 교육공무원의 강등은 「교육공무원법」§2⑩에
    따라 동종의 직무 내 하위 직위에 임명하는 방식이다(국가공무원법 §80②2호). 고등교육법
    §14 해당 교원·조교에는 강등을 적용하지 않는다. korean-law-mcp로 원문 확인(2026-08-02,
    MST 286457 §79·§80).
  refs: ["국가공무원법 §79", "국가공무원법 §80②2호", "공무원보수규정 §14①2"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

