- id: law-honors-decree-17-2
  type: 법령·조문
  title: 상훈법 시행령 제17조의2 — 동종·동급 재수여 제한
  chapter: 5
  scope: 공통
  summary: 이미 받은 같은 종류의 동급·하위 훈장과 같은 종류 포장은 원칙적으로 다시 수여할 수 없다.
  body: |
    훈장 또는 포장을 받은 사람에게 이미 받은 훈장과 같은 종류의 동급·하위 등급 훈장이나,
    이미 받은 포장과 같은 종류의 포장을 다시 수여할 수 없다. 다만 전투·대간첩작전에서 뚜렷한
    무공을 세운 경우와 간첩수사로 국가안전보장에 뚜렷한 공을 세운 경우는 예외다.

    재포상 금지 ‘기간’과 별개로 적용되는 동종·등급 제한이므로 과거 포상이력을 함께 대조한다.
  refs: ["상훈법 시행령 §17의2"]
  pages: {중등: "251-252", 초등: "261-262"}
  verified: "2026-08-02"
  legal_review:
