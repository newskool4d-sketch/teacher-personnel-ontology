        article: "제83조의2제1항"
        mst: "286457"
        effective_date: "2026-06-02"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/국가공무원법/제83조의2"

- id: discipline-committee
  type: 개념
  title: 징계위원회 — 특별징계위원회·일반징계위원회
  chapter: 5
  scope: 공통
  summary: 대학의장징계위원회·특별징계위원회(위원 5~9명)·일반징계위원회(위원 9~15명) 3종으로 구분해 심의·의결. 시·군·구 교육행정기관(교육지원청) 일반징계위원회는 소속 교사의 경징계 사건만 관할.
  body: |
    교육공무원 징계령 §2①은 "대학의장징계위원회ㆍ특별징계위원회와 일반징계위원회로
    구분한다"고 정해 대학의장징계위원회를 포함한 3종 체계다(2026-08-03 재조회).
    특별징계위원회는 대학 단과대학장급, 교육부 소속 교수·장학관 및 일반징계위원회 미설치
    기관 소속자 등을 관할하며 위원장 1명 포함 5~9명으로 구성한다.
    일반징계위원회는 그 외 교육공무원을 관할하며 위원장 1명 포함 9~15명으로 구성하고,
    회의는 위원장과 위원장이 지정하는 위원 6명으로 진행한다. §2④ 단서: "시·군·구
    교육행정기관에 두는 일반징계위원회는 해당 시·군·구 교육행정기관 소속 교사에 대한
    경징계 또는 경징계 관련 징계부가금 부과 사건에 한정하여 심의·의결한다" — 교육지원청
    일반징계위는 중징계 사건을 다루지 않는다.
    상위 직위자와 하위 직위자가 관련된 사건은 상위 직위자의 관할 위원회에서 함께 심의·의결한다.
  refs: ["교육공무원 징계령 §2①·④", "교육공무원 징계령 §4"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-03"

- id: law-gyoyuk-jinggye-ryeong
  type: 법령·조문
  title: 교육공무원 징계령
  chapter: 5
  scope: 공통
  summary: 교육공무원 징계위원회의 종류·구성·의결기한·처분 절차 등을 규정하는 대통령령(2025.12.23. 개정·시행).
  body: |
    교육공무원의 징계와 징계부가금 사건을 심의·의결하는 위원회의 관할, 구성과 사건 처리
    절차를 정한다.

    **위원회와 의결 절차**

    대학의장징계위원회, 특별징계위원회, 일반징계위원회로 구분하며 대상자의 직위와 소속에
    따라 관할을 달리한다. 위원회 구성에는 외부위원 비율과 성별 구성 기준이 적용된다.
    의결 요구 전에는 징계 사유를 충분히 조사하고 인사기록, 확인서, 증거자료, 조사·수사기록
    등 관계 자료를 제출해야 한다.

    **기한과 당사자 권리**

    징계위원회는 요구서 접수일부터 60일 이내에 의결해야 하며, 성 관련 비위만을 사유로 하는
    경우에는 30일 이내에 의결한다. 부득이한 사유가 있으면 위원회 의결로 30일 범위에서
    연기할 수 있다. 징계 혐의자에게는 충분한 진술 기회와 증거 제출, 증인 심문 신청 기회를
    보장해야 한다.

    의결서에는 원인이 된 사실, 증거 판단과 관계 법령 등을 구체적으로 밝혀야 한다. 처분권자는
    의결서를 받은 날부터 15일 이내에 처분하고, 사유설명서와 의결서 사본을 대상자에게
    교부해야 한다.
  refs: ["교육공무원 징계령"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-04"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 제2조·제4조·제6조·제7조·제9조·제10조·제17조 공식 원문 대조"
    unresolved: []
    applicability: "교육공무원 징계위원회의 관할·구성, 징계 의결 요구부터 처분까지의 절차"
    sources:
      - law_name: "교육공무원 징계령"
        article: "제2조·제4조·제6조·제7조·제9조·제10조·제17조"
        mst: "280455"
