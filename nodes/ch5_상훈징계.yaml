  type: 개념
  title: 징계자 승진배제
  chapter: 5
  scope: 공통
  summary: 4대 비위·성비위 징계자는 교장·교감 승진·자격연수 영구 배제, 음주운전 징계자도 시기별로 배제.
  body: |
    음주운전 징계자는 교(원)장 2022.1.1.~, 교(원)감 2025.3.1.~ 승진·자격연수 대상에서
    배제된다. 4대 비위·성비위는 시행일 구분 없이 영구 배제이다.
