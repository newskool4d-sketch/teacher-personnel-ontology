- id: law-honors-act-4
  type: 법령·조문
  title: 상훈법 제4조 — 동일 공적 중복 수여 금지
  chapter: 5
  scope: 공통
  summary: 동일한 공적에 대해서는 훈장 또는 포장을 거듭 수여할 수 없다.
  body: |
    「상훈법」 제4조는 동일한 공적에 훈장이나 포장을 중복하여 수여하지 못하도록 한다.
    이 조문은 같은 사람의 모든 후속 포상을 일률적으로 금지하는 규정이 아니라, **동일 공적**의
    중복 수여를 막는 규정이다. 새로운 공적의 재포상 기간과 같은 종류·등급 제한은 업무지침과
    「상훈법 시행령」 제17조의2를 함께 확인한다.
  refs: ["상훈법 §4"]
  pages: {중등: "247, 251", 초등: "257, 261"}
  verified: "2026-08-02"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "korean-law-mcp 현행 법령 검색 후 제4조 공식 원문 대조"
    unresolved: []
    applicability: "동일 공적에 대한 훈장·포장 중복 수여 판단"
