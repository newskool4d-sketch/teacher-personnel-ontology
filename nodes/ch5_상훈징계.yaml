- id: law-government-commendation-6
  type: 법령·조문
  title: 정부 표창 규정 제6조 — 표창 추천권자
  chapter: 5
  scope: 공통
  summary: 상훈법상 서훈 추천권자와 서울특별시장이 정부 표창을 추천한다.
  body: |
    정부 표창은 「상훈법」 제5조제1항·제2항에 따른 서훈 추천권자와
    「서울특별시 행정특례에 관한 법률」에 따른 서울특별시장이 추천한다.
    실무도우미의 ‘일반 포상 기준일’은 이 추천권자가 행정안전부에 추천하는 날을 말한다.
