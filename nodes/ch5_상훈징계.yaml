- id: suspension-pending
  type: 개념
  title: 직위해제
  chapter: 5
  scope: 공통
  summary: 직무수행 능력 부족·징계의결 요구 중·형사기소 등 사유로 직위를 부여하지 않는 처분, 휴직과 구별되며 승급 불산입.
  body: |
    휴직 중인 자에게는 직위해제를 할 수 없다(총무처 인기 12107-273, `qa-leave-during-suspension`
    참조). 정직처분과 휴직이 중첩되면 정직 집행을 정지했다가 휴직 종료 후 집행한다. "승급 불산입"의
    직접 근거는 공무원보수규정 §14①1(6장 `promotion-nonaccrual` 참조)이며, 「교육공무원법 §44의2」는
    직위해제 제도 자체의 근거임.
  refs: ["교육공무원법 §44의2", "공무원보수규정 §14①1"]
  pages: {중등: "236-283", 초등: "257-298"}
  aliases: ["직해"]
  verified: "2026-08-02"

