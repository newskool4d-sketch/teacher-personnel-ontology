- id: num-discipline-standard-table
  type: 수치·기한
  title: 징계양정기준(별표) 개정 — 2025.12.23.
  chapter: 5
  scope: 공통
  summary: 교육공무원 징계양정 등에 관한 규칙 및 교육공무원 징계령 별표가 2025.12.23. 개정·시행.
  body: |
    비위 유형(경/중)별 세부 양정 구간 조합표는 원문 별표 대조가 필요하다(확인필요).
    음주운전 기준(별표1의5)·성비위 기준(별표1의4)은 별도 노드 참조.
