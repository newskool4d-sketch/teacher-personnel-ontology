- id: law-honors-act-8
  type: 법령·조문
  title: 상훈법 제8조 — 서훈 취소와 환수
  chapter: 5
  scope: 공통
  summary: 거짓 공적·국가안전 관련 범죄·중한 형 확정 시 서훈을 취소하고 관련 물건과 금전을 환수한다.
  body: |
    서훈 공적이 거짓으로 밝혀지거나, 국가안전에 관한 죄로 형을 받거나 적대지역으로 도피한 경우,
    사형·무기 또는 1년 이상의 징역·금고형이 확정된 경우에는 서훈을 취소하고 훈장·포장과 관련
    물건·금전을 환수한다. 취소·환수는 국무회의 심의를 거쳐 진행한다.

    정부포상 추천제한에서 말하는 ‘과거 정부포상 취소’의 법률상 근거 조문이다.
  refs: ["상훈법 §8"]
  pages: {중등: "253-255", 초등: "264, 266"}
  verified: "2026-08-02"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "korean-law-mcp 현행 법령 검색 후 제8조 공식 원문 대조"
    unresolved: []
    applicability: "훈장·포장 서훈의 취소와 환수 및 추천제한 이력 확인"
