- id: honor-overview
  type: 개념
  title: 상훈 개관
  chapter: 5
  scope: 공통
  summary: 재직 중 공적·퇴직 시 재직년수에 따른 정부포상(훈장·포장·표창) 체계의 총칭.
  body: |
    상훈 업무는 ① 동일 공적에 대한 중복 수여 금지, ② 서훈·표창 추천과 공적심사,
    ③ 같은 종류·등급의 재수여 제한, ④ 취소 사유라는 법령상 틀과, 연도별
    「정부포상업무지침」이 정하는 수공기간·재포상 금지기간·퇴직포상 훈격·추천제한으로 구성된다.

    **현행 법령에서 직접 확인한 사항**
    - 「상훈법」 제4조: 동일한 공적에 훈장·포장을 거듭 수여할 수 없다.
    - 「상훈법」 제5조: 중앙행정기관장 등 추천권자가 공적심사를 거쳐 서훈을 추천한다.
    - 「상훈법 시행령」 제17조의2: 이미 받은 같은 종류·동급 또는 하위 훈장과 같은 종류 포장의 재수여를 제한한다.
    - 「상훈법」 제8조·「정부 표창 규정」 제19조: 서훈·표창 취소 사유와 절차를 둔다.

    **2026 실무도우미에서 확인한 운영기준**
    퇴직포상 훈격, 최초 수공기간, 7·5·3년 재포상 금지기간, 퇴직 후 1년 추천기한,
    재직·퇴직공무원별 추천제한은 아래 연결된 항목에서 확인한다. 이 세부 수치는 법률·대통령령
    본문이 아니라 연도별 업무지침에 따른 운영기준이므로 매 포상계획 공문과 최신 지침을 다시 확인해야 한다.
  refs: ["상훈법 §4·§5·§8", "상훈법 시행령 §17의2", "정부 표창 규정 §6·§19", "정부포상업무지침"]
  pages: {중등: "247-255", 초등: "257-266"}
