- id: suspension-pending
  type: 개념
  title: 직위해제
  chapter: 5
  scope: 공통
  summary: 직무수행 능력 부족·중징계(파면·해임·강등·정직) 의결 요구 중·금품비위/성범죄 등 조사·수사 중(비위 중대+정상업무 곤란) 사유로 직위를 부여하지 않는 처분, 휴직과 구별되며 승급 불산입.
  body: |
    직위해제 요건은 한정적이다. 교육공무원법 §44의2① 원문(2026-08-03 korean-law-mcp
    재조회): "2. **파면·해임·강등 또는 정직에 해당하는** 징계의결이 요구 중인 자"(중징계
    한정 — 감봉·견책 등 경징계 의결 요구만으로는 직위해제할 수 없다), "3. 형사 사건으로
    기소된 자(약식명령이 청구된 자는 제외한다)", "4. 금품비위, 성범죄 등 대통령령으로
    정하는 비위행위로 감사원 및 검찰·경찰 등 수사기관에서 조사나 수사 중인 자로서 비위의
    정도가 중대하고 이로 인하여 정상적인 업무수행을 기대하기 현저히 어려운 자". 국가공무원법
    §73의3①3호도 동일하게 중징계로 한정한다. 경징계 의결 요구자를 직위해제하면 법정 요건
    결여로 위법한 처분(소청·소송 취소 사유)이 된다.

    휴직 중인 자에게는 직위해제를 할 수 없다(총무처 인기 12107-273, [휴직 중 직위해제 가능 여부](#/node/qa-leave-during-suspension)
    참조). 정직처분과 휴직이 중첩되면 정직 집행을 정지했다가 휴직 종료 후 집행한다. "승급 불산입"의
    직접 근거는 공무원보수규정 §14①1(6장 [승급 불산입 사유](#/node/promotion-nonaccrual) 참조)이며, 「교육공무원법 §44의2①」는
    직위해제 제도 자체의 근거임.
  refs: ["교육공무원법 §44의2①", "국가공무원법 §73의3①", "공무원보수규정 §14①1"]
  pages: {중등: "236-283", 초등: "257-298"}
  aliases: ["직해"]
  verified: "2026-08-03"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-03"
    checked_at: "2026-08-03"
    method: "korean-law-mcp 현행 법령 검색 후 §44의2① 및 국가공무원법 §73의3① 공식 원문 대조"
    unresolved: []
    applicability: "교육공무원의 직위해제 요건"
    sources:
