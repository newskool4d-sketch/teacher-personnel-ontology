- id: num-appeal-decision-deadline
  type: 수치·기한
  title: 소청심사 결정기한 — 접수 후 60일(+30일 연장 가능)
  chapter: 5
  scope: 공통
  summary: 심사위원회는 청구 접수일로부터 60일 이내 결정하며, 불가피한 경우 의결로 30일 연장 가능.
  body: |
    처분권자는 결정서를 송달받은 날부터 30일 이내에 결정 취지에 따른 구제조치를 하고 그
    결과를 심사위원회에 제출해야 한다(§10③).
  refs: ["교원의 지위 향상 및 교육활동 보호를 위한 특별법 §10①"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: num-appeal-lawsuit-deadline
  type: 수치·기한
  title: 소청심사 결정 후 행정소송 제소기한 — 결정서 송달일로부터 30일 이내
  chapter: 5
  scope: 공통
  summary: 교원지위법 §10④에 따라 소청심사 결정서 송달일로부터 30일 이내 행정소송 제기 가능(90일 아님).
  body: |
    실무도우미 요약본은 중등판 90일·초등판 30일로 서로 다르게 파싱·요약되어 정밀분석
    보고서(§7 검증 한계)에서 "원문·교원지위법 재확인 필요"로 플래그되었다.

    korean-law-mcp로 「교원의 지위 향상 및 교육활동 보호를 위한 특별법」(MST 283357, 시행
    2026.2.19.) §10을 직접 조회한 결과, 정답은 **30일**이다.

    > 제10조(소청심사 결정 등) ④ 제1항에 따른 심사위원회의 결정에 대하여 교원, 「사립학교법」
    > 제2조에 따른 학교법인 또는 사립학교 경영자 등 당사자(공공단체는 제외한다)는 그
    > 결정서를 송달받은 날부터 30일 이내에 「행정소송법」으로 정하는 바에 따라 소송을
    > 제기할 수 있다.
    > ⑤ 제4항에 따른 기간 이내에 행정소송을 제기하지 아니하면 그 결정은 확정된다.

    즉 중등판 요약(90일)이 오류이며, 초등판 요약(30일)이 조문과 일치한다(확인일 2026-08-02).
  refs: ["교원의 지위 향상 및 교육활동 보호를 위한 특별법 §10④"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"

- id: law-teacher-status-act-10
  type: 법령·조문
  title: 교원의 지위 향상 및 교육활동 보호를 위한 특별법 §10 (소청심사 결정 등)
  chapter: 5
  scope: 공통
  summary: 소청심사 결정기한(60일+30일 연장)·구제조치기한(30일)·행정소송 제소기한(결정서 송달일로부터 30일)을 규정.
  body: |
    ① 심사위원회는 소청심사청구를 접수한 날부터 60일 이내에 결정하여야 한다. 다만
    불가피하다고 인정하면 의결로 30일을 연장할 수 있다.
    ③ 처분권자는 결정서를 송달받은 날부터 30일 이내에 결정 취지에 따라 구제조치를 하고
    그 결과를 심사위원회에 제출해야 한다.
    ④ 당사자(공공단체 제외)는 결정서를 송달받은 날부터 30일 이내에 「행정소송법」이
    정하는 바에 따라 소송을 제기할 수 있다.
    ⑤ 제4항 기간 내 행정소송을 제기하지 않으면 결정이 확정된다.

    korean-law-mcp로 원문 확인(2026-08-02, MST 283357, 시행일 2026.2.19. 현행 조문 기준).
  refs: ["교원의 지위 향상 및 교육활동 보호를 위한 특별법 §10"]
  pages: {중등: "236-283", 초등: "257-298"}
  verified: "2026-08-02"
