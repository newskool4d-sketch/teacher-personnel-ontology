    method: "중등·초등 실무도우미 표를 교차 대조하고 korean-law-mcp로 상훈법 제5조 확인"
    unresolved:
      - "재직기간별 훈격은 상훈법 본문이 아닌 연도별 정부포상업무지침 기준이므로 해당 연도 공식 포상계획에서 재확인 필요"
    applicability: "2026 실무도우미에 수록된 교육공무원 퇴직포상 추천 훈격이며 청조근정훈장은 대학총장 경력자 특별추천 대상"
