- id: num-disqual-minor-sexcrime-20y
  type: 수치·기한
  title: 결격사유 — 미성년자 대상 성범죄, 국가공무원법 기준 20년(교육공무원은 기간 제한 없음)
  chapter: 2
  scope: 공통
  summary: 국가공무원법 §33 6의4는 미성년자 성범죄를 각 목 해당일부터 20년 결격으로 정하나, 교육공무원은 §10의4에 따라 기간 제한 없이 결격이다.
  body: |
    국가공무원법 §33 6의4 원문: "미성년자에 대하여 … 성폭력범죄 또는 … 아동·청소년대상
    성범죄를 범한 사람으로서 다음 각 목의 어느 하나에 해당하는 날부터 20년이 지나지
    아니한 사람". 기산점은 "형 확정일"이 아니라 "각 목 해당일"이며(실형은 집행 종료·
    면제일 등으로 확정일보다 늦게 시작 — 각 목 세부는 원문 재대조 필요, 확인필요), 벌금형·
    치료감호 포함 여부도 각 목 대조가 필요하다.

    교육공무원 채용에는 이와 별도로 **교육공무원법 §10의4 제2호**가 적용된다: "미성년자에
    대한 … 행위로 파면·해임되거나 형 또는 치료감호를 선고받아 그 형 또는 치료감호가
    확정된 사람(집행유예를 선고받은 후 그 집행유예기간이 지난 사람을 포함한다)"은
    **기간 제한 없이** 임용 결격이다(disqual-education-official-10-4 참조). 즉 이 노드의
    20년 수치는 국가공무원법 일반 기준이며, 교육공무원 채용 실무에서는 §10의4가 우선
    적용되어 "20년 경과 후 임용 가능"이 아니다.
  refs: ["국가공무원법 §33 6의4", "교육공무원법 §10의4"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-03"
  legal_review:
    state: partial
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 제33조·제10조의4 공식 원문 대조"
    unresolved:
