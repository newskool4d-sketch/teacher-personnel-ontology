- id: recruit-career-competitive
  type: 개념
  title: 경력경쟁채용(교육공무원법 §12)
  chapter: 2
  scope: 공통
  summary: 공개전형에 의하지 않고 특정 자격·경력요건을 충족하는 자를 대상으로 하는 채용방식(5개 사유).
  body: |
    실무도우미 요약이 예시한 사유: 휴직만료 퇴직자 2년 내 재임용, 특수지역·교과 등.
    5개 사유 전체 목록은 원문(교육공무원법 §12 및 시행령) 대조 필요 — 확인필요.
  refs: ["교육공무원법 §12"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: transfer-jeonbo-restriction-1y
  type: 개념
  title: 전보 제한 — 임용 후 1년 내 전보 금지
  chapter: 2
  scope: 공통
  summary: 신규임용 후 1년 이내에는 원칙적으로 전보가 제한되며, 예외 사유가 다수 존재한다.
  body: |
    구체적 예외 사유 목록은 실무도우미 요약에 나열되어 있지 않아 원문 대조가 필요하다 — 확인필요.
    원문(실무도우미)은 이 규칙을 "전직" 행에 함께 제시하지만, 전보(직위·자격 유지, 근무 기관만 이동)와
    전직(직렬·자격 변경)은 별개 개념(1장 term-jeonjik/term-jeonbo 참조)이므로 온톨로지에서는 분리해
    전보 노드로 편성함.
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: transfer-jeonjik-restriction
  type: 개념
  title: 전직 — 교육전문직 ↔ 교원 재전직
  chapter: 2
  scope: 공통
  summary: 교육전문직에서 교원으로, 또는 교원에서 교육전문직으로 직렬·자격을 달리해 옮기는 임용 행위.
  body: |
    교육전문직 ↔ 교원 간 재전직 시 근속 요건과 횟수 제한은 num-jeonjik-reappoint 참조.
    임용 후 1년 내 전보 제한은 별개 개념(transfer-jeonbo-restriction-1y, 전보) 참조.
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: num-jeonjik-reappoint
  type: 수치·기한
  title: 교육전문직 재전직 요건 — 교사출신 5년·교감출신 2년, 재전직 1회 한
  chapter: 2
