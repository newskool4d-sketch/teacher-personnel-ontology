  scope: 공통
  summary: 재직기간 20년 이상이고 정년퇴직일까지 1년 이상 남아야 명예퇴직을 신청할 수 있다.
  refs: ["국가공무원 명예퇴직수당 등 지급 규정 §3①(교육공무원법 §36③ 위임)"]
  pages: {중등: "21-41", 초등: "21-44"}
