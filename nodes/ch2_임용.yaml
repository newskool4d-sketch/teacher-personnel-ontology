- id: retire-age
  type: 개념
  title: 정년퇴직
  chapter: 2
  scope: 공통
  summary: 교육공무원의 정년은 62세이며, 정년 도래 시기에 따라 퇴직일이 달라진다.
  body: |
    | 정년(62세) 도래 시기 | 퇴직일 |
