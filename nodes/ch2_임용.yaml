- id: dispatch-pagyeon
  type: 개념
  title: 파견(교육공무원임용령 §7의3)
  chapter: 2
  scope: 공통
  summary: 사유 11종에 따라 소속을 유지한 채 다른 기관에서 근무하게 하는 임용 형태.
  body: |
    일반 행정업무 지원 목적의 교사 파견은 금지되며, 연속 지원·연장도 금지된다.
    11종 사유 각각의 세부 내용은 원문 대조 필요 — 확인필요.
  refs: ["교육공무원임용령 §7의3"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

