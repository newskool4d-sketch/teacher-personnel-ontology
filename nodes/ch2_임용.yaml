- id: num-resign-voluntary-14d
  type: 수치·기한
  title: 의원면직 청원일 — 공문발송 후 최소 14일 이후
  chapter: 2
  scope: 공통
  summary: 비위조회 기간 확보를 위해 면직청원일은 공문 발송 후 최소 14일 이후로 지정한다.
  body: |
    "청원일 0시부로 신분 상실"의 근거인 교육공무원임용령 §5①("임용장·임용통지서에 적힌
    일자에 임용된 것으로 보며 소급 불가")은 korean-law-mcp로 확인했으나(2026-08-02),
    "공문발송 후 최소 14일 이후"라는 구체 일수 자체는 동 조문에 명시되어 있지 않아
    확인필요.
  refs: ["확인필요"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: death-separation
  type: 개념
  title: 사망면직
  chapter: 2
  scope: 공통
  summary: 재직 중 사망한 교육공무원은 사망 다음날 자로 면직 처리되며, 7일 이내 보고해야 한다.
  pages: {중등: "21-41", 초등: "21-44"}
