- id: num-candidate-list-3x-1y
  type: 수치·기한
  title: 임용후보자명부 — 선발예정인원 3배수·유효기간 1년(2년 연장 가능)
  chapter: 2
  scope: 공통
  summary: 공개전형 합격자로 작성하는 임용후보자명부는 3배수로 작성하며, 유효기간은 1년(최대 2년 연장 가능)이다.
  body: |
    "채용예정인원의 3배수 범위 안에서 임용"은 교육공무원임용령 §10②로 korean-law-mcp
    직접 확인됨(2026-08-02). "유효기간 1년(2년 연장 가능)"의 구체 근거 조문은 동 영에서
    확인되지 않아 별도 대조 필요 — 확인필요.
  refs: ["교육공무원임용령 §10②"]
  pages: {중등: "21-41", 초등: "21-44"}
