- id: num-death-separation
  type: 수치·기한
  title: 사망면직 — 사망 다음날 면직, 7일 이내 보고
  chapter: 2
  scope: 공통
  summary: 사망일 다음날을 면직일로 하며, 소속 기관은 7일 이내에 보고해야 한다.
  body: |
    "사망 다음날 면직"은 교육공무원임용령 §5②("사망으로 인한 면직은 사망한 다음 날에
    면직된 것으로 본다")로 korean-law-mcp 직접 확인됨(2026-08-02). "7일 이내 보고"의
    구체 근거 조문은 동 영에서 확인되지 않아 별도 대조 필요 — 확인필요.
  refs: ["교육공무원임용령 §5②"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: dismissal-discretionary
  type: 개념
  title: 직권면직 사유
  chapter: 2
  scope: 공통
  summary: 임용권자가 직권으로 면직시키는 제도(실무도우미 제2장 표에 미수록 — 원문 확인 필요).
  body: |
    실무도우미(중등·초등 모두) 제2장 표에는 직권면직이 별도 항목으로 수록되어 있지 않다.
    일반적으로 직제·정원 개편에 따른 폐직·과원, 휴직 기간 만료 후 미복귀, 직무수행 능력·자격
    부족 등의 사유로 임용권자가 직권으로 면직시키는 제도로 알려져 있다(국가공무원법 §70 등).
    다만 본 온톨로지는 실무도우미 원문 근거를 원칙으로 하므로, 구체적 개별 호와 정확한
    조번호는 원문 법령 확인이 필요하다 — 확인필요.
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-02"
