- id: num-disqual-minor-sexcrime-20y
  type: 수치·기한
  title: 결격사유 — 미성년자 대상 성범죄 형 확정 20년
  chapter: 2
  scope: 공통
  summary: 미성년자를 대상으로 한 성범죄로 형이 확정되면 20년간 임용 결격.
  body: |
    실무도우미 요약은 "미성년자 성범죄 형 확정 20년"으로만 제시하여, 벌금형 포함 여부·
    치료감호 포함 여부 등 세부 요건은 원문(국가공무원법 §33) 대조가 필요하다 — 확인필요.
  refs: ["국가공무원법 §33"]
