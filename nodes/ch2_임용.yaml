- id: retire-honorary
  type: 개념
  title: 명예퇴직
  chapter: 2
  scope: 공통
  summary: 재직 20년 이상이며 정년퇴직일까지 1년 이상 남은 교육공무원이 신청할 수 있는 자진퇴직 제도.
  body: |
    명예퇴직수당 산정: 정년까지 잔여기간이 5년 이내인 경우 = 월봉급액의 반액(50%) × 잔여월수.
    잔여기간 5~10년, 10년 초과 구간은 별도 산식이 적용되나, 실무도우미 요약에 세부 산식이
    제시되지 않아 원문(공무원수당 등에 관한 규정·명예퇴직수당 지급 관련 규정) 대조 필요 — 확인필요.
  pages: {중등: "21-41", 초등: "21-44"}
  aliases: ["명퇴", "명예퇴직수당", "명퇴수당"]
  verified: "2026-08-02"

- id: num-honorary-retire-req
  type: 수치·기한
  title: 명예퇴직 요건 — 재직 20년 이상 + 정년 1년 전
  chapter: 2
  scope: 공통
  summary: 재직기간 20년 이상이고 정년퇴직일까지 1년 이상 남아야 명예퇴직을 신청할 수 있다.
  refs: ["국가공무원 명예퇴직수당 등 지급 규정 §3①(교육공무원법 §36③ 위임)"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: resign-voluntary
  type: 개념
  title: 의원면직
  chapter: 2
  scope: 공통
  summary: 본인의 청원으로 면직되는 것으로, 청원일은 공문 발송 후 14일 이후로 지정하며 청원일 0시부로 신분을 상실한다.
  pages: {중등: "21-41", 초등: "21-44"}
  aliases: ["사직"]
  verified: "2026-08-02"

- id: num-resign-voluntary-14d
  type: 수치·기한
  title: 의원면직 청원일 — 공문발송 후 최소 14일 이후
  chapter: 2
  scope: 공통
  summary: 비위조회 기간 확보를 위해 면직청원일은 공문 발송 후 최소 14일 이후로 지정한다.
  body: |
    "청원일 0시부로 신분 상실"의 근거인 교육공무원임용령 §5①("임용장·임용통지서에 적힌
    일자에 임용된 것으로 보며 소급 불가")은 korean-law-mcp로 확인했으나(2026-08-02),
    "공문발송 후 최소 14일 이후"라는 구체 일수 자체는 동 조문에 명시되어 있지 않아
    확인필요.
  refs: ["확인필요"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: death-separation
  type: 개념
  title: 사망면직
  chapter: 2
  scope: 공통
  summary: 재직 중 사망한 교육공무원은 사망 다음날 자로 면직 처리되며, 7일 이내 보고해야 한다.
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: num-death-separation
  type: 수치·기한
  title: 사망면직 — 사망 다음날 면직, 7일 이내 보고
  chapter: 2
  scope: 공통
  summary: 사망일 다음날을 면직일로 하며, 소속 기관은 7일 이내에 보고해야 한다.
  body: |
    "사망 다음날 면직"은 교육공무원임용령 §5②("사망으로 인한 면직은 사망한 다음 날에
    면직된 것으로 본다")로 korean-law-mcp 직접 확인됨(2026-08-02). "7일 이내 보고"의
    구체 근거 조문은 동 영에서 확인되지 않아 별도 대조 필요 — 확인필요.
  refs: ["교육공무원임용령 §5②"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: dismissal-discretionary
  type: 개념
  title: 직권면직 사유
  chapter: 2
  scope: 공통
  summary: 임용권자가 직권으로 면직시키는 제도(실무도우미 제2장 표에 미수록 — 원문 확인 필요).
  body: |
    실무도우미(중등·초등 모두) 제2장 표에는 직권면직이 별도 항목으로 수록되어 있지 않다.
    일반적으로 직제·정원 개편에 따른 폐직·과원, 휴직 기간 만료 후 미복귀, 직무수행 능력·자격
    부족 등의 사유로 임용권자가 직권으로 면직시키는 제도로 알려져 있다(국가공무원법 §70 등).
    다만 본 온톨로지는 실무도우미 원문 근거를 원칙으로 하므로, 구체적 개별 호와 정확한
    조번호는 원문 법령 확인이 필요하다 — 확인필요.
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-02"
