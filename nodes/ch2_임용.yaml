- id: disqual-education-official-10-4
  type: 개념
  title: 교육공무원 고유 결격사유(교육공무원법 §10의4)
  chapter: 2
  scope: 공통
  summary: 미성년자 대상 성범죄(기간 제한 없음), 성인 대상 성폭력범죄(100만원 이상 벌금 확정), 마약류 중독자는 국가공무원법 §33과 별도로 교육공무원 임용이 결격된다.
  body: |
    국가공무원법 §33의 일반 결격사유와 별도로, 교육공무원법 §10의4는 교육공무원에게만
    적용되는 고유 결격사유를 정한다(2026-08-02 korean-law-mcp 원문 조회):

    | 호 | 사유 | 결격 기간 |
    | --- | --- | --- |
    | 2호 | 미성년자 대상 성범죄로 파면·해임되거나 형·치료감호 확정(집행유예 기간 경과자 포함) | 기간 제한 없음 |
    | 3호 | 성인 대상 성폭력범죄로 파면·해임되거나 100만원 이상 벌금형 이상·치료감호 확정 | 기간 제한 없음 |
    | 4호 | 마약·대마·향정신성의약품 중독자 | 중독 상태 지속 시 |

    §33 6의4(20년 결격)와 달리 §10의4 2호·3호는 기간 제한이 없어, 교육공무원 채용
    적격성 판단에서는 §33보다 우선 확인해야 한다. 각 호 세부 정의(성인 대상 성폭력범죄의
    범위 등)는 원문 재대조 필요 — 확인필요.
  refs: ["교육공무원법 §10의4"]
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-03"

- id: hire-restrict-misconduct
  type: 개념
  title: 채용제한(교육공무원법 §10의3)
  chapter: 2
  scope: 공통
  summary: 금품수수·성적조작·학생 신체폭력으로 파면·해임되거나 금고 이상 형(집행유예 기간 경과 포함)을 선고받은 경우 재임용이 제한되며, 징계위원회 의결로 예외가 인정될 수 있다.
  body: |
    교육공무원법 §10의3① 원문(2026-08-03 조회): "…다음 각 호의 어느 하나의 행위로 인하여
    파면·해임되거나 금고 이상의 형을 선고받은 사람(집행유예의 형을 선고받은 후 그
    집행유예기간이 지난 사람을 포함한다)은 …교원으로 채용될 수 없다. 다만, 제50조제1항에
    따른 교육공무원징계위원회에서 해당 교원의 반성 정도 등을 고려하여 교원으로서 직무를
    수행할 수 있다고 의결한 경우에는 그러하지 아니하다." 사유는 금품수수·학생 성적 관련
    비위·학생 대상 신체적 폭력 등이다(호별 세부는 원문 재대조 권장).
  refs: ["교육공무원법 §10의3①"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-03"

- id: recruit-open-competition
  type: 개념
  title: 신규채용 — 공개전형
  chapter: 2
  scope: 공통
  summary: 1차 필기시험과 2차 면접·수업실연으로 진행되는 교육공무원 신규채용 방식.
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: num-candidate-list-3x-1y
  type: 수치·기한
  title: 임용후보자명부 — 고순위자순 3배수 범위 임용·유효기간 1년(2년 연장 가능)
  chapter: 2
  scope: 공통
  summary: 임용후보자명부는 고순위자순으로 채용예정인원의 3배수 범위에서 임용·제청하며, 명부 유효기간은 작성일부터 1년(2년 범위 연장 가능)이다.
  body: |
    "3배수"는 명부의 작성 규모가 아니라 **임용(제청) 범위**다. 교육공무원임용령 §10②
    원문(2026-08-03 재조회): "임용후보자명부의 고순위자순으로 그 채용예정인원의 3배수의
    범위안에서 임용 또는 임용제청". 명부 자체는 §10①에 따라 공개전형 합격자 전원을
    작성·비치한다.

    유효기간은 §12①"임용후보자명부의 유효기간은 그 명부를 작성한 날로부터 1년", §12②
    "교사임용후보자명부의 유효기간을 2년의 범위에서 연장할 수 있다"로 원문 확인됨.
  refs: ["교육공무원임용령 §10①·②", "교육공무원임용령 §12①·②"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-03"

- id: recruit-career-competitive
  type: 개념
  title: 경력경쟁채용(교육공무원법 §12)
  chapter: 2
  scope: 공통
  summary: 공개전형에 의하지 않고 특정 자격·경력요건을 충족하는 자를 대상으로 하는 채용방식(5개 사유).
  body: |
    실무도우미 요약이 예시한 사유: 휴직만료 퇴직자 2년 내 재임용, 특수지역·교과 등.
    5개 사유 전체 목록은 원문(교육공무원법 §12 및 시행령) 대조 필요 — 확인필요.
  refs: ["교육공무원법 §12"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: transfer-jeonbo-restriction-1y
  type: 개념
  title: 전직·전보 등 인사조치 제한 — 임용 후 1년 내 금지(교육공무원법 §21①)
  chapter: 2
  scope: 공통
  summary: 그 직위에 임용된 날부터 1년 이내에는 원칙적으로 다른 직위 임용(전직 포함)·근무지 변경 등 인사조치가 제한되며, 법령상 예외 사유가 있다.
  body: |
    교육공무원법 §21(전직 등의 제한)①은 "다른 직위에 임용하거나 근무지를 변경하는
    인사조치"전체를 1년간 제한하는 조문으로, 전보에 한정되지 않고 전직·근무지 변경을
    포괄한다(2026-08-03 korean-law-mcp 원문 조회). 실무도우미가 이를 "전직" 항목에 함께
    제시한 것은 조문 범위와 부합한다. 다만 전보(직위·자격 유지, 근무 기관만 이동)와
    전직(직렬·자격 변경)의 개념 자체는 여전히 구분된다(1장 term-jeonjik/term-jeonbo 참조).

    예외 사유는 §21① 1~3호 및 교육공무원임용령 §13의2① 각호(전보권자가 다른 기관 간
    전보, 징계처분에 따른 인사조치, 모성보호·육아 등 사정에 의한 전보 등)에 규정되어
    있다(각호 세부는 원문 재대조 권장 — 확인필요).
  refs: ["교육공무원법 §21①", "교육공무원임용령 §13의2①"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-03"

- id: transfer-jeonjik-restriction
  type: 개념
  title: 전직 — 교육전문직 ↔ 교원 재전직
  chapter: 2
  scope: 공통
  summary: 교육전문직에서 교원으로, 또는 교원에서 교육전문직으로 직렬·자격을 달리해 옮기는 임용 행위.
  body: |
    교육전문직 ↔ 교원 간 재전직 시 근속 요건과 횟수 제한은 num-jeonjik-reappoint 참조.
    임용 후 1년 내 전보 제한은 별개 개념(transfer-jeonbo-restriction-1y, 전보) 참조.
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: num-jeonjik-reappoint
  type: 수치·기한
  title: 교육전문직 재전직 요건 — 교사출신 5년·교감출신 2년, 재전직 1회 한
  chapter: 2
  scope: 공통
  summary: 교육전문직에서 교원으로 재전직 시 교사출신 5년·교감출신 2년의 근속 요건이 있으며, 각 단계 재전직은 1회로 제한된다.
  body: |
    2011.11.23. 이후 신규임용자에게 적용되는 기준(실무도우미 명시).
  refs: ["확인필요"]
