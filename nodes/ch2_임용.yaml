# 제2장 교육공무원 임용 일반 — 임용일 원칙·결격사유·채용제한·신규채용·경력경쟁채용·
#                         전직·파견·정년퇴직·명예퇴직·의원면직·사망(·직권면직)
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제2장 임용 일반" 표(중등 21~41쪽/초등 21~44쪽)

- id: appoint-date-principle
  type: 개념
  title: 임용일 원칙
  chapter: 2
  scope: 공통
  summary: 정기임용은 3.1./9.1., 정년·명예퇴직은 2월말/8.31., 수시임용은 임명장 교부일을 임용일로 한다.
  body: |
    | 구분 | 임용일 |
    | --- | --- |
    | 정기임용 | 3.1. 또는 9.1. |
    | 정년·명예퇴직 | 2월말 또는 8.31.(도래 시기별, retire-age 참조) |
    | 수시임용 | 임명장 교부일(공문 발송 후 최소 14일 이후로 지정) |
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: num-appoint-date-regular
  type: 수치·기한
  title: 정기임용일 — 3.1./9.1.
  chapter: 2
  scope: 공통
  summary: 정기 임용일은 매년 3월 1일 또는 9월 1일이다.
  pages: {중등: "21-41", 초등: "21-44"}
  refs: ["확인필요"]
  verified: "2026-08-02"

- id: num-appoint-date-occasional-14d
  type: 수치·기한
  title: 수시임용일 — 임명장 교부일(공문발송 후 14일 이후)
  chapter: 2
  scope: 공통
  summary: 수시임용은 임명장 교부일을 임용일로 하며, 교부일은 공문 발송 후 최소 14일 이후로 지정한다.
  body: |
    "임용장·임용통지서에 적힌 일자에 임용된 것으로 본다"는 원칙 자체는 교육공무원임용령
    §5①로 korean-law-mcp 직접 확인됨(2026-08-02). 다만 "공문발송 후 최소 14일 이후로
    지정"이라는 구체 일수는 동 조문에 명시되어 있지 않아(비위조회 등을 위한 실무 관행으로
    추정) 원문·별도 지침 대조가 필요하다 — 확인필요.
  pages: {중등: "21-41", 초등: "21-44"}
  refs: ["확인필요"]
  verified: "2026-08-02"

- id: disqual-general
  type: 개념
  title: 결격사유(국가공무원법 §33)
  chapter: 2
  scope: 공통
  summary: 국가공무원법 §33이 정하는 결격사유에 해당하면 교육공무원으로 임용될 수 없다.
  body: |
    | 사유 | 결격 기간 |
    | --- | --- |
    | 금고 이상 실형 | 집행 종료(면제)일부터 5년 |
    | 집행유예 | 유예기간 종료일부터 2년 |
    | 파면 | 파면일부터 5년 |
    | 해임 | 해임일부터 3년 |
    | 미성년자 대상 성범죄 | 형 확정일부터 20년 |

    실무도우미 요약은 대표 사유만 발췌한 것으로("등"으로 표기), §33 전체 호는 원문 대조 필요.
  refs: ["국가공무원법 §33"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

