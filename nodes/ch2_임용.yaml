- id: num-retire-age-62
  type: 수치·기한
  title: 정년 — 62세, 퇴직일은 도래시기별 8.31./익년 2월말
  chapter: 2
  scope: 공통
  summary: 정년 62세 도래 시기가 3~8월이면 8월 31일, 9월~익년 2월이면 익년 2월 말일이 퇴직일이다.
  refs: ["교육공무원법 §47"]
  pages: {중등: "21-41", 초등: "21-44"}
  verified: "2026-08-02"

- id: retire-honorary
  type: 개념
  title: 명예퇴직
  chapter: 2
  scope: 공통
  summary: 재직 20년 이상이며 정년퇴직일까지 1년 이상 남은 교육공무원이 신청할 수 있는 자진퇴직 제도.
  body: |
    명예퇴직수당 산정: 정년까지 잔여기간이 5년 이내인 경우 = 월봉급액의 반액(50%) × 잔여월수.
    잔여기간 5~10년, 10년 초과 구간은 별도 산식이 적용되나, 실무도우미 요약에 세부 산식이
    제시되지 않아 원문(공무원수당 등에 관한 규정·명예퇴직수당 지급 관련 규정) 대조 필요 — 확인필요.
  pages: {중등: "21-41", 초등: "21-44"}
  aliases: ["명퇴", "명예퇴직수당", "명퇴수당"]
  verified: "2026-08-02"

- id: num-honorary-retire-req
  type: 수치·기한
  title: 명예퇴직 요건 — 재직 20년 이상 + 정년 1년 전
