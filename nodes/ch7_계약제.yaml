- id: num-contract-lecturer-pay-hourly
  type: 수치·기한
  title: 강사수당(일반·시간당) — 가호 30,000 / 나호 28,000 / 다호 24,000 / 라호 22,000원
  chapter: 7
  scope: 공통
  summary: 일반 강사의 시간당 수당은 등급(가~라호)에 따라 22,000원에서 30,000원까지 차등 지급한다.
