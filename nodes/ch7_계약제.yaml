# 제7장 계약제 교원 — 종류/임용상한연령(2026 한시완화)/채용절차/임용기간·연장/호봉/퇴직금/4대보험/
#                    복무·휴가/육아휴직('25.10.1개정)/해고·계약해지/강사수당/가족채용제한/NEIS
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제7장 계약제 교원"(파일 157~176행)
#       + § "4. 2026년판 신규·최신 개정 반영 사항"(190·198·201행) + § "5. 실무 유의 포인트"(210~211행)
# 페이지: 7장 계약제 교원 — 중등 315~433쪽(붙임·서식 다수), 초등 328~448쪽(서식·붙임·Q&A)
# 법령 검증: korean-law-mcp로 사립학교법(MST 279625)§54, 교육공무원임용령(MST 273697)§13,
#           교육공무원법(MST 273345)§32, 공직자의 이해충돌 방지법(MST 232253)§11·§28,
#           남녀고용평등과 일·가정 양립 지원에 관한 법률(MST 276851)§19·§37,
#           기간제 및 단시간근로자 보호 등에 관한 법률(MST 232201)§4 및 시행령(MST 230833)§3
#           원문 조회, 2026-08-02

- id: contract-teacher-overview
  type: 개념
  title: 계약제 교원 개관
  chapter: 7
  scope: 공통
  summary: 정규 교육공무원이 아닌 한시적 임용 교원으로 기간제·시간제근무기간제·산학겸임·명예교사·강사 5종이 있다.
  body: |
    임용권자는 교(원)장(교육감 행정권한 위임규칙 §6②)이며, 5종 각각의 성격은 개별 노드
    (`contract-teacher-giganje` 등) 참조. 담임 배정은 정규교원 우선이 원칙이고, 불가피하게
    계약제 교원을 배정할 때는 경력 2년 이상자를 배정하도록 노력한다(교원정책과-7078,
    `contract-homeroom-assignment` 참조).
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-teacher-giganje
  type: 개념
  title: 기간제교원
  chapter: 7
  scope: 공통
  summary: 휴직 결원·특정교과 한시담당 등 5개 사유로 예산 범위에서 기간을 정해 임용하는 교원자격증 소지자.
  body: |
    교육공무원법 §32①에 근거하며, 사유는 ①휴직 결원보충 ②파견·연수·정직·직위해제 등으로
    인한 직무이탈 결원보충 ③특정 교과 한시담당 ④퇴직 교육공무원의 지식·경험 활용
    ⑤유치원 방과후과정 담당이다. 정규 교원 임용에서 우선권이 인정되지 않으며, ④ 사유
    임용자를 제외하고는 책임이 무거운 감독 업무 직위에 임용될 수 없다(§32②). 국가공무원법
    §16(소청)·§70(직권면직)·§73~73의4(휴직)·§75~76(처분 통지·불복)·§78~78의2·§79~80(징계)·
    §82~83(징계절차)·§83의2(시효) 등 다수 조문이 적용 배제되며, 임용기간 만료 시 당연퇴직한다
    (§32③). korean-law-mcp로 원문 확인(2026-08-02, MST 273345 §32).
  refs: ["교육공무원법 §32"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-teacher-parttime-giganje
  type: 개념
  title: 시간제 근무 기간제교원
  chapter: 7
  scope: 공통
  summary: 주 6시간 이상 35시간 이하 범위에서 시간제로 근무하는 기간제교원으로 학운위 심의와 본청 사전승인이 필요하다.
  body: |
    교육공무원임용령 §13②에 근거(교육공무원법 §32①3~5호 사유로 임용하는 경우에 한해 적용).
    학교운영위원회 심의를 거치고 교육청(본청) 사전승인을 받아야 한다. korean-law-mcp로 원문
    확인(2026-08-02, MST 273697 §13②).
  refs: ["교육공무원임용령 §13"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-teacher-sanhak-gyeomim
  type: 개념
  title: 산학겸임교사
  chapter: 7
  scope: 공통
  summary: 산업체 등의 전문 인력이 학교 교육을 겸임하는 계약제 교원 유형.
  body: |
    경력환산율은 강사 등 경력과 함께 교육부장관이 정하는 바에 따라 30~100% 범위로 환산된다
    (`num-career-conversion-lecturer` 참조, 6장 발췌).
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-teacher-myeongye
  type: 개념
  title: 명예교사
  chapter: 7
  scope: 공통
  summary: 보수를 받지 않고 위촉되어 특정 분야 교육을 지원하는 무보수 계약제 교원 유형.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-teacher-gangsa
  type: 개념
  title: 강사
  chapter: 7
  scope: 공통
  summary: 1개월 미만의 단기 결원을 보충하기 위해 위촉하는 계약제 교원으로, 계약제 교원 중 유일하게 기간제법이 적용된다.
  body: |
    다른 계약제 교원(기간제교원 등)은 교육공무원임용령 §13③이 임용기간을 별도로 정하는
    "다른 법령"에 해당해 기간제법 §4①6호·시행령 §3③1호에 따라 사용기간 제한(2년) 적용이
    제외되지만, 1개월 미만 강사는 이 특별규정의 적용 대상이 아니어서 기간제법이 그대로
    적용된다(`contract-giganje-law-exception` 참조). 강사수당은
    `num-contract-lecturer-pay-fulltime`·`num-contract-lecturer-pay-hourly` 참조.
  refs: ["기간제 및 단시간근로자 보호 등에 관한 법률 §4"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-age-limit-standard
  type: 수치·기한
  title: 계약제 교원 임용상한연령 — 원칙 62세, 2차공고 65세, 시간강사 67세
  chapter: 7
  scope: 공통
  summary: 계약제 교원 임용상한연령은 원칙 62세이나 2차 공고부터는 인사자문위 자문을 거쳐 65세까지, 1개월 미만 시간강사는 67세까지 완화된다.
  body: |
    | 구분 | 상한연령 |
    | --- | --- |
    | 원칙(1차 공고) | 62세 |
    | 2차 공고부터 | 65세(인사자문위원회 자문 필요) |
    | 1개월 미만 시간강사 | 67세 |

    2026학년도는 한시적으로 완화된 별도 기준이 적용된다 —
    `num-contract-age-limit-2026-temp` 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-age-limit-2026-temp
  type: 수치·기한
  title: "[2026 한시 변경] 계약제 교원 임용상한연령 완화 — 1차공고 65세·2차공고 67세·시간강사 67세"
  chapter: 7
  scope: 공통
  summary: "[2026학년도 한시 완화·학교 자율] 1차 공고부터 65세, 2차 공고부터 67세, 시간강사는 공고 없이 67세까지 상향된다."
  body: |
    **[2026 한시 변경]** 원칙 기준(`num-contract-age-limit-standard`: 1차 62세·2차 65세·
    시간강사 67세)과 달리, 2026학년도에 한해 다음과 같이 완화된다.

    | 구분 | 2026학년도 한시 상한연령 |
    | --- | --- |
    | 1차 공고부터 | 65세 |
    | 2차 공고부터 | 67세 |
    | 1개월 미만 시간강사 | 67세(공고 구분 없이 적용) |

    적용 여부는 **학교 자율**이며, 실무도우미 자료는 이 항목을 "양 판(중등판·초등판)
    공통 유일의 2026 신설 항목"으로 별도 표기한다. 공고문에 적용 기준을 명시해야 한다.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: proc-contract-recruitment
  type: 절차
  title: 계약제 교원 채용 절차
  chapter: 7
  scope: 공통
  summary: 채용계획 사전공개 → 공고(시교육청·나라일터 의무, 최소 3일 이상) → 서류전형(인력풀 활용 시 생략 가능) → 면접·수업실연 순으로 진행한다.
  body: |
    1. 채용계획 사전공개
    2. 공고 — 시교육청·나라일터 의무 게시, 공고기간 최소 3일 이상(`num-contract-notice-min-3d` 참조)
    3. 서류전형 — 기간제교사 인력풀(학교지원단) 활용 시 생략 가능(`contract-teacher-pool` 참조)
    4. 면접·수업실연

    2026학년도 임용상한연령 완화를 적용하려면 공고문에 그 기준을 명시해야 한다
    (`num-contract-age-limit-2026-temp` 참조).
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-notice-min-3d
  type: 수치·기한
  title: 계약제 교원 채용공고 — 최소 3일 이상
  chapter: 7
  scope: 공통
  summary: 시교육청·나라일터에 의무 게시하는 채용공고 기간은 최소 3일 이상이어야 한다.
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-teacher-pool
  type: 개념
  title: 기간제교사 인력풀(학교지원단)
  chapter: 7
  scope: 공통
  summary: 학교의 채용 서류전형을 생략할 수 있도록 지원하는 인력풀로, 열람권한은 6개월간 유효하다.
  body: |
    학교는 임용 7일 전까지 채용서류 지원을 요청해야 한다. 열람권한 유효기간은 6개월이다.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-term-limit
  type: 수치·기한
  title: 계약제 교원 임용기간 — 1년 이내 + 3년 범위 연장(총 4년 도달 시 필수퇴직)
  chapter: 7
  scope: 공통
  summary: 임용기간은 1년 이내이며 필요 시 3년 범위에서 연장할 수 있으나, 한 학교에서 총 4년에 도달하면 반드시 퇴직해야 한다.
  body: |
    법적 근거는 교육공무원임용령 §13③ "법 제32조제1항에 따라 임용되는 기간제교원의
    임용기간은 1년 이내로 하며, 필요한 경우 3년의 범위에서 연장할 수 있다"이다
    (korean-law-mcp 원문 확인, 2026-08-02, MST 273697 §13③). 총 4년에 도달하면 해당
    학교에서는 반드시 퇴직해야 하지만, 신규채용 절차를 거친 재임용은 가능하다
    (법제처 유권해석 11-0796, `qa-contract-reappointment-after-4y` 참조). 연장계약의
    구체 요건은 `contract-extension-conditions` 참조.
  refs: ["교육공무원임용령 §13"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-extension-conditions
  type: 개념
  title: 계약제 교원 연장계약 4요건
  chapter: 7
  scope: 공통
  summary: 동일기관·동일과목 결원(초등은 과목 무관)·근무 단절 없음·자격확대 임용자 아님의 4요건을 모두 충족해야 연장계약이 가능하다.
  body: |
    | 요건 | 내용 |
    | --- | --- |
    | ① 동일기관 | 같은 학교에서 계속 근무 |
    | ② 동일과목 결원 | 중등은 자격표시과목·결원과목 일치 필요, **초등은 표시과목이 없어 과목 무관**(결원 여부만 판단) |
    | ③ 단절 없음 | 근무기간 중 공백 없이 계속 |
    | ④ 자격확대 임용자 아님 | 애초 자격 범위를 넘겨 임용된 자가 아닐 것 |

    1개월 이상 연장할 때는 호봉재획정이 필수다(6장 `proc-hobong-rejudge` 참조).
    중등판·초등판 차이는 실무도우미 §6(중등판 vs 초등판 차이) 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: qa-contract-reappointment-after-4y
  type: Q&A·유권해석
  title: 4년 도달 후 재임용 가능 여부
  chapter: 7
  scope: 공통
  summary: 한 학교에서 총 4년에 도달해 퇴직한 계약제 교원도 신규채용 절차를 다시 거치면 재임용이 가능하다(법제처 11-0796).
  refs: ["법제처 유권해석 11-0796"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-fixed-salary
  type: 개념
  title: 계약제 교원 보수 — 고정급(정기승급 미적용)
  chapter: 7
  scope: 공통
  summary: 계약제 교원의 호봉은 임용 시 고정되며, 정규 교육공무원과 달리 매년 정기승급이 적용되지 않는다.
  body: |
    예외적으로 일정 조건을 충족하면 14호봉까지 인정되는 특례가 있다 —
    `num-contract-hobong-14-limit` 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-hobong-14-limit
  type: 수치·기한
  title: 계약제 교원 14호봉 제한 — 10년 이상 근무 후 연금수급·명퇴·정년퇴직자, 근무연수 5년만 인정
  chapter: 7
  scope: 공통
  summary: 10년 이상 계약제로 근무하다 퇴직연금 수급·명예퇴직·정년퇴직하는 경우에 한해 14호봉까지 인정하되, 근무연수는 5년만 산입한다.
  body: |
    정근수당도 동일한 근무연수(5년 인정) 기준을 적용한다. 일반 계약제 교원의 보수 원칙은
    `contract-fixed-salary`(고정급, 정기승급 미적용) 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-severance-pay
  type: 개념
  title: 계약제 교원 퇴직금
  chapter: 7
  scope: 공통
  summary: 계속근로 1년 이상이면 지급 대상이며, 근무 단절이 있어도 3년 내 재임용 시 소급합산할 수 있다.
  body: |
    364일과 같이 1년에 며칠 못 미치는 계약도 계속근로 실질이 인정되면 퇴직금 지급의무가
    있다(대법원 2014다221074로 실무도우미에 인용됨 — `qa-contract-severance-364days` 참조).
    초등판 2026년판 신설 사항으로 평균임금·통상임금 중 유리한 금액을 적용한다는 명시가
    추가되었다. 지급기한·소멸시효는 `num-contract-severance-irp-14d` 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-severance-irp-14d
  type: 수치·기한
  title: 퇴직금 지급기한 — 퇴직 후 14일 내 IRP 지급, 소멸시효 3년
  chapter: 7
  scope: 공통
  summary: 퇴직 후 14일 이내에 개인형퇴직연금(IRP) 계좌로 지급해야 하며, 퇴직금 청구권의 소멸시효는 3년이다.
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: qa-contract-severance-364days
  type: Q&A·유권해석
  title: 364일 계약도 퇴직금 지급의무 있는지 여부
  chapter: 7
  scope: 공통
  summary: 계약기간이 1년에서 하루 모자란 364일이어도 계속근로 실질이 인정되면 퇴직금 지급의무가 있다(대법원 2014다221074, 실무도우미 인용).
  body: |
    실무도우미 요약본이 인용한 판례번호(대법원 2014다221074)는 이번 조회의 korean-law-mcp
    판례검색(사건번호 직접 조회)에서 확인되지 않았다 — 판례번호 자체는 확인필요(원문 재대조
    권장). 다만 "1년 미만으로 계약기간을 정해 퇴직금 지급을 회피하는 것은 허용되지 않는다"는
    법리 자체는 근로자퇴직급여보장법 및 다수 대법원 판례(계속근로 실질 판단 법리)와
    일반적으로 부합하는 내용이다.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-4insurance
  type: 개념
  title: 계약제 교원 4대보험
  chapter: 7
  scope: 공통
  summary: 기간제교원은 4대보험 전부 당연가입 대상이며, 시간강사는 근무조건 충족 시 조건부로 가입한다.
  body: |
    기간제교원은 국민연금·건강보험·고용보험·산재보험 전부 당연가입이다. 시간강사는 조건별로
    구분된다 — 세부 기준은 `num-contract-lecturer-insurance-threshold` 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-lecturer-insurance-threshold
  type: 수치·기한
  title: 시간강사 4대보험 가입기준 — 월 60시간 이상 또는 월 8일 이상
  chapter: 7
  scope: 공통
  summary: 시간강사는 월 60시간 이상 또는 월 8일 이상 근무 시 국민연금·건강보험이 당연가입되며, 고용보험·산재보험은 당연가입이다.
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-annual-leave-table
  type: 수치·기한
  title: 계약제 교원 연가일수표 — 1개월~1년 11일 / 1~3년 15일 / 3~4년 16일 / 4년~ 17일
  chapter: 7
  scope: 공통
  summary: 재직기간별로 연가일수는 1개월~1년 11일, 1~3년 15일, 3~4년 16일, 4년 이상 17일로 정규교원과 별도 기준을 적용한다.
  body: |
    | 재직기간 | 연가일수 |
    | --- | --- |
    | 1개월~1년 미만 | 최대 11일 |
    | 1~3년 | 15일 |
    | 3~4년 | 16일 |
    | 4년 이상 | 17일 |

    정규 교육공무원의 연가일수표(4장 발췌 — 1개월~1년 11일/1~3년 15일/3~4년 16일/4~5년
    17일/5~6년 20일/6년 이상 21일)와 1~4년 구간은 동일하나, 계약제 기준표는 4년 이상
    구간이 "17일"로 고정되어 정규교원처럼 5~6년·6년 이상 구간으로 세분되지 않는다.
    실무도우미 요약에는 4년 이상 구간이 세분되지 않는 이유가 명시되어 있지 않다
    (확인필요 — `num-contract-term-limit`의 임용기간 상한과의 관계는 원문 대조 필요).
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-sick-leave-days
  type: 수치·기한
  title: 계약제 교원 병가일수 — 60일×계약월/12, 공무상 180일
  chapter: 7
  scope: 공통
  summary: 일반 병가는 60일에 계약월수를 곱해 12로 나눈 일수만큼, 공무상 병가는 180일까지 인정한다.
  body: |
    산식(초등판 2026년판 명시 신설) — 60일 × 계약월수 ÷ 12 = 인정 병가일수.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-childcare-leave
  type: 개념
  title: 계약제 교원 육아휴직
  chapter: 7
  scope: 공통
  summary: 6개월 이상 근무한 계약제 교원은 자녀당 최대 1년(3회 분할 가능)의 육아휴직을 신청할 수 있다.
  body: |
    남녀고용평등과 일·가정 양립 지원에 관한 법률 §19①에 근거하며, 만 8세 이하 또는 초등학교
    2학년 이하 자녀(입양 포함) 양육 목적이다. 사업주(임용권자)는 육아휴직을 이유로 해고·
    불리한 처우를 할 수 없고, 휴직 기간 중 해고할 수 없다(§19③, 사업 계속 불가 시는 예외).
    복귀 시 휴직 전과 같은 업무·같은 수준 임금의 직무로 복귀시켜야 하며, 이 기간은 근속기간에
    포함된다(§19④). 기간제근로자의 육아휴직 기간은 기간제법 §4의 사용기간(2년)에서
    제외된다(§19⑤ — 2025.2.23. 기간제법 개정과 맞물려 "계약기간 미산입·무기전환 제외"로
    실무도우미에 반영됨). 2025.10.1. 개정으로 추가된 6개월 특례는
    `num-contract-childcare-2025-amendment`, 불허 시 벌칙은
    `num-contract-childcare-refusal-penalty` 참조. korean-law-mcp로 원문 확인(2026-08-02,
    MST 276851 §19, 시행 2025.10.1.).
  refs: ["남녀고용평등과 일·가정 양립 지원에 관한 법률 §19"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-childcare-2025-amendment
  type: 수치·기한
  title: "['25.10.1 개정] 계약제 육아휴직 6개월 추가 — 맞돌봄·한부모·장애아동"
  chapter: 7
  scope: 공통
  summary: "2025.10.1. 개정으로 맞돌봄(부모 각 3개월 이상 사용)·한부모·장애아동 부모는 기존 1년에 6개월을 추가로 사용할 수 있다."
  body: |
    남녀고용평등법 §19②단서 각호(2025.10.1. 시행) — ①같은 자녀를 대상으로 부모가 모두
    육아휴직을 각각 3개월 이상 사용한 경우의 부 또는 모, ②한부모가족지원법 §4①1호의 부 또는
    모, ③고용노동부령으로 정하는 장애아동의 부 또는 모. korean-law-mcp로 원문 확인
    (2026-08-02, MST 276851 §19②, 시행 2025.10.1.).
  refs: ["남녀고용평등과 일·가정 양립 지원에 관한 법률 §19"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-childcare-refusal-penalty
  type: 수치·기한
  title: 육아휴직 불허 시 벌칙 — 500만원 이하 벌금
  chapter: 7
  scope: 공통
  summary: 육아휴직 신청을 정당한 사유 없이 불허하거나 복귀 후 원직 미복귀시키면 500만원 이하 벌금에 처한다.
  body: |
    남녀고용평등법 §37④4(§19①·④ 위반)에 근거. korean-law-mcp로 원문 확인(2026-08-02,
    MST 276851 §37④).
  refs: ["남녀고용평등과 일·가정 양립 지원에 관한 법률 §37"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-dismissal-notice
  type: 수치·기한
  title: 계약제 교원 해고예고 — 30일 전 서면(미이행 시 30일분 통상임금)
  chapter: 7
  scope: 공통
  summary: 계약을 중도 해지할 때는 30일 전 서면으로 예고해야 하며, 이를 이행하지 않으면 30일분 통상임금을 지급해야 한다(3개월 미만 근무자는 적용 제외).
  body: |
    즉시해지 사유에 해당하면 예고 없이 해지할 수 있다 —
    `contract-immediate-termination` 참조. 근평(성과평가)은 임용기간 종료 15일~1개월
    전에 실시한다(`num-contract-eval-timing` 참조). 초등판 2026년판 신설 사항으로 해고예고
    사유를 구체적으로 기재하도록 의무화되었다.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-immediate-termination
  type: 개념
  title: 계약제 교원 즉시해지 사유
  chapter: 7
  scope: 공통
  summary: 채용비리·결격사유·1주 이상 무단결근·조기복직·4대 비위 등에 해당하면 예고 없이 즉시 계약을 해지할 수 있다.
  body: |
    조기복직으로 계약이 해지된 계약제 교원에게는 임용우대증명서를 발급하고 우선임용에
    노력하도록 국민권익위원회가 권고했다(2020.4.). `qa-contract-early-reinstatement-cert` 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: qa-contract-early-reinstatement-cert
  type: Q&A·유권해석
  title: 조기복직으로 해지된 계약제 교원에 대한 우대 조치
  chapter: 7
  scope: 공통
  summary: 정규교원의 조기복직으로 계약이 해지된 계약제 교원에게는 임용우대증명서를 발급하고 우선임용에 노력해야 한다(국민권익위원회 2020.4. 권고).
  refs: ["국민권익위원회 2020.4. 권고"]
