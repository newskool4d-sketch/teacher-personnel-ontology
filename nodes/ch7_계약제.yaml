- id: num-contract-eval-timing
  type: 수치·기한
  title: 계약제 교원 근평 실시시기 — 임용기간 종료 15일~1개월 전, 연 1회
  chapter: 7
  scope: 공통
  summary: 근무성적평정은 임용기간 종료 15일 전부터 1개월 전 사이에 연 1회 실시하며, 4대 비위로 중도퇴직하면 사유를 반드시 기재해야 한다.
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-giganje-law-exception
  type: 개념
  title: 계약제 교원의 기간제법 적용 예외
  chapter: 7
  scope: 공통
  summary: 기간제교원 등은 교육공무원임용령 §13③이 별도 임용기간을 정한 특별규정이어서 기간제법의 2년 사용기간 제한·무기계약 전환 규정이 적용되지 않는다.
  body: |
    법적 메커니즘 — 기간제 및 단시간근로자 보호 등에 관한 법률 §4①6호는 "제1호부터 제5호까지에
    준하는 합리적인 사유"를 대통령령에 위임하고, 같은 법 시행령 §3③1호는 "다른 법령에서
    기간제근로자의 사용 기간을 법 §4①과 달리 정하거나 별도의 기간을 정하여 근로계약을
    체결할 수 있도록 한 경우"를 그 사유로 규정한다. 교육공무원임용령 §13③(임용기간 1년
    이내+3년 범위 연장)이 이 "다른 법령"에 해당해, 기간제교원은 2년을 초과해 사용해도
    기간의 정함이 없는 근로계약(무기계약)으로 전환되지 않는다. 단, 1개월 미만 강사는 이
    특별규정의 적용 대상이 아니므로 기간제법이 그대로 적용된다(`contract-teacher-gangsa`
    참조). korean-law-mcp로 원문 확인(2026-08-02, MST 232201 §4, MST 230833 §3).

    * 이 조문 대응관계(기간제법 §4①6호·시행령 §3③1호 ↔ 임용령 §13③)는 이번 검증
      과정에서 원문을 대조해 도출한 해석이며, 실무도우미 요약본 자체는 근거를
      "임용령 §13③ 특별규정"으로만 표기하고 시행령 §3③1호까지는 명시하지 않는다.
  refs: ["기간제 및 단시간근로자 보호 등에 관한 법률 §4", "교육공무원임용령 §13"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-family-hiring-restriction
  type: 개념
  title: 계약제 교원 가족채용 제한
  chapter: 7
  scope: 공통
  summary: 고위공직자(각급학교장 포함)·채용업무담당자는 공개경쟁 등 예외에 해당하지 않는 한 자신의 가족을 계약제 교원으로 채용할 수 없다.
  body: |
    공직자의 이해충돌 방지법 §11①에 근거하며, 학교장 등 고위공직자와 채용업무담당 공직자의
    가족 채용을 금지한다. 다만 다른 법령에 따른 공개경쟁채용시험 등 다수인을 대상으로 하는
    시험에 합격한 경우는 예외로 허용된다(§11②). 위반 시 징계와 함께 과태료가 부과된다 —
    `num-contract-family-hiring-fine` 참조. korean-law-mcp로 원문 확인(2026-08-02,
    MST 232253 §11).
  refs: ["공직자의 이해충돌 방지법 §11"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-family-hiring-fine
  type: 수치·기한
  title: 가족채용 제한 위반 과태료 — 3천만원 이하
  chapter: 7
  scope: 공통
  summary: 가족이 채용되도록 지시·유도·묵인한 공직자에게는 3천만원 이하의 과태료를 부과한다.
  body: |
    공직자의 이해충돌 방지법 §28①1(§11③ 위반)에 근거. korean-law-mcp로 원문 확인
    (2026-08-02, MST 232253 §28①).
  refs: ["공직자의 이해충돌 방지법 §28"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-report-deadline
  type: 수치·기한
  title: 계약제 교원 채용·퇴직 보고기한 — 공립 5일·사립 7일(확인필요)
  chapter: 7
  scope: 공통
  summary: 계약제 교원 채용·퇴직 시 공립 5일·사립 7일 이내 보고가 실무 통용 수치이나, "공립 5일"의 근거 조문은 이번 조회에서 확인하지 못했다(확인필요).
  body: |
    사립 7일은 사립학교법 §54① "각급 학교의 교원 임용권자는 교원을 임용하였을 때에는
    임용한 날부터 7일 이내에 관할청에 보고하여야 한다"로 korean-law-mcp에서 원문 확인했다
    (2026-08-02, MST 279625 §54① — 다만 조문은 "임용" 보고를 규정할 뿐 "퇴직" 보고를
    별도로 명시하지는 않는다). 공립 5일은 실무도우미 정밀분석 원본(157~236행)과 교육공무원
    인사기록 및 인사사무 처리 규칙 §20(인사 보고, 발령일부터 7일 이내로 규정 — 5일이 아님,
    MST 285461)에서 모두 확인되지 않았다. "공립 5일" 수치의 근거 조문은 **확인필요**
    (시도교육청 자체 지침일 가능성 — 원문 별도 확인 권장).
  refs: ["사립학교법 §54"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: neis-contract-no-reuse-record
  type: NEIS작업
  title: NEIS 계약제 교원 신규등록 — 과거 인사기록카드 재사용 절대 금지
  chapter: 7
  scope: 공통
  summary: 계약제 교원을 새로 임용할 때는 과거 퇴직 시 사용하던 인사기록카드를 재사용(재신규등록)해서는 절대 안 되며, 신규공고에 의한 재임용도 근무 단절이 없어도 신규등록해야 한다.
  body: |
    퇴직예정일은 계약만료일로 반드시 등록해야 한다. 실무도우미가 지목한 계약제 NEIS 함정
    중 하나다("계약제 신규 임용 시 과거 인사기록카드 재사용 금지"). 정기승급·호봉재획정과
    마찬가지로 임용기안문 결재 후 "시행" 버튼을 클릭하지 않으면 인사기록에 반영되지 않는다
    (6장 `neis-regular-promotion` 참조, 동일 함정 유형).
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: audit-contract-childcare-dismissal-report
  type: 감사지적사례
  title: 육아휴직 사유 해고 시 고용노동청 통보의무 누락 지적
  chapter: 7
  scope: 공통
  summary: 육아휴직을 이유로 계약제 교원을 해고할 때 고용노동청에 통보하지 않은 사례가 감사원 감사에서 지적되었다.
  body: |
    육아휴직 중 해고가 불가피한 예외 사유(사업 계속 불가 등)에 해당하더라도, 관계 법령상
    고용노동청 통보의무를 이행하지 않으면 감사 지적 대상이 된다. 관련 벌칙 규정은
    `num-contract-childcare-refusal-penalty` 참조.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: audit-contract-document-request-early
  type: 감사지적사례
  title: 채용서류 사전청구·잠복결핵 결과 미제출 관련 지적사례
  chapter: 7
  scope: 공통
  summary: 최종 합격자 확정 전 채용서류를 미리 요구하거나, 잠복결핵 검사결과 미제출을 이유로 취업을 거부하는 것은 감사 지적·법령 위반 사례다.
  body: |
    채용서류는 최종 합격자 확정 후에 청구해야 하며, 확정 전 사전 청구는 감사 지적 대상이다.
    잠복결핵 검사결과를 제출하지 않았다는 이유만으로 취업(임용)을 거부할 수는 없다.
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: contract-homeroom-assignment
  type: 개념
  title: 계약제 교원 담임 배정 원칙
  chapter: 7
  scope: 공통
  summary: 담임은 정규교원 배정이 원칙이며, 불가피하게 계약제 교원을 배정할 때는 경력 2년 이상자를 배정하도록 노력해야 한다.
  body: |
    교원정책과-7078 지침 근거. 법적 강제 규정이 아니라 "노력" 의무 수준이다.
  refs: ["교원정책과-7078"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: num-contract-medical-cert-validity
  type: 수치·기한
  title: "[2026년판 초등판 명시 신설] 채용신체검사서 유효기간 — 1년(대체통보서 2년)"
  chapter: 7
  scope: 공통
  summary: 계약제 교원 채용신체검사서의 유효기간은 1년이며, 신체검사를 갈음하는 대체통보서는 2년까지 유효하다.
  body: |
    2026년판 초등판에 새로 명시된 사항이다. 중등판에도 원문에 동일 명시가 있는지는
    확인하지 못했다(확인필요 — 실무상 기준 자체는 계약제 교원 전반에 공통 적용될
    가능성이 높으나, "명시 신설"이 초등판에만 표기된 점을 감안해 scope은 공통으로
    두되 이 caveat을 유지한다). `contract-severance-pay`·`num-contract-sick-leave-days`·
    `num-contract-dismissal-notice`에 기재한 다른 세 초등판 신설 사항과 동일한 취급이다.
    대체통보서는 국민건강보험공단의 일반건강검진 결과 활용 서류 등을 가리키는 것으로
    추정된다(교육공무원임용령 §13⑤ 참조, `contract-teacher-giganje` 인접 조문 — 이 대응
    역시 추정이며 확인필요).
  refs: []
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: law-gyoyuggongmuwonbeop-32
  type: 법령·조문
  title: 교육공무원법 §32 (기간제교원)
  chapter: 7
  scope: 공통
  summary: 기간제교원의 임용 사유 5가지, 우선권 부인, 적용 배제 조문, 당연퇴직을 규정하는 기간제교원의 핵심 근거 조문.
  body: |
    ① 고등학교 이하 각급학교 교원의 임용권자는 다음 각 호의 어느 하나에 해당하는 경우에는
    예산의 범위에서 기간을 정하여 교원 자격증을 가진 사람을 교원으로 임용할 수 있다.
    1. 휴직(§44①각호 사유)으로 후임자 보충이 불가피한 경우
    2. 파견·연수·정직·직위해제 등 대통령령으로 정하는 사유로 직무이탈, 후임자 보충 불가피
    3. 특정 교과를 한시적으로 담당하도록 할 필요가 있는 경우
    4. 교육공무원이었던 사람의 지식·경험을 활용할 필요가 있는 경우
    5. 유치원 방과후 과정을 담당하도록 할 필요가 있는 경우
    ② 기간제교원은 정규 교원 임용에서 우선권이 인정되지 않으며, 4호 임용자를 제외하고는
    책임이 무거운 감독 업무 직위에 임용될 수 없다.
    ③ 국가공무원법 §16·§70·§73~73의4·§75·§76·§78~78의2·§79·§80·§82·§83①②·§83의2 등
    다수 조문의 적용이 배제되며, 임용기간이 끝나면 당연히 퇴직한다.
    ④ 채용제한(§10의3①)·재임용제한(§10의4) 규정을 준용한다.

    korean-law-mcp로 원문 확인(2026-08-02, MST 273345, 시행 2026.2.15.).
  refs: ["교육공무원법 §32"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: law-imyongryeong-13
  type: 법령·조문
  title: 교육공무원임용령 §13 (기간제교원의 임용)
  chapter: 7
  scope: 공통
  summary: 기간제교원 임용 사유의 세부기준, 시간제 근무 허용, 임용기간(1년+3년 연장), 신체검사 면제·대체 규정을 담은 시행령 조문.
  body: |
    ① 교육공무원법 §32①2호의 "대통령령으로 정하는 사유"(파견·연수·정직·직위해제 등)
    4가지를 열거.
    ② §32①3~5호 사유로 임용할 때는 주 6~35시간 범위의 시간제 기간제교원으로 임용 가능.
    ③ 임용기간은 1년 이내, 필요 시 3년 범위에서 연장 가능(`num-contract-term-limit` 근거
    조문).
    ④ 국가·지방공무원 또는 기간제교원 퇴직자를 퇴직일부터 6개월 이내에 재임용할 때는
    신체검사 면제 가능.
    ⑤ 국민건강보험공단의 일반건강검진 결과 활용 서류로 신체검사를 갈음할 수 있음.

    korean-law-mcp로 원문 확인(2026-08-02, MST 273697, 시행 2025.9.19.).
  refs: ["교육공무원임용령 §13"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: law-ihaechungdol-11
  type: 법령·조문
  title: 공직자의 이해충돌 방지법 §11 (가족 채용 제한)
  chapter: 7
  scope: 공통
  summary: 고위공직자·채용업무담당 공직자의 가족을 공공기관이 채용하지 못하도록 금지하는 조문으로, 계약제 교원 채용에도 적용된다.
  body: |
    ① 공공기관은 소속 고위공직자, 채용업무담당 공직자 등의 가족을 채용할 수 없다.
    ② 공개경쟁채용시험 등 다수인을 대상으로 하는 시험에 합격한 경우 등은 예외.
    ③ 고위공직자 등은 자신의 가족이 채용되도록 지시·유도·묵인해서는 안 된다.
    ④ 다른 법률이 채용을 허용하는 경우는 그 법률에 따른다.

    위반 시 과태료(§28①1, 3천만원 이하)가 부과된다. korean-law-mcp로 원문 확인
    (2026-08-02, MST 232253, 시행 2022.5.19.).
  refs: ["공직자의 이해충돌 방지법 §11", "공직자의 이해충돌 방지법 §28"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"

- id: law-namnyeo-goyong-19
  type: 법령·조문
  title: 남녀고용평등과 일·가정 양립 지원에 관한 법률 §19 (육아휴직)
  chapter: 7
  scope: 공통
  summary: 계약제 교원(근로자)의 육아휴직 신청·기간·해고금지·복귀·기간제법 관계를 규정하는 조문.
  body: |
    ① 사업주는 만 8세 이하 또는 초2 이하 자녀 양육을 위한 육아휴직 신청을 허용해야 한다.
    ② 기간은 1년 이내. 맞돌봄(부모 각 3개월↑ 사용)·한부모·장애아동 부모는 6개월 추가
    가능('25.10.1. 시행).
    ③ 육아휴직을 이유로 한 해고·불리한 처우 금지, 휴직기간 중 해고 금지(사업 계속 불가
    시 예외).
    ④ 복귀 시 휴직 전과 같은 업무·같은 수준 임금 직무로 복귀, 휴직기간은 근속기간에 포함.
    ⑤ 기간제·파견근로자의 육아휴직 기간은 기간제법 §4·파견법 §6의 사용(파견)기간에서 제외.

    위반(①·④) 시 500만원 이하 벌금(§37④4). korean-law-mcp로 원문 확인(2026-08-02,
    MST 276851, 시행 2025.10.1.).
  refs: ["남녀고용평등과 일·가정 양립 지원에 관한 법률 §19", "남녀고용평등과 일·가정 양립 지원에 관한 법률 §37"]
  pages: {중등: "315-433", 초등: "328-448"}
  verified: "2026-08-02"
