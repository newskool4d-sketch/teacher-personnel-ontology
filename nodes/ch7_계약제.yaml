  verified: "2026-08-02"

- id: num-contract-lecturer-pay-fulltime
  type: 수치·기한
  title: 강사수당(전일제·일당) — 가호 150,000 / 나호 140,000 / 다호 120,000 / 라호 110,000원
  chapter: 7
  scope: 공통
  summary: 전일제로 위촉하는 강사의 일당 수당은 등급(가~라호)에 따라 110,000원에서 150,000원까지 차등 지급한다.
  body: |
    | 등급 | 일당 |
    | --- | --- |
    | 가호 | 150,000원 |
    | 나호 | 140,000원 |
    | 다호 | 120,000원 |
    | 라호 | 110,000원 |

    등급(가~라호) 구분 기준 자체는 실무도우미 발췌에 포함되지 않아 확인필요(원문 별표
    대조 권장). 시간당 수당은 `num-contract-lecturer-pay-hourly` 참조.
