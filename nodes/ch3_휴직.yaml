- id: audit-family-care-abuse
  type: 감사지적사례
  title: 가족돌봄휴직 부당 사용 유형
  chapter: 3
  scope: 공통
  summary: 돌봄대상 유고 후 미복직, 본인 해외출국, 돌봄대상 원거리 거주 등 6개 유형.
  body: |
    가족돌봄휴직(교육공무원법 §44①9)은 봉급을 지급하지 않는 무급 휴직이다. 공무원보수규정
    §28③은 "제1항 및 제2항에 따라 받은 봉급에 해당하는 금액을 징수"하도록 정하는데,
    §28①·②가 열거하는 봉급 지급 대상 휴직(질병·불임난임·유학 등)에 가족돌봄휴직은
    포함되지 않는다(§28④가 별도로 무급휴직으로 규정, 2026-08-03 korean-law-mcp 재조회).
    따라서 부당사용 적발 시 §28③에 따른 "봉급 징수"는 직접 적용되지 않으며, 실질 제재는
    휴직 취소·복직명령 및 징계 사유 성립이 중심이다 — 원문(실무도우미)이 §28③을 명시했다면
    표기 오류일 가능성이 있어 원문 재확인 권장(확인필요).
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-03"
