- id: leave-childcare
  type: 개념
  title: 육아휴직
  chapter: 3
  scope: 공통
  summary: 자녀 1명당 3년 이내(분할 가능)로 신청하는 청원휴직. 8세 이하·초2 이하 자녀 양육 또는 여성 교육공무원의 임신·출산 사유로도 가능.
  body: |
    교육공무원법 §44①7 원문(2026-08-03 재조회): "만 8세 이하 또는 초등학교 2학년 이하의
    자녀를 양육하기 위하여 필요하거나 여성 교육공무원이 임신 또는 출산하게 된 경우" —
    자녀 양육 목적뿐 아니라 여성 교육공무원의 임신·출산 자체도 독립 사유다(자녀가 없는
    임신 중 교원도 신청 가능). 경력은 산입되며, 첫째·둘째 자녀는 승급기간 1년(특정 요건
    시 1년 6개월), 셋째 자녀부터는 전체 기간 산입.

    | 기간 | 육아휴직수당 상한 |
    | --- | --- |
    | 1~3개월 | 250만원 |
    | 4~6개월 | 200만원 |
    | 7개월~ | 160만원(하한 70만원) |

    수당 지급기간은 휴직일(또는 지정일)부터 **최초 1년 이내**이며, 부모 맞돌봄(각 3개월
    이상 사용)·한부모·장애아동 부모는 **최초 18개월 이내**로 확대된다(공무원수당 등에
    관한 규정 §11의3⑥·⑦, 2026-08-03 재조회 — 상한액 자체는 §11의3①과 일치 확인). 즉
    표의 "7개월~" 구간이 3년 휴직기간 내내 수당이 나온다는 뜻이 아니다.
  refs: ["교육공무원법 §44①7", "공무원수당 등에 관한 규정 §11의3①·⑥·⑦"]
  pages: {중등: "77-81", 초등: "확인필요"}
  aliases: ["육휴", "육아휴가"]
  verified: "2026-08-03"

- id: leave-family-care
  type: 개념
  title: 가족돌봄휴직
  chapter: 3
  scope: 공통
  summary: 1회 1년 이내, 재직 중 총 3년 한도의 청원휴직(구 가사휴직, '23.4 개칭). 경력·호봉 원칙 미산입이나 호봉 승급은 최초 90일 산입.
  body: |
    조부모·부모·배우자·자녀·손자녀 돌봄 목적. 경력평정은 미산입, 봉급은 미지급.

    다만 **호봉 승급기간**은 공무원보수규정 §15 6의2에 따라 최초 90일이 산입된다.
    §15 6의2 원문(2026-08-03 재조회): "「국가공무원법」 제71조제2항제5호 또는
    「교육공무원법」 제44조제1항제9호에 따른 사유로 휴직한 경우 최초의 90일"을 승급기간에
    산입한다. 경력평정(미산입)과 호봉 승급(최초 90일 산입)을 구분해서 안내해야 한다.
  refs: ["교육공무원법 §44①9", "공무원보수규정 §15 6의2"]
  pages: {중등: "87-91", 초등: "확인필요"}
  aliases: ["가돌", "가사휴직"]
  verified: "2026-08-03"

