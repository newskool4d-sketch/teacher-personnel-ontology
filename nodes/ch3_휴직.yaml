- id: num-childcare-max-3y
  type: 수치·기한
  title: 육아휴직 최대기간 — 자녀당 3년
  chapter: 3
  scope: 공통
  summary: 자녀 1명당 최대 3년(분할 사용 가능, 분할 횟수는 원문 미기재 — 확인필요).
  body: |
    "3회 분할"은 계약제 교원(7장, 남녀고용평등법 §19 적용)에 명시된 수치이며, 이 조항(교육공무원법
    §44①7 적용 대상)에는 분할 횟수가 원문에 제시되어 있지 않음 — 혼동 방지를 위해 분리 표기.
  refs: ["교육공무원법 §44①7"]
  pages: {중등: "77-81"}
  verified: "2026-08-01"

- id: num-reinstate-30d
  type: 수치·기한
  title: 복직신고 — 사유소멸·기간만료 후 30일 이내
  chapter: 3
  scope: 공통
  summary: 휴직 사유가 소멸하면 30일 이내 신고 후 복직명령을 받고, 휴직기간 만료 후 30일 이내 복귀 신고하면 당연복직.
  body: |
    휴직기간 중 사유가 소멸한 경우에는 30일 이내 신고하고 임용권자가 지체 없이 복직을
    명한다(국가공무원법 §73②). 휴직기간이 끝난 경우에는 30일 이내 복귀 신고를 하면
    당연히 복직된다(같은 조 §73③). 두 경우의 법적 효과를 구분해야 한다.
  refs: ["국가공무원법 §73②·③"]
  pages: {중등: "42-70"}
  verified: "2026-08-02"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "korean-law-mcp 현행 법령 검색 후 제73조 공식 원문 대조"
    unresolved: []
    applicability: "국가공무원법이 적용되는 휴직 공무원의 복직 절차"
    sources:
      - law_name: "국가공무원법"
        article: "제73조제2항·제3항"
        mst: "286457"
        effective_date: "2026-06-02"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/국가공무원법/제73조"

