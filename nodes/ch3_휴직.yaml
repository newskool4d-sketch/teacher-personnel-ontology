- id: leave-sick-official
  type: 개념
  title: 공무상질병휴직
  chapter: 3
  scope: 공통
  summary: 3년(2년 연장 가능, 총 5년, '23.4.19~) 직권휴직, 봉급 전액.
  body: |
    휴직 사유 자체는 교육공무원법 §44①1(질병휴직 공통 조항)에 근거하나, 기간(3년+2년,
    총 5년) 확대의 직접 근거는 §45①1 단서다. §45①1 단서 원문(2026-08-03 재조회):
    "「공무원 재해보상법」에 따른 공무상 부상 또는 질병으로 인한 휴직기간은 3년 이내로
    하되 … 2년의 범위에서 연장할 수 있다." 봉급 전액 지급의 근거는 공무원보수규정 §28①
    단서: "공무상 질병 또는 부상으로 휴직한 경우에는 그 기간 중 봉급 전액을 지급한다."
  refs: ["교육공무원법 §44①1", "교육공무원법 §45①1", "공무원보수규정 §28①"]
  pages: {중등: "42-70", 초등: "확인필요"}
  verified: "2026-08-03"

