- id: leave-self-training
  type: 개념
  title: 자율연수휴직
  chapter: 3
  scope: 공통
  summary: 재직 10년 이상자가 학기·학년 단위로 1년 이내, 재직 중 1회만 신청 가능한 청원휴직.
  body: |
    공무원연금법 §25에 따른 재직기간 요건(10년 이상)을 충족해야 하며, 경력·호봉은 미산입,
    봉급은 미지급.
  refs: ["교육공무원법 §44①12", "공무원연금법 §25"]
  pages: {중등: "93-94"}
  verified: "2026-08-02"
