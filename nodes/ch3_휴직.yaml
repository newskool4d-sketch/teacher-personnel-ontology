  summary: 시술 없이 해외여행 등 휴직 목적과 무관하게 사용한 불임·난임휴직 부당 사례.
  body: |
    적발 시 「공무원보수규정」§28③에 따라 지급 보수 징수 및 징계 사유가 된다(원문상 인접한
    가족돌봄휴직 항목에 명시된 조문을 준용 — 확인필요).
  refs: ["공무원보수규정 §28③(인접 항목 준용, 확인필요)"]
