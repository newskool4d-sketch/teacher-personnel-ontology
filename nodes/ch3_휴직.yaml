- id: leave-employment
  type: 개념
  title: 고용휴직
  chapter: 3
  scope: 공통
  summary: 고용 기간 동안의 청원휴직으로, 상근 시 경력 100%·비상근 시 50% 산입, 봉급은 미지급.
  body: |
    민간단체 재직 중 5년 내 1회 가능하며, 5년 연속 사용 시 복직 후 1년 이상 의무복무.
  refs: ["교육공무원법 §44①6"]
  pages: {중등: "42-70", 초등: "확인필요"}
  verified: "2026-08-02"

- id: leave-infertility
  type: 개념
  title: 불임·난임휴직
  chapter: 3
  scope: 공통
  summary: 불임·난임 치료를 위한 1년+1년(최대 2년) 청원휴직으로, 경력은 미산입.
  body: |
    직권휴직이 아닌 청원휴직이며, 봉급은 1년 이하 70%, 1~2년 50% 지급.
  refs: ["교육공무원법 §44①7의3"]
  pages: {중등: "42-70", 초등: "확인필요"}
  verified: "2026-08-02"

