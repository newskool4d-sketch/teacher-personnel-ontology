- id: leave-study-abroad
  type: 개념
  title: 유학휴직
  chapter: 3
  scope: 공통
  summary: 학위취득 목적 유학 시 3년(학위취득 시 3년 추가)까지의 청원휴직, 경력·봉급 각 50% 산정.
  body: |
    실경력 3년 이상(인천 기준) 요건. 휴직 기간과 동일한 기간 이상의 의무복무가 부과된다.
