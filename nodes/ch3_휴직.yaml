- id: qa-overseas-study-no-second-extension
  type: Q&A·유권해석
  title: 유학휴직 3년 연장자의 2차 재연장 불가
  chapter: 3
  scope: 공통
  summary: 원문상 유학휴직 최대기간은 3년+3년(학위취득 시); 재연장 불가는 이 최대기간에서 추정.
  body: |
    "재연장 불가"는 원문에 실린 명시적 유권해석 문구가 아니라, 3년+3년이라는 최대기간 수치로부터
    도출한 추정이다 — 사실과 추정을 분리 표기(확인필요).
  refs: ["교육공무원법 §44①5"]
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-02"

- id: audit-infertility-leave-misuse
  type: 감사지적사례
  title: 불임·난임휴직 목적 외 사용(시술 없이 해외여행 등)
  chapter: 3
  scope: 공통
  summary: 시술 없이 해외여행 등 휴직 목적과 무관하게 사용한 불임·난임휴직 부당 사례.
  body: |
    불임·난임휴직(교육공무원법 §44①7의3)은 봉급 일부(1년 이하 70%·1~2년 50%)가
    지급되는 휴직이다. 공무원보수규정 §28① 원문(2026-08-03 재조회): "「국가공무원법」
    제71조제1항제1호 또는 「교육공무원법」 제44조제1항제1호ㆍ제7호의3에 따라 휴직한
    공무원에게는 …봉급…의 일부를 지급한다" — 7호의3(불임·난임)이 명시되어 있어,
    §28③(제1항·제2항에 따라 받은 봉급 징수)이 **직접 적용**된다(가족돌봄휴직과 달리
    준용이 아님). 부당사용 적발 시 지급받은 봉급 징수 + 징계 사유가 된다.
  refs: ["공무원보수규정 §28①·③"]
  pages: {중등: "70-136"}
  verified: "2026-08-03"

- id: leave-adoption
  type: 개념
  title: 입양휴직
  chapter: 3
  scope: 공통
  summary: 만19세 미만 아동(육아휴직 대상 아동은 제외) 입양 시 6월 이내로 신청하는 청원휴직, 아동 1명당 1회.
  body: |
    교육공무원법 §44①7의2 원문(2026-08-03 재조회): "만 19세 미만의 아동(제7호에 따른
    육아휴직의 대상이 되는 아동은 제외한다)을 입양(入養)하는 경우" — 즉 입양휴직과
    육아휴직(leave-childcare)은 계층 관계가 아니라, 대상 아동이 서로 배제되는 병렬·
    상호배타 사유다.
  refs: ["교육공무원법 §44①7의2"]
  pages: {중등: "81-84"}
  verified: "2026-08-03"

- id: leave-accompany
  type: 개념
  title: 동반휴직
  chapter: 3
  scope: 공통
  summary: 배우자 국외근무·유학 동반 목적, 3년(3년 범위 연장, 총 6년 한도)의 청원휴직.
