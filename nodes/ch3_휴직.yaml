    바에 따라 2년의 범위에서 연장(총 5년)으로 교육공무원법 §45①1 단서에 korean-law-mcp로
    직접 확인됨(2026-08-02).
  refs: ["교육공무원법 §45①1"]
  pages: {중등: "42-70"}
