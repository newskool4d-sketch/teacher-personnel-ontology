- id: num-tb-test-1m
  type: 수치·기한
  title: "결핵검사 — 6개월 이상 업무 미종사 후 복귀 1개월 이내"
  chapter: 3
  scope: 공통
  summary: 휴직·파견 등으로 6개월 이상 업무에 종사하지 않다가 복귀하면 복귀일부터 1개월 이내 결핵검사를 받아야 함.
  body: |
    「결핵예방법 시행규칙」 §4②에서 6개월 이상 업무 미종사 후 복귀한 사람의 검사 기한을
    직접 규정한다. 기존 실무자료의 "복직 전 6개월 이내 검진기록으로 갈음" 문구는 이 조문에서
    확인되지 않았으므로, 별도 공식 근거를 확인하기 전에는 검증된 예외로 사용하지 않는다.
  refs: ["결핵예방법 시행규칙 §4②"]
  pages: {중등: "70-116"}
  verified: "2026-08-02"
  legal_review:
    state: partial
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "korean-law-mcp 현행 법령 검색 후 시행규칙 제4조 공식 원문 대조"
    unresolved:
      - "복귀 전 6개월 이내 검진기록으로 갈음할 수 있다는 세부 문구의 공식 근거 미확인"
    applicability: "결핵예방법 제11조제1항의 기관·학교 등에 소속되고 6개월 이상 업무에 종사하지 않다가 복귀하는 사람"
    sources:
      - law_name: "결핵예방법 시행규칙"
        article: "제4조제2항"
        mst: "265679"
        effective_date: "2025-01-01"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/결핵예방법시행규칙/제4조"

- id: num-vacancy-fill-6m
  type: 수치·기한
  title: 결원보충 — 6개월 이상 휴직 시 별도정원
  chapter: 3
  scope: 공통
  summary: 6개월 이상 휴직 시 별도정원으로 결원을 보충하며, 출산휴가·육아휴직 연계도 승인 이후 두 기간의 합계가 6개월 이상이어야 함.
  body: |
    출산휴가와 연속되는 육아휴직은 육아휴직 명령 이후 남은 출산휴가기간과 육아휴직기간의
    합계가 6개월 이상이어야 한다(교육공무원임용령 §7의4②2). 육아휴직과 연속되는 출산휴가도
    출산휴가 승인 이후 두 기간의 합계가 6개월 이상이어야 한다(같은 항 제3호).
  refs: ["교육공무원임용령 §7의4②2·3"]
  pages: {중등: "70-116"}
  verified: "2026-08-02"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-02"
    checked_at: "2026-08-02"
    method: "korean-law-mcp 현행 법령 검색 후 제7조의4 공식 원문 대조"
    unresolved: []
    applicability: "출산휴가와 육아휴직이 연속되는 교육공무원의 별도정원 결원보충"
    sources:
      - law_name: "교육공무원임용령"
        article: "제7조의4제2항제2호·제3호"
        mst: "273697"
