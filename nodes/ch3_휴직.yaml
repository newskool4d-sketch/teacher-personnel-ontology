- id: leave-study-abroad
  type: 개념
  title: 유학휴직
  chapter: 3
  scope: 공통
  summary: 학위취득 목적 해외유학 또는 1년 이상 국외 연구·연수 시 3년 이내(학위취득 목적이면 3년 범위 연장 가능), 경력·봉급 각 50% 산정.
  body: |
    교육공무원법 §44①5 원문(2026-08-03 재조회): "학위취득을 목적으로 해외유학을 하거나
    외국에서 1년 이상 연구 또는 연수를 하게 된 경우" — 학위취득 목적 유학뿐 아니라
    1년 이상 국외 연구·연수 사유도 포함된다. 연장 요건(§45①4 단서)은 "학위취득을
    하려는 경우"로 한정된다. 실경력 3년 이상(인천 기준) 요건이며, 휴직 기간과 동일한
    기간 이상의 의무복무가 부과된다.
  refs: ["교육공무원법 §44①5", "교육공무원법 §45①4"]
  pages: {중등: "42-70", 초등: "확인필요"}
  verified: "2026-08-03"

