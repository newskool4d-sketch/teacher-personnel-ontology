- id: leave-childcare
  type: 개념
  title: 육아휴직
  chapter: 3
  scope: 공통
  summary: 자녀 1명당 3년 이내(분할 가능)로 신청하는 청원휴직.
  body: |
    8세 이하 또는 초등학교 2학년 이하 자녀 양육 목적. 경력은 산입되며,
    첫째·둘째 자녀는 승급기간 1년(특정 요건 시 1년 6개월), 셋째 자녀부터는 전체 기간 산입.

    | 기간 | 육아휴직수당 상한 |
    | --- | --- |
    | 1~3개월 | 250만원 |
    | 4~6개월 | 200만원 |
    | 7개월~ | 160만원(하한 70만원) |
  refs: ["교육공무원법 §44①7"]
  pages: {중등: "77-81", 초등: "확인필요"}
  aliases: ["육휴", "육아휴가"]
  verified: "2026-08-01"

- id: leave-family-care
  type: 개념
  title: 가족돌봄휴직
  chapter: 3
  scope: 공통
  summary: 1회 1년 이내, 재직 중 총 3년 한도의 청원휴직(구 가사휴직, '23.4 개칭).
  body: |
    조부모·부모·배우자·자녀·손자녀 돌봄 목적. 경력 미산입, 봉급 미지급.
  refs: ["교육공무원법 §44①9"]
  pages: {중등: "87-91", 초등: "확인필요"}
  aliases: ["가돌", "가사휴직"]
  verified: "2026-08-01"

