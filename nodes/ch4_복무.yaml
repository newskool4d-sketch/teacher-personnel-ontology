# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제4장 복무"(파일 83~123행)
#       + § "5. 실무 유의 포인트"(감사지적사례·NEIS 함정 중 복무 관련 항목, 파일 205~217행)
# 페이지: 4장 복무 — 중등 117~235쪽(NEIS 224~235), 초등 125~256쪽(NEIS 241~255)

- id: duty-job
  type: 개념
  title: 직무상 의무
  chapter: 4
  scope: 공통
  summary: 성실·복종 등 직무 수행과 관련한 7종 의무(국가공무원법 §56~66).
  body: |
    직무상 의무는 신분상 의무와 함께 국가공무원법 §56~66에 근거하며, 위반 시 징계 사유가 된다.
    개별 의무 7종의 구체적 명칭·조번호는 실무도우미 요약본에 개수만 제시되어 원문 대조가
    필요하다(확인필요).
  refs: ["국가공무원법 §56~66"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: duty-status
  type: 개념
  title: 신분상 의무
  chapter: 4
  scope: 공통
  summary: 품위유지 등 공무원 신분에 따르는 5종 의무(국가공무원법 §56~66), SNS 언행도 위반 대상.
  body: |
    영리업무 및 겸직금지 의무도 신분상 의무에 포함되며, 구체 요건·절차는 [겸직허가](#/node/moonlight-general)
    참조. 개별 의무 5종의 구체적 명칭·조번호는 실무도우미 요약본에 개수만 제시되어 원문 대조가
    필요하다(확인필요).
  refs: ["국가공무원법 §56~66"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: law-gukgong-56-66
  type: 법령·조문
  title: 국가공무원법 제56조부터 제66조까지 (복무)
  chapter: 4
  scope: 공통
  summary: 성실·복종·비밀엄수·청렴·품위유지 의무와 영리·겸직·정치운동·집단행위 금지를 규정하는 복무 조문.
  body: |
    국가공무원이 직무를 수행할 때와 공무원 신분을 유지하는 동안 지켜야 할 기본 의무와
    금지행위를 정한다.

    - 제56조부터 제60조까지: 법령 준수와 성실한 직무 수행, 직무상 명령 복종, 무단 직장
      이탈 금지, 친절·공정한 업무 수행, 재직 중과 퇴직 후의 직무상 비밀 엄수
    - 제61조부터 제63조까지: 직무 관련 사례·증여·향응 수수 금지, 외국 정부의 영예·증여를
      받을 때의 허가, 직무 안팎의 품위 유지
    - 제64조: 영리 목적 업무 종사 금지와 소속 기관장 허가 없는 겸직 금지
    - 제65조와 제66조: 정치운동 및 공무 외 집단행위 금지

    겸직 가능 여부나 정치적 행위의 구체적인 범위는 국가공무원 복무규정 등 관련 하위
    법령을 함께 확인해야 한다. 개별 사안은 행위의 내용, 직무 관련성, 기관장 허가 여부를
    구분하여 판단한다.
  refs: ["국가공무원법 제56조부터 제66조까지"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-04"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 제56조부터 제66조까지 공식 원문 대조"
    unresolved: []
    applicability: "국가공무원법이 적용되는 교육공무원의 기본 복무 의무와 금지행위"
    sources:
