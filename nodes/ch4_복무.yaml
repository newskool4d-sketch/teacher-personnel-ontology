- id: num-outside-lecture-fee
  type: 수치·기한
  title: 외부강의 사례금 상한 — 공무원 40만원/국공립교직원 100만원(1시간당)
  chapter: 4
  scope: 공통
  summary: 외부강의 사례금은 1시간당 공무원 40만원, 국공립학교 교직원 등 100만원 상한(기고는 1건당).
  body: |
    사례금 상한의 직접 근거는 「부정청탁 및 금품등 수수의 금지에 관한 법률 시행령」
    별표 2(2026.6.30. 개정, 2026-08-03 원문 재조회)이다. 별표2
    원문: 공직자등 구분에 따라 40만원 또는 100만원 상한. 적용기준: "상한액은 강의 등의
    경우 1시간당, 기고의 경우 1건당 상한액으로 한다." 즉 100만원은 시간당 기준이며,
    1시간을 초과하는 강의도 시간당 상한을 초과 지급할 수 없다(별표2 적용기준 세부는
    구간별 상한 산정 방식이 있어 재확인 권장). 강의 종료 후 10일 이내 NEIS 신고 의무는
    「공무원 행동강령」§15②로 확인됨(2026-08-02).
  refs: ["부정청탁 및 금품등 수수의 금지에 관한 법률 시행령 §25·별표2", "공무원 행동강령 §15②"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-03"

- id: num-outside-lecture-approval
  type: 수치·기한
  title: 외부강의 사전승인 기준 — 월3회 또는 월6시간 초과
  chapter: 4
  scope: 공통
  summary: 월 3회 또는 월 6시간을 초과하는 외부강의는 사전 승인 대상, 1개월 초과 지속 출강은 겸직허가 대상.
  body: |
    사전승인 제도 자체의 근거는 「공무원 행동강령」§15⑦⑧(중앙행정기관의 장등이 정하는
    횟수 상한 초과 시 사전 승인)로 korean-law-mcp 직접 확인됨(2026-08-02) — 다만 "월 3회
    또는 월 6시간"이라는 구체 기준치는 교육부가 정하는 별도 지침 소관이라 동 강령 본문에는
    없어 확인필요.
  refs: ["확인필요"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

