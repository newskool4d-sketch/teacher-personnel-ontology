  title: 근무장소 외 연수(교육공무원법 §41, "41조 연수")
  chapter: 4
  scope: 공통
  summary: 수업에 지장이 없는 범위에서 소속 기관장 승인을 받아 연수기관·근무장소 외 시설에서 연수받는 제도로, 방학 중 복무·공무외 국외여행과 함께 활용되는 휴가 외 경로다.
  body: |
    교육공무원법 §41 원문(2026-08-03 korean-law-mcp 재조회): "교원은 수업에 지장을 주지
    아니하는 범위에서 소속 기관의 장의 승인을 받아 연수기관이나 근무장소 외의 시설
    또는 장소에서 연수를 받을 수 있다." 휴가(연가·공가 등)와는 별개 제도로, 방학 중
    [방학·휴업일 근무의무](#/node/work-vacation-not-holiday)의 예외 경로이자 [공무외 국외여행](#/node/overseas-private-travel)의
    근거로도 쓰인다. 교원휴가에 관한 예규 §4⑤: "「교육공무원법」제41조에 따른 공무외
    국외여행은 「국가공무원 복무규정」에 의한 휴가와 별도로 실시할 수 있으며, 인정범위
    및 절차 등은 [교육감/학교장이] 별도로 정한다"(세부 위임 주체·범위는 원문 재대조
    권장 — 확인필요).
  refs: ["교육공무원법 §41", "교원휴가에 관한 예규 §4⑤"]
  pages: {중등: "확인필요", 초등: "확인필요"}
  verified: "2026-08-03"

- id: law-teacher-leave-rules
  type: 법령·조문
  title: 교원휴가에 관한 예규
  chapter: 4
  scope: 공통
  summary: 교원의 연가·병가·공가·특별휴가 등 종류와 일수를 정하는 예규(현행 제104호, 2026.2.27.).
  body: |
    법제처 행정규칙 연혁 조회(2026-08-03) 결과 부칙 이력은 "제83호(2023.12.11.)
    → 제98호(2025.4.28.) → 제100호(2025.8.8.) → 제104호(2026.2.27.)"이며, 최신 현행은
    제104호다. 4장 각 휴가 항목의 근거가 "교육부예규 제83호"로 기재되어 있으나 이는 2개
    개정 전 호수이므로, 조문 내용(일수·요건) 자체가 제104호와 달라졌는지는 항목별로
    별도 재대조가 필요하다(확인필요). 이 항목의 제목과 요약은 현행 제104호 기준이다.
  refs: ["교육부예규 제104호(2026.2.27.)"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-03"

- id: leave-overview
  type: 개념
  title: 교원 휴가 개관
  chapter: 4
  scope: 공통
  summary: 연가·병가·공가·출산휴가 등 교원휴가예규가 정하는 휴가 종류 전반의 총칭.
  body: |
    세부 종류별 일수·요건은 연가·병가·공가·특별휴가 등 각 휴가 항목을 참조한다. 지각·조퇴·외출 누계 8시간은
    연가 1일로 환산하며, 같은 연도 내 병가 합산 일수 또는 동일사유 공가·특별휴가(출산·
    유산사산휴가 포함) 합산 일수가 30일 이상이면 토·공휴일도 일수에 산입한다(자세한
    내용은 [휴가 시간 환산 및 토·공휴일 산입](#/node/num-leave-hour-conversion) 참조).
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

