# 제4장 복무 — 의무·겸직/근무형태/휴가 종류별 일수/공무외국외여행·공무국외출장
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 제4장 복무"(파일 83~123행)
#       + § "5. 실무 유의 포인트"(감사지적사례·NEIS 함정 중 복무 관련 항목, 파일 205~217행)
# 페이지: 4장 복무 — 중등 117~235쪽(NEIS 224~235), 초등 125~256쪽(NEIS 241~255)

- id: duty-job
  type: 개념
  title: 직무상 의무
  chapter: 4
  scope: 공통
  summary: 성실·복종 등 직무 수행과 관련한 7종 의무(국가공무원법 §56~66).
  body: |
    직무상 의무는 신분상 의무와 함께 국가공무원법 §56~66에 근거하며, 위반 시 징계 사유가 된다.
    개별 의무 7종의 구체적 명칭·조번호는 실무도우미 요약본에 개수만 제시되어 원문 대조가
    필요하다(확인필요).
  refs: ["국가공무원법 §56~66"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: duty-status
  type: 개념
  title: 신분상 의무
  chapter: 4
  scope: 공통
  summary: 품위유지 등 공무원 신분에 따르는 5종 의무(국가공무원법 §56~66), SNS 언행도 위반 대상.
  body: |
    영리업무 및 겸직금지 의무도 신분상 의무에 포함되며, 구체 요건·절차는 `moonlight-general`
    참조. 개별 의무 5종의 구체적 명칭·조번호는 실무도우미 요약본에 개수만 제시되어 원문 대조가
    필요하다(확인필요).
  refs: ["국가공무원법 §56~66"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: law-gukgong-56-66
  type: 법령·조문
  title: 국가공무원법 §56~66 (복무)
  chapter: 4
  scope: 공통
  summary: 성실의무부터 영리업무 및 겸직금지까지 직무상·신분상 의무 전반을 규정하는 복무 장.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: moonlight-general
  type: 개념
  title: 겸직허가
  chapter: 4
  scope: 공통
  summary: 금지요건 4종(복무규정 §25)에 해당하지 않으면 기관장 사전허가로 겸직 가능.
  body: |
    국가공무원 복무규정 §25가 정한 금지요건 4종 중 어디에도 해당하지 않는 경우에 한해
    기관장의 사전허가를 받아 겸직할 수 있다. 금지요건 4종의 구체적 내용은 실무도우미
    요약본에 개수만 제시되어 있어 원문 §25 대조가 필요하다(확인필요).
  refs: ["국가공무원 복무규정 §25"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: proc-moonlight-approval
  type: 절차
  title: 겸직허가 절차
  chapter: 4
  scope: 공통
  summary: 사전허가 신청 → (필요 시) 겸직심사위원회 심사 → 허가·통보 순으로 진행.
  body: |
    개인방송·부동산임대업·과다수익 등 특정 유형은 겸직심사위원회 회부가 필수이다.
    세부 신청서식·처리기한은 실무도우미 요약본에 제시되어 있지 않아 확인필요.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

