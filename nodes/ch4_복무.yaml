- id: num-leave-official
  type: 수치·기한
  title: 공가 — 사유별 필요기간(교원휴가예규 §7, 14개 사유)
  chapter: 4
  scope: 공통
  summary: 병역판정검사·소환·투표·검진·헌혈·제1급감염병 예방접종 등 14개 사유(교원휴가예규 §7)별로 필요한 기간만큼 부여.
  body: |
    교원휴가에 관한 예규 제7조는 제1호(병역판정검사)~제14호(제1급감염병 예방접종·검사)로
    구성된 14개 사유다(2026-08-03 korean-law-mcp 재조회). 동 예규 제10조는 "교원의
    휴가에 관하여는 「국가공무원 복무규정」제16조제1항, 제4항, 제5항과 제16조의2,
    제16조의3, 제16조의4, 제19조는 적용하지 아니한다"고 정해, 교원 공가의 직접 근거는
    복무규정 §19가 아니라 예규 §7이다.
  refs: ["교원휴가에 관한 예규 §7", "교원휴가에 관한 예규 §10"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-03"

