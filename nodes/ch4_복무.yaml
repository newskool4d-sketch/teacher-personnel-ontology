  summary: 겸직 허가기간은 원칙 2년, 사교육업체·인터넷 개인방송은 최대 1년.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: moonlight-committee
  type: 개념
  title: 겸직심사위원회
  chapter: 4
  scope: 공통
  summary: 교(원)감 포함 내부위원 3인 이상으로 구성, 개인방송·부동산임대업·과다수익 등은 회부 필수.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: moonlight-survey
  type: 수치·기한
  title: 겸직 실태조사 — 매년 1월·7월
  chapter: 4
  scope: 공통
  summary: 겸직 실태조사는 매년 1월과 7월에 실시한다.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: moonlight-hour-limit
  type: 수치·기한
  title: 겸직 근무시간 상한 — 주52시간·1일12시간
  chapter: 4
  scope: 공통
  summary: 본업 근무시간과 겸직 시간을 합산해 주 52시간·1일 12시간을 초과할 수 없다.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: moonlight-personal-media
  type: 개념
  title: 인터넷 개인 미디어 활동 지침
  chapter: 4
  scope: 공통
  summary: 2022.1.1. 시행 — 수익요건(유튜브 구독1,000명+연재생4,000시간 등) 충족·계속 활동 시 겸직허가 필요.
  body: |
    학생이 콘텐츠에 출연할 경우 초상권 동의가 필수이며, 만 14세 미만 학생은 법정대리인
    동의도 받아야 한다. 수익요건은 유튜브 기준(구독자 1,000명 + 연간 재생시간 4,000시간)이
    예시로 제시되어 있으며, 다른 플랫폼 기준은 실무도우미 요약본에 없어 확인필요.
  refs: ["인터넷 개인 미디어 활동 지침(2022.1.1. 시행)"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: moonlight-private-academy
  type: 개념
  title: 사교육업체 겸직 가이드라인
  chapter: 4
  scope: 공통
  summary: 학교교과교습학원 관련 강의·출제·교재·컨설팅 등 일체를 원칙 금지, 평생직업교육학원 등은 허가 후 가능.
  body: |
    EBS 등 학교교과교습학원과 무관한 기관은 겸직허가를 받으면 가능하다. 다단계판매원 등록은
    방문판매법 §15에 따라 금지된다.
  refs: ["방문판매법 §15"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: outside-lecture-fee
  type: 수치·기한
  title: 외부강의 사례금 상한 — 공무원 40만원/국공립교직원 100만원
  chapter: 4
  scope: 공통
  summary: 외부강의 사례금은 시간당 공무원 40만원(초과분 포함 최대 150%), 국공립학교 교직원 100만원 상한.
  body: |
    국공립학교 교직원 100만원 상한이 시간당 기준인지 강의 1건당 기준인지는 실무도우미
    요약본에 명시되어 있지 않아 확인필요. 강의 종료 후 10일 이내 NEIS 신고 의무가 있다.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: outside-lecture-approval
  type: 수치·기한
  title: 외부강의 사전승인 기준 — 월3회 또는 월6시간 초과
  chapter: 4
  scope: 공통
  summary: 월 3회 또는 월 6시간을 초과하는 외부강의는 사전 승인 대상, 1개월 초과 지속 출강은 겸직허가 대상.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: work-hours-teacher
  type: 수치·기한
  title: 교원 근무시간 — 09:00~17:00
  chapter: 4
  scope: 공통
  summary: 교원 근무시간은 09:00~17:00(점심시간 포함, 급식·생활지도 사유), 일반직은 09:00~18:00.
  body: |
    1985년 문교부 예규에 근거해 교원은 점심시간에도 급식·생활지도 업무가 있어 근무시간에
    포함된다.
  refs: ["문교부 예규(1985)"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: work-business-trip-distance
  type: 수치·기한
  title: 출장 거리 기준 — 근무지내 12km 미만/근무지외 12km 이상
  chapter: 4
  scope: 공통
  summary: 근무지내 출장은 12km 미만, 근무지외 출장은 12km 이상을 기준으로 구분한다.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: work-remote
  type: 개념
  title: 재택근무
  chapter: 4
  scope: 공통
  summary: 최소 1일·주 단위로 신청 가능하며, 당일 근무시작 전 NEIS로 신청한다.
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: work-graduate-school
  type: 개념
  title: 대학원 수강 규정
  chapter: 4
  scope: 공통
  summary: 야간·계절제 수강은 출장(연수) 처리 가능하나 주간 수강은 연가·조퇴만 허용된다.
  body: |
    연가를 초과해 수강하면 직장이탈(국가공무원법 §58) 위반이 된다. 대학원 수업 목적의
    초과근무명령은 불가하다(교원정책과-8651, 2024.12.26.).
  refs: ["국가공무원법 §58", "교원정책과-8651(2024.12.26.)"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: work-part-time
  type: 수치·기한
  title: 시간선택제 전환 — 주 15~25시간
  chapter: 4
  scope: 공통
  summary: 주 15~25시간·1일 3시간 이상 근무, 격주·격월 금지, 1년 단위로 총 3년까지 전환 가능.
  body: |
    전환 기간 중 담임은 배제되며, 보수는 근무시간에 비례한다(단 가족수당·자녀학비보조는
    전일제와 동일하게 지급).
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: work-vacation-not-holiday
  type: 개념
  title: 방학·휴업일 근무의무
  chapter: 4
  scope: 공통
  summary: 방학·휴업일은 휴무일이 아니며, 무단이탈 시 징계 사유가 된다(대판 87누657).
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: law-teacher-leave-rules
  type: 법령·조문
  title: 교원휴가에 관한 예규
  chapter: 4
  scope: 공통
  summary: 교육부예규 제83호 — 교원의 연가·병가·공가·특별휴가 등 종류와 일수를 정하는 예규.
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: leave-overview
  type: 개념
  title: 교원 휴가 개관
  chapter: 4
  scope: 공통
  summary: 연가·병가·공가·출산휴가 등 교원휴가예규가 정하는 휴가 종류 전반의 총칭.
  body: |
    세부 종류별 일수·요건은 `num-leave-*` 노드를 참조. 지각·조퇴·외출 누계 8시간은
    연가 1일로 환산하며, 병가·공가·출산휴가·유산사산휴가가 30일을 초과하면 토·공휴일도
    일수에 산입한다(자세한 내용은 `num-leave-hour-conversion` 참조).
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: num-leave-annual
  type: 수치·기한
  title: 연가 — 재직기간별 11~21일
  chapter: 4
  scope: 공통
  summary: 재직기간별 연 11~21일 차등 부여, 가산 최대 2일.
  body: |
    | 재직기간 | 연가일수 |
    | --- | --- |
    | 1월~1년 | 11일 |
    | 1~3년 | 15일 |
    | 3~4년 | 16일 |
    | 4~5년 | 17일 |
    | 5~6년 | 20일 |
    | 6년 이상 | 21일 |

    가산 최대 2일이 추가될 수 있다(가산 요건은 확인필요).
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: num-leave-sick
  type: 수치·기한
  title: 병가 — 일반 연60일/공무상 연180일
  chapter: 4
  scope: 공통
  summary: 일반병가는 연 60일, 공무상병가는 연 180일(동일사유는 연도 무관 통산).
  body: |
    연 6일을 초과하거나 연속 7일 이상 병가를 사용하는 경우 진단서를 제출해야 한다.
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: num-leave-official
  type: 수치·기한
  title: 공가 — 사유별 필요기간(15개 사유)
  chapter: 4
  scope: 공통
  summary: 병역·소환·투표·검진·헌혈 등 15개 사유별로 필요한 기간만큼 부여.
  body: |
    15개 사유의 전체 목록은 실무도우미 요약본에 예시(병역·소환·투표·검진·헌혈)만
    제시되어 있어 원문 대조가 필요하다(확인필요).
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: num-leave-maternity
  type: 수치·기한
  title: 출산휴가 — 90일(다태아 120일·미숙아 100일)
  chapter: 4
  scope: 공통
  summary: 출산휴가는 90일(산후 45일 이상), 다태아 120일(산후 60일 이상), 미숙아 100일.
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: num-leave-spouse-maternity
  type: 수치·기한
  title: 배우자 출산휴가 — 20일(다태아 25일)
  chapter: 4
  scope: 공통
  summary: 2025.2.11. 10일에서 20일(다태아 25일)로 확대, 3회(다태아 5회) 분할 사용 가능.
  body: |
    출산 예정일 30일 전부터 출산 후 120일(다태아 150일)까지 사용해야 한다.
  refs: ["교육부예규 제83호"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-02"

- id: num-leave-miscarriage
  type: 수치·기한
  title: 유산·사산휴가 — 임신주수별 10~90일
  chapter: 4
  scope: 공통
  summary: 임신 15주 이하 10일부터 28주 이상 90일까지 임신주수별 차등, 배우자는 3일.
  body: |
    | 임신주수 | 휴가일수 |
