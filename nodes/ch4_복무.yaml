- id: num-leave-long-service
  type: 수치·기한
  title: 장기재직휴가 — 10~20년 5일/20년 이상 7일
  chapter: 4
  scope: 공통
  summary: 재직 10년 이상 20년 미만 5일, 20년 이상 7일 — 각 구간에서 1회 사용(2026 실무도우미 기준).
  body: |
    2026 실무도우미(중등·초등)는 재직 10년 이상 20년 미만 5일, 20년 이상 7일의 2단계로
    안내한다. 이 값을 정본으로 유지한다.

    **현행 법령과의 차이**: 국가공무원 복무규정 §20⑱ 원문(2026-08-04 현행 법령 원문
    재조회, 시행 2026-06-23)은 "1. 재직기간이 5년 이상 10년 미만인 공무원: 3일 2. 재직기간이
    10년 이상 20년 미만인 공무원: 5일 3. 재직기간이 20년 이상인 공무원: 7일"의 3단계로
    규정한다. 담당자 확인(2026-08-04): "5년 이상 10년 미만 3일" 구간은 교원에게는
    해당사항 없음 — (교육부) 「교원휴가에 관한 예규」 개정 사항으로, 국가공무원 복무규정의
    신설 구간을 교원휴가 예규가 그대로 반영하지 않은 것으로 파악된다. 다만 예규의 구체
    조항은 법제처 행정규칙 정보에서 전문이 조회되지 않아(원문 미확보) 이 안내서에서 직접
    인용하지 못했다. 담당자 확인 사항으로 기록하며, 예규 원문·소속 시·도교육청 지침으로
    재확인이 필요하다.
  refs: ["국가공무원 복무규정 §20⑱"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-04"
  legal_review:
    state: partial
    applicable_as_of: "2026-08-04"
    checked_at: "2026-08-04"
    method: "korean-law-mcp 현행 법령 검색 후 §20⑱ 공식 원문 대조 + 업무 담당자 확인(2026-08-04, 교원휴가에 관한 예규 개정으로 5~10년 구간 해당없음)"
    unresolved:
      - "\"5~10년 미만 3일 구간이 교원에게 해당없음\"의 근거인 (교육부) 교원휴가에 관한 예규 개정 조항 원문을 확인하지 못함 — 법제처 행정규칙 정보에서 해당 예규 전문이 제공되지 않음"
    applicability: "재직 5년 이상 국가공무원(교원 포함)의 장기재직휴가. 국가공무원 복무규정 §20⑱은 5년 이상 3단계로 규정하나, 교원은 (교육부) 교원휴가에 관한 예규 개정에 따라 5~10년 구간(3일)이 적용되지 않아 2026 실무도우미의 2단계 값이 유지됨"
    sources:
      - law_name: "국가공무원 복무규정"
        article: "제20조제18항"
        mst: "287327"
        effective_date: "2026-06-23"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/국가공무원복무규정/제20조"

- id: num-leave-edu-activity-infringement
  type: 수치·기한
  title: 교육활동침해 특별휴가 — 5일 범위(범죄·성폭력범죄 해당 시 5일 범위 추가 가능)
  chapter: 4
  scope: 공통
  summary: 피해 회복 지원을 위해 5일 범위에서 부여하며, 침해행위가 형법상 범죄·성폭력범죄에 해당하면 5일 범위에서 추가 부여할 수 있다(최대 10일).
  body: |
    교원휴가에 관한 예규 제8조① 원문(2026-08-03 korean-law-mcp 재조회): "…피해를 입은
    교원에 대해서는 피해교원의 회복을 지원하기 위해 5일의 범위에서 특별휴가를 부여할 수
    있다. 단, 교육활동 침해행위가 「형법」 제257조부터 제265조까지에 해당하는 범죄 및
    「성폭력범죄의 처벌 등에 관한 특례법」 제2조제1항에 따른 성폭력범죄에 해당할 때에는
    5일의 범위에서 추가로 특별휴가를 부여할 수 있다." 교권보호위원회 개최 전 학교장
    우선 허가 관행은 예규 조문 자체에서 확인되지 않아 별도 지침·실무 관행일 수 있음(확인필요).
  refs: ["교원휴가에 관한 예규 §8①"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-03"

