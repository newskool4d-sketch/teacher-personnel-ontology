- id: moonlight-general
  type: 개념
  title: 겸직허가
  chapter: 4
  scope: 공통
  summary: 국가공무원 복무규정 §25 금지요건 4종에 해당하지 않는 겸직은 §26에 따라 기관장 사전허가로 가능.
  body: |
    금지 요건(복무규정 §25, 원문 확인 완료 — 4개 호)에 해당하지 않는 다른 직무를 겸하려는
    경우, 겸직 자체의 사전허가 근거는 §26이다. §26① 원문(2026-08-03 korean-law-mcp
    재조회): "공무원이 제25조의 영리 업무에 해당하지 아니하는 다른 직무를 겸하려는
    경우에는 소속 기관의 장의 사전 허가를 받아야 한다."
  refs: ["국가공무원 복무규정 §25", "국가공무원 복무규정 §26"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-03"

