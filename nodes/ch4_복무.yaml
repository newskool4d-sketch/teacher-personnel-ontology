- id: num-leave-hour-conversion
  type: 수치·기한
  title: 휴가 시간 환산 및 토·공휴일 산입 — 8시간=연가1일, 병가·공가·특별휴가 합산 30일 이상 시 산입
  chapter: 4
  scope: 공통
  summary: 지각·조퇴·외출 누계 8시간을 연가 1일로 환산(질병·부상 외 사유). 같은 연도 내 병가 합산 또는 동일사유 공가·특별휴가 합산이 각각 30일 이상이면 그 휴가기간의 토·공휴일도 일수에 산입한다.
  body: |
    국가공무원 복무규정 §22 원문(2026-08-03 korean-law-mcp 재조회, 시행 2026-06-23):
    "휴가기간 중의 토요일 또는 공휴일은 그 휴가 일수에 산입하지 않는다. 다만, 1. 같은
    연도 내 제18조제1항에 따른 병가 일수를 합한 기간이 30일 이상인 경우 2. 같은 연도
    내 제18조제2항에 따른 병가 일수를 합한 기간이 30일 이상인 경우 3. 동일한 사유로
    인한 공가 일수를 합한 기간이 30일 이상인 경우 4. 동일한 사유로 인한 특별휴가
    일수를 합한 기간이 30일 이상인 경우"에는 산입한다. 즉 "30일 초과"가 아니라
    "30일 이상"이며, 단일 휴가의 연속 사용이 아니라 병가는 **연내 합산**, 공가·특별휴가는
    **동일사유 합산** 기준이다. 대상도 출산·유산사산휴가에 한정되지 않고 특별휴가 전체를
    포함한다.

    지각·조퇴·외출 8시간=연가 1일 환산은 §17④(질병·부상 외 사유) 기준이며, 질병·부상
    사유로 인한 지각·조퇴·외출은 §18①후단에 따라 병가 1일로 환산된다(구분 실무상 유의).
  refs: ["국가공무원 복무규정 §22", "국가공무원 복무규정 §17④", "국가공무원 복무규정 §18①"]
  pages: {중등: "117-235", 초등: "125-256"}
  verified: "2026-08-03"
  legal_review:
    state: verified
    applicable_as_of: "2026-08-03"
    checked_at: "2026-08-03"
    method: "korean-law-mcp 현행 법령 검색 후 §22 공식 원문 대조"
    unresolved: []
    applicability: "국가공무원 복무규정이 적용되는 공무원(교원 포함)의 휴가일수 산정"
    sources:
      - law_name: "국가공무원 복무규정"
        article: "제22조"
        mst: "287327"
        effective_date: "2026-06-23"
        status: "현행"
        official_url: "https://www.law.go.kr/법령/국가공무원복무규정/제22조"

