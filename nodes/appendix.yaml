# 부록 — 교원인사 관련 주요 법령 목록(12종 중 10종을 개관 노드로 편성)
# 출처: 2026_교원인사_실무도우미_정밀분석.md § "### 부록"(인사 관련 법령 12종, 중등 434~437쪽/초등 449~464쪽)
#       + korean-law-mcp 원문 조회(2026-08-02, 구분·공포일·시행일 검증)
# 비고: 12종 중 "교육공무원 징계령"·"교원휴가에 관한 예규" 2종은 이미 ch5_상훈징계.yaml(law-gyoyuk-jinggye-ryeong)·
#       ch4_복무.yaml(law-teacher-leave-rules)에 개관 성격 노드로 편성되어 있어 이 파일에서 중복 생성하지 않음.
#       (구 law-list-appendix 단일노드는 ch1_의의.yaml에서 삭제 — 이 10개 노드 + 위 2개 기존 노드로 대체)

- id: law-gukgong-act
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 국가공무원법 (개관)
  summary: 공무원 신분·임용·복무·징계 등 인사 전반을 규율하는 기본 법률(인사혁신처 소관). 현행 시행일 2026.6.2.
  body: |
    교육공무원은 이 법 §2에 따른 특정직공무원으로 분류되며, 결격사유(§33)·복무(§56~66)·
    징계사유(§78) 등 다수 조문이 교육공무원 인사행정 전반의 총론적 근거가 된다. 세부
    조문별 노드는 law-gukgong-2·law-gukgong-33·law-gukgong-56-66·law-gukgong-78 참고.

    korean-law-mcp 확인(2026-08-02): 법령ID 001719, MST 286457, 공포 2026.6.2./시행
    2026.6.2. 2026.12.3./2026.10.22./2026.10.2. 시행 예정 개정 3건 존재(세부 확인필요).
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuggongmuwon-act
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원법 (개관)
  summary: 교육공무원의 신분·자격·임용·보수·징계 등을 국가공무원법의 특별법으로 규율하는 법률(교육부 소관). 현행 시행일 2026.2.15.
  body: |
    교육공무원의 정의(§2)·휴직(§44~45)·기간제교원(§32)·자격기준 등 인사 전반의 근간이
    되는 법률이다. 세부 조문별 노드는 law-gongmuwon-2·law-gongmuwon-44·law-gongmuwon-45·
    law-gongmuwon-qualification·law-gyoyuggongmuwonbeop-32 참고.

    korean-law-mcp 확인(2026-08-02): 법령ID 001616, MST 273345, 공포 2025.8.14./시행
    2026.2.15. 2026.11.20. 시행 예정 개정 1건 존재(세부 확인필요).
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuk-imyongryeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원임용령 (개관)
  summary: 교육공무원법 위임에 따라 신규채용·전직·전보·파견 등 임용 방법·절차의 세부기준을 정하는 대통령령. 현행 시행일 2025.9.19.
  body: |
    기간제교원 임용(§13)·파견(§7의3) 등 임용 실무의 세부 요건을 규정한다. 관련 노드는
    law-imyongryeong-13(기간제교원 임용)·dispatch-pagyeon(파견) 참고.

    korean-law-mcp 확인(2026-08-02): 법령ID 002583, MST 273697, 공포 2025.9.16./시행
    2025.9.19.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuk-seungjin-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 승진규정 (개관)
  summary: 경력평정·근무성적평정·연수성적평정 등 교육공무원 승진임용의 기준을 정하는 대통령령. 현행 시행일 2026.6.16.
  body: |
    교감·교장 등으로의 승진임용에 활용하는 평정 요소·산정 방식을 규정한다. 이 온톨로지에는
    아직 승진 평정 관련 세부 노드가 편성되어 있지 않으며, 향후 관련 개념(경력평정·근무성적
    평정 등)을 추가할 때 이 노드를 근거법령으로 연결할 것을 권장한다.

    korean-law-mcp 확인(2026-08-02): 법령ID 002580, MST 287009, 공포 2026.6.16./시행
    2026.6.16.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuk-insagwalli-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 인사관리규정 (개관)
  summary: 인사관리 운영의 기본원칙·세부 지침을 정하는 교육부 훈령(행정규칙). 정확한 조문 구성·시행일은 확인필요.
  body: |
    법률·대통령령이 아닌 교육부 훈령(행정규칙) 형식으로, 인사관리 운영에 관한 세부 지침
    성격을 가진다. 별도 시행일이 공포일과 구분되어 명시되지 않아 확인필요.

    korean-law-mcp 확인(2026-08-02): 행정규칙일련번호 2100000250466, 행정규칙ID 20568,
    공포 2024.12.10., 구분 훈령, 소관 교육부.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuk-insawiwonhoe-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 인사위원회 규정 (개관)
  summary: 교육공무원 인사에 관한 사항을 심의하는 인사위원회의 구성·기능·운영을 정하는 대통령령. 현행 시행일 2013.6.12.
  body: |
    징계위원회(discipline-committee, 교육공무원 징계령 근거)와는 별개로 승진·전보 등
    일반 인사 사항을 심의하는 인사위원회의 근거 법령이다 — 명칭이 유사하니 혼동 주의.

    korean-law-mcp 확인(2026-08-02): 법령ID 002582, MST 140704, 공포 2013.5.31./시행
    2013.6.12.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gukgong-bokmu-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 국가공무원 복무규정 (개관)
  summary: 근무시간·초과근무·연가 등 국가공무원법 복무 의무(§56~66)의 세부 시행기준을 정하는 대통령령. 현행 시행일 2026.6.23.
  body: |
    국가공무원법 복무 장(law-gukgong-56-66)의 위임에 따른 시행령으로, 교원 복무의 세부
    기준에도 준용된다. 다만 교원 근무시간(work-hours-teacher)의 직접 근거는 실무도우미
    원문상 1985년 문교부 예규로 파악되어 이 노드와 근거법령 엣지로 직접 연결하지는
    않았다 — 두 규범의 정확한 적용 관계는 원문 대조가 필요하다(확인필요).

    korean-law-mcp 확인(2026-08-02): 법령ID 002643, MST 287327, 공포 2026.6.23./시행
    2026.6.23.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuk-insagirok-gyuchik
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 인사기록 및 인사사무 처리 규칙 (개관)
  summary: 인사기록카드 작성·관리, 임용·퇴직 등 인사사무 처리 절차·보고기한을 정하는 교육부령. 현행 시행일 2026.4.14.
  body: |
    NEIS 인사기록카드 재사용 금지(neis-contract-no-reuse-record) 등 인사사무 실무의
    직접 근거다. §20(인사 보고)은 발령일부터 7일 이내 보고를 규정한다(num-contract-report-deadline
    조사 결과) — 실무상 통용되는 "공립 5일" 수치의 근거 조문은 이 규칙에서 확인되지
    않아 별도 확인필요(시도교육청 자체 지침일 가능성).

    korean-law-mcp 확인(2026-08-02): 법령ID 006542, MST 285461, 공포 2026.4.14./시행
    2026.4.14.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

- id: law-gyoyuk-jinggyeyangjeong-gyuchik
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 징계양정 등에 관한 규칙 (개관)
  summary: 비위 유형별 징계 양정기준(별표)·징계 감경 기준 등을 정하는 교육부령. 현행 시행일 2025.12.23.
  body: |
    징계양정기준 별표(num-discipline-standard-table)·음주운전 징계기준(별표1의5,
    num-discipline-dui-standard) 등의 직접 근거다. 교육공무원 징계위원회의 구성·절차를
    정하는 교육공무원 징계령(law-gyoyuk-jinggye-ryeong, 별개의 대통령령)과는 다른
    법령이니 혼동하지 않도록 주의 — 이 규칙은 "양정 기준"을, 징계령은 "위원회 구성·
    절차"를 규율한다. 별표1의4·1의5 세부개정일(실무도우미 원문 2025.12.30. 표기)은
    이번 조회의 공포일(2025.12.23.)과 차이가 있어 정확한 개정 이력은 원문 대조가
    필요하다(확인필요).

    korean-law-mcp 확인(2026-08-02): 법령ID 006546, MST 280727, 공포 2025.12.23./시행
    2025.12.23.
  refs: []
  pages: {중등: "434-437", 초등: "449-464"}
  verified: "2026-08-02"

