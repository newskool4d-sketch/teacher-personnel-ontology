# 부록 — 교원인사 관련 주요 법령 목록(12종 중 10종을 개관 항목으로 편성)
# 출처: 실무도우미 원문 직접 대조 — 중등판 435~437쪽 「인사 관련 주요 법규 목록」,
#       초등판 449~451쪽 「Ⅰ 교육공무원 인사 관련 법령」(2026-08-06 PDF 원문 재확인)
#       + korean-law-mcp 원문 조회(2026-08-02·2026-08-06, 구분·공포일·시행일 검증)
# 비고: 12종 중 "교육공무원 징계령"·"교원휴가에 관한 예규" 2종은 이미 ch5_상훈징계.yaml(law-gyoyuk-jinggye-ryeong)·
#       ch4_복무.yaml(law-teacher-leave-rules)에 개관 성격 항목으로 편성되어 있어 이 파일에서 중복 생성하지 않음.
#       (구 law-list-appendix 단일항목은 ch1_의의.yaml에서 삭제 — 이 10개 항목 + 위 2개 기존 항목으로 대체)
#
# 2026-08-06 검증 메모(공개 화면에 노출하지 않음):
#   - 실무도우미 12종 목록에 승진규정·인사관리규정·인사위원회 규정 3종 모두 정식 수록 확인
#     (중등 435~437쪽 5·6·7번, 초등 449~451쪽 5·6·7번 — 번호까지 동일).
#   - 인사관리규정: 실무도우미 "[시행 2024.12.10.] [교육부훈령 제500호, 2024.12.10., 일부개정]"과
#     현행 조회(공포 2024.12.10.)가 정확히 일치. 이전 버전에 "시행일 미명시"로 잘못 기술했던 것을 정정함.
#   - 법령 호수(제N호)는 실무도우미 원문 표기만 신뢰 가능 — korean-law-mcp search_law/get_law_text
#     API는 공포일·시행일만 반환하고 공포번호(호수)는 제공하지 않음(2026-08-06 확인). 따라서 본문의
#     "현행" 행에는 호수를 적지 않고 공포일·시행일만 기재한다(추측 기재 금지).
#   - 국가공무원법·교육공무원법은 중등판과 초등판의 실무도우미 표기 자체가 서로 다르다(개정 시차 반영).
#     특히 교육공무원법은 초등판 표기(법률 제21008호·시행 2026.2.15.)가 현행과 정확히 일치해
#     초등판이 더 최신 발간본임을 보여준다. 국가공무원법은 동일 호수(제20627호)인데도 중등판
#     "시행 2024.12.31."·초등판 "시행 2025.7.1."로 시행일 표기가 갈린다 — 실무도우미 원문 자체의
#     불일치이므로 두 표기를 있는 그대로 병기하고 임의로 하나를 선택하지 않는다.
#   - 소관 부서명은 실무도우미 원문의 담당과 표기를 따르되, 중등판·초등판이 조직 개편 시차로
#     다른 과명을 쓰는 경우(예: 인재양성정책과 ↔ 대학정책과) 대표 부서명(교육부/인사혁신처)만
#     본문에 남기고 세부 담당과 명칭은 생략함 — 담당과명은 조직 개편으로 자주 바뀌어 과명 자체를
#     본문에 고정하면 오히려 낡은 정보가 될 위험이 큼.
#   - 승진규정: 승진 평정(경력평정·근무성적평정) 세부 항목이 아직 편성되어 있지 않음.
#     향후 추가 시 이 항목을 근거법령으로 연결할 것.
#   - 국가공무원 복무규정: 교원 근무시간(num-work-hours-teacher)의 직접 근거가 1985년 문교부 예규로
#     파악되어 근거법령 연결을 걸지 않음. 두 규범의 적용 관계 확인 후 연결 여부 재검토.
#   - pages를 기존 "434-437/449-464"(부록 전체, 조견표·Q&A 색인 포함)에서 법령 목록이 실제로 실린
#     "435-437/449-451"로 좁힘 — 조견표(초등 452~459쪽)·Q&A 색인(초등 460~464쪽)은 이 개관 항목이
#     아니라 각 개별 조문·수치 항목에서 참조할 성격이라 판단.

- id: law-gukgong-act
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 국가공무원법 (개관)
  summary: 공무원 신분·임용·복무·징계 등 인사 전반을 규율하는 기본 법률(인사혁신처 소관). 현행 시행일 2026.6.2.
  body: |
    교육공무원은 이 법 제2조에 따른 특정직공무원으로 분류된다. 결격사유(제33조)·복무
    (제56조부터 제66조까지)·징계 사유(제78조) 등 여러 조문이 교육공무원 인사행정 전반의
    총론적 근거가 된다. 소관 부서는 인사혁신처다.

    조문별 세부 내용은 [국가공무원법 제2조](#/node/law-gukgong-2)·
    [제33조 결격사유](#/node/law-gukgong-33)·
    [제56조부터 제66조까지 복무](#/node/law-gukgong-56-66)·
    [제78조 징계 사유](#/node/law-gukgong-78) 항목에서 확인한다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미 중등판 | 실무도우미 초등판 | 현행(2026.8.6. 확인) |
    | --- | --- | --- | --- |
    | 법령 호수 | 법률 제20627호(2024.12.31. 일부개정) | 법률 제20627호(2024.12.31. 일부개정) | 원문에서 확인 |
    | 시행일 | 2024.12.31. | 2025.7.1. | 2026.6.2. |

    같은 호수인데도 중등판과 초등판의 시행일 표기가 다르다 — 실무도우미 원문 자체의 표기
    차이이므로 어느 한쪽을 정답으로 단정하지 않는다. 현행 기준으로는 2026.6.2. 공포·시행이
    가장 최신이며, 이후 시행 예정 개정이 3건(2026.10.2. / 2026.10.22. / 2026.12.3.) 더
    남아 있다. 시행 예정 개정의 구체적 내용은 공포된 법령 원문과 소속 시·도교육청 지침에서
    확인한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyukgongmuwon-act
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원법 (개관)
  summary: 교육공무원의 신분·자격·임용·보수·징계 등을 국가공무원법의 특별법으로 규율하는 법률(교육부 소관). 현행 시행일 2026.2.15.
  body: |
    교육공무원의 정의(제2조)·휴직(제44조·제45조)·기간제교원(제32조)·자격기준 등 교원인사
    전반의 근간이 되는 법률이다. 국가공무원법에 대한 특별법이므로, 같은 사항을 두 법이
    함께 규정할 때는 이 법이 우선 적용된다. 소관 부서는 교육부다.

    조문별 세부 내용은 [교육공무원법 제2조](#/node/law-gyoyukgongmuwon-2)·
    [제44조 휴직](#/node/law-gyoyukgongmuwon-44)·
    [제45조 휴직기간](#/node/law-gyoyukgongmuwon-45)·
    [제9조·별표1 교육전문직원 자격기준](#/node/law-gyoyukgongmuwon-qualification)·
    [제32조 기간제교원](#/node/law-gyoyukgongmuwon-32) 항목에서 확인한다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미 중등판 | 실무도우미 초등판 | 현행(2026.8.6. 확인) |
    | --- | --- | --- | --- |
    | 법령 호수 | 법률 제20783호(2025.3.18. 일부개정) | 법률 제21008호(2025.8.14. 일부개정) | 원문에서 확인 |
    | 시행일 | 2025.9.19. | 2026.2.15. | 2026.2.15. |

    초등판 표기가 현행과 정확히 일치한다 — 초등판이 중등판보다 더 최근에 발간되어 개정
    내용을 먼저 반영한 것으로 보인다. 이후 시행 예정 개정이 1건(2026.11.20.) 더 남아
    있으며, 구체적 내용은 공포된 법령 원문과 소속 시·도교육청 지침에서 확인한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyuk-imyongryeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원임용령 (개관)
  summary: 교육공무원법 위임에 따라 신규채용·전직·전보·파견 등 임용 방법과 절차의 세부기준을 정하는 대통령령. 현행 시행일 2025.9.19.
  body: |
    교육공무원법이 정한 임용의 큰 틀을 받아, 실제 임용 실무에서 적용할 세부 요건과 절차를
    규정한다. 기간제교원 임용(제13조)·파견(제7조의3) 등이 대표적이다. 소관 부서는
    교육부다.

    관련 항목은 [기간제교원의 임용](#/node/law-imyongryeong-13)·
    [파견](#/node/dispatch-pagyeon)에서 확인한다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 법령 호수 | 대통령령 제35744호(2025.9.16. 일부개정) | 원문에서 확인 |
    | 시행일 | 2025.9.19. | 2025.9.19. |

    실무도우미 표기와 현행이 정확히 일치한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyuk-seungjin-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 승진규정 (개관)
  summary: 경력평정·근무성적평정·연수성적평정 등 교육공무원 승진임용의 기준을 정하는 대통령령. 현행 시행일 2026.6.16.
  body: |
    교감·교장 등으로 승진임용할 때 활용하는 평정 요소와 점수 산정 방식을 규정한다. 평정
    요소는 크게 경력평정·근무성적평정·연수성적평정으로 나뉜다. 소관 부서는 교육부다.

    이 안내서에는 아직 승진 평정에 관한 세부 항목이 실려 있지 않으므로, 구체적인 평정
    기준과 배점은 규정 원문과 소속 시·도교육청의 승진임용 지침에서 확인해야 한다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 법령 호수 | 대통령령 제33528호(2023.6.13. 일부개정) | 원문에서 확인 |
    | 시행일 | 2024.3.1. | 2026.6.16. |

    실무도우미 발간 이후 개정이 있었다. 승진임용 업무는 실무도우미가 아니라 규정 원문과
    소속 시·도교육청의 최신 승진임용 지침을 기준으로 판단해야 한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyuk-insagwalli-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 인사관리규정 (개관)
  summary: 인사관리 운영의 기본원칙과 세부 지침을 정하는 교육부 훈령(행정규칙). 현행 시행일 2024.12.10.
  body: |
    법률이나 대통령령이 아니라 교육부 훈령, 즉 행정규칙 형식이다. 인사관리 운영에 관한
    세부 지침 성격을 가지며, 법령의 빈 곳을 메우는 내부 기준으로 작동한다. 소관 부서는
    교육부다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 규칙 호수 | 교육부훈령 제500호(2024.12.10. 일부개정) | 원문에서 확인 |
    | 시행일 | 2024.12.10. | 2024.12.10. |

    실무도우미 표기와 현행이 정확히 일치한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyuk-insawiwonhoe-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 인사위원회 규정 (개관)
  summary: 교육공무원 인사에 관한 사항을 심의하는 인사위원회의 구성·기능·운영을 정하는 대통령령. 현행 시행일 2013.6.12.
  body: |
    승진·전보 등 일반 인사 사항을 심의하는 **인사위원회**의 근거 법령이다. 소관 부서는
    교육부다.

    > **이름이 비슷한 두 위원회 구분**
    > 인사위원회는 승진·전보 등 일반 인사를 심의하고,
    > [징계위원회](#/node/discipline-committee)는 징계 사건을 의결한다.
    > 근거 법령도 각각 이 규정과 교육공무원 징계령으로 서로 다르다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 법령 호수 | 대통령령 제24548호(2013.5.31. 일부개정) | 원문에서 확인 |
    | 시행일 | 2013.6.12. | 2013.6.12. |

    실무도우미 표기와 현행이 정확히 일치한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gukgong-bokmu-gyujeong
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 국가공무원 복무규정 (개관)
  summary: 근무시간·초과근무·연가 등 국가공무원법의 복무 의무를 구체화한 대통령령. 현행 시행일 2026.6.23.
  body: |
    [국가공무원법 제56조부터 제66조까지](#/node/law-gukgong-56-66)가 정한 복무 의무의
    시행 기준을 구체적으로 정하는 대통령령으로, 교원 복무의 세부 기준에도 준용된다.
    소관 부서는 인사혁신처다.

    다만 [교원 근무시간](#/node/num-work-hours-teacher)의 직접 근거는 실무도우미 원문상
    1985년 문교부 예규로 파악된다. 이 규정과 문교부 예규 중 어느 것이 교원 근무시간에
    적용되는지는 두 규범의 원문을 대조해 확인해야 한다(확인필요).

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 법령 호수 | 대통령령 제35893호(2025.12.4. 일부개정) | 원문에서 확인 |
    | 시행일 | 2025.12.4. | 2026.6.23. |

    실무도우미 발간 이후 개정이 있었다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyuk-insagirok-gyuchik
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 인사기록 및 인사사무 처리 규칙 (개관)
  summary: 인사기록카드 작성·관리와 임용·퇴직 등 인사사무의 처리 절차·보고기한을 정하는 교육부령. 현행 시행일 2026.4.14.
  body: |
    인사기록카드를 어떻게 작성하고 관리할지, 임용·퇴직 등을 언제까지 보고할지를 정하는
    인사사무 실무의 직접 근거다. [NEIS 인사기록카드 재사용 금지](#/node/neis-contract-no-reuse-record)도
    이 규칙에서 나온다. 소관 부서는 교육부다.

    제20조(인사 보고)는 발령일부터 **7일 이내** 보고하도록 규정한다. 실무에서 흔히 쓰이는
    "공립 5일"이라는 기한은 이 규칙에서 확인되지 않으므로, 소속 시·도교육청의 자체 지침을
    확인해야 한다([계약제 교원 채용·퇴직 보고기한](#/node/num-contract-report-deadline) 참조).

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 규칙 호수 | 교육부령 제285호(2022.10.18. 일부개정) | 원문에서 확인 |
    | 시행일 | 2023.3.1. | 2026.4.14. |

    실무도우미 발간(2023.3.1. 기준) 이후 여러 차례 개정이 있었다. 인사사무 처리 절차·
    보고기한을 판단할 때는 실무도우미가 아니라 규칙 원문을 기준으로 확인해야 한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gyoyuk-jinggyeyangjeong-gyuchik
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 교육공무원 징계양정 등에 관한 규칙 (개관)
  summary: 비위 유형별 징계 양정기준(별표)과 징계 감경 기준 등을 정하는 교육부령. 현행 시행일 2025.12.23.
  body: |
    어떤 비위에 어느 수준의 징계를 매길지를 정하는 규칙으로,
    [징계양정기준 별표](#/node/num-discipline-standard-table)와
    [음주운전 징계기준](#/node/num-discipline-dui-standard)의 직접 근거다. 소관 부서는
    교육부다.

    > **이름이 비슷한 두 법령 구분**
    > 이 규칙은 **양정 기준**, 즉 징계 수위를 정한다.
    > [교육공무원 징계령](#/node/law-gyoyuk-jinggye-ryeong)은 **위원회 구성과 절차**를 정한다.
    > 이름이 비슷하지만 서로 다른 법령이므로 근거를 인용할 때 혼동하지 않도록 주의한다.

    별표1의4(성비위)·별표1의5(음주운전)의 세부 개정일은 실무도우미 원문이 2025.12.30.로
    표기하나 조회된 공포일은 2025.12.23.로 차이가 있다. 정확한 개정 이력은 규칙 원문으로
    대조해야 한다(확인필요).

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 규칙 호수 | 교육부령 제371호(2025.12.23. 일부개정) | 원문에서 확인 |
    | 시행일 | 2025.12.23. | 2025.12.23. |

    실무도우미 표기와 현행이 정확히 일치한다.
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"

- id: law-gukgong-bokmujinggye-yegyu
  type: 법령·조문
  chapter: 0
  scope: 공통
  title: 국가공무원 복무·징계 관련 예규 (개관)
  summary: 복무 점검과 징계 처리의 실무기준을 정하는 인사혁신처 예규. 현행 공포일 2026.6.23.
  body: |
    법령을 실제 사건에 적용할 때 참고하는 인사혁신처의 실무기준이다. 법령은 아니지만
    복무 점검과 징계 처리의 통일적 운영을 위해 널리 원용된다. 소관 부서는 인사혁신처다.

    **실무도우미 표기와 현행 비교**

    | 구분 | 실무도우미(중등·초등 동일) | 현행(2026.8.6. 확인) |
    | --- | --- | --- |
    | 예규 호수 | 인사혁신처예규 제203호(2025.12.31. 일부개정) | 원문에서 확인 |
    | 시행일 | 2026.1.1. | 공포 2026.6.23. |

    실무도우미 발간 이후 추가 개정이 있었던 것으로 보인다. 현행 예규 번호와 시행일은
    인사혁신처 공고 원문으로 확인해야 한다(확인필요).
  refs: []
  pages: {중등: "435-437", 초등: "449-451"}
  verified: "2026-08-06"
